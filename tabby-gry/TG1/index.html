<!DOCTYPE html>






<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tabby — Dom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
canvas#gc{display:block;width:100%;height:100%;cursor:pointer}
#info{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:12px;pointer-events:none;z-index:5;text-align:center}
#start-info{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;padding:18px 36px;border:2px solid rgba(255,255,255,0.2);border-radius:12px;background:rgba(0,0,0,0.6);pointer-events:none;z-index:25;text-align:center}
#cam-flash{position:fixed;top:70px;left:50%;transform:translateX(-50%);color:#88ccff;font-size:14px;font-weight:bold;z-index:15;display:none;background:rgba(0,0,0,0.5);padding:4px 14px;border-radius:8px}
/* MOBILE */
#touch-controls{display:none;position:fixed;inset:0;z-index:10;pointer-events:none}
.touch-active #touch-controls{display:block}
.tc-btn{position:absolute;width:70px;height:60px;border-radius:14px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,0.75);user-select:none;-webkit-user-select:none;pointer-events:auto}
.tc-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.93)}
#tc-l-fwd{left:10px;bottom:80px}
#tc-l-back{left:10px;bottom:10px}
#tc-r-right{right:10px;bottom:80px}
#tc-r-left{right:10px;bottom:10px}
</style>
</head>
<body>
<div id="start-info">Kliknij, aby wejść do domu</div>
<div id="cam-flash"></div>
<div id="interact-prompt" style="position:fixed;bottom:25%;left:50%;transform:translateX(-50%);z-index:20;display:none;background:rgba(0,0,0,0.7);border:2px solid rgba(255,255,255,0.3);color:#fff;padding:10px 24px;border-radius:10px;font-size:15px;font-weight:bold;text-align:center;pointer-events:none">Naciśnij E</div>
<div id="drive-info" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:none;background:rgba(0,0,0,0.7);border:1px solid rgba(255,200,50,0.4);color:#ffcc44;padding:8px 20px;border-radius:10px;font-size:13px;font-weight:bold;text-align:center;pointer-events:none">🚗 WASD = jazda • Tab = kamera • E = wysiądź</div>
<div id="text-popup" style="position:fixed;bottom:10%;left:50%;transform:translateX(-50%);z-index:22;display:none;background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.2);color:#e6edf3;padding:16px 28px;border-radius:12px;font-size:15px;max-width:500px;text-align:center;line-height:1.6"><span id="tp-text"></span><span style="font-size:11px;color:#888;margin-top:8px;display:block">Naciśnij E aby zamknąć</span></div>
<div id="info">WASD = ruch • Shift = bieg • Space = skok • Tab = kamera • E = interakcja</div>
<div id="touch-controls">
  <div class="tc-btn" id="tc-l-fwd">▲</div>
  <div class="tc-btn" id="tc-l-back">▼</div>
  <div class="tc-btn" id="tc-r-right">►</div>
  <div class="tc-btn" id="tc-r-left">◄</div>
</div>

  var ib=new THREE.Box3();inner.children.forEach(function(k){if(!k.geometry.boundingBox)k.geometry.computeBoundingBox();ib.union(k.geometry.boundingBox.clone().applyMatrix4(k.matrix));});
  var ic=new V();ib.getCenter(ic);inner.position.set(-ic.x,-ib.max.y,-ic.z); // środek, górna krawędź w 0

    if(a1<fC-len/2||a0>fC+len/2)return;var u0=Math.min(p.b.min.dot(up),p.b.max.dot(up));if(u0<uLow)uLow=u0;});

  var B=fps?WPN.fps:WPN.tps,on=!!(B&&B.laser&&WPN.laserOn&&(fps||WPN.readyOn)&&pLock);
  if(!on){WPN.beam.visible=false;WPN.dot.visible=false;return;}
  var now=(DRV.time||0);if(!WPN.tg||now-WPN.tgT>0.4||now<WPN.tgT){WPN.tg=wpnTargets();WPN.tgT=now;}
  cam.updateMatrixWorld(true);if(charGroup)charGroup.updateMatrixWorld(true);
  var V=THREE.Vector3,o=new V(),d=new V(),lp=new V();cam.getWorldPosition(o);cam.getWorldDirection(d);B.laser.getWorldPosition(lp);
  var rc=WPN.rc,range=drvNum(WPN.act&&WPN.act.range,90);rc.set(o,d);rc.near=0;rc.far=range;
  var t0=Math.max(0,lp.clone().sub(o).dot(d)),hs=rc.intersectObjects(WPN.tg,false),hp=null;
  for(var i=0;i<hs.length;i++){if(hs[i].distance>t0-0.05&&hs[i].object.visible){hp=hs[i].point;break;}}
  var end=hp||o.clone().addScaledVector(d,range);
  var L=lp.distanceTo(end);if(L<0.05){WPN.beam.visible=false;WPN.dot.visible=false;return;}
  WPN.beam.visible=true;WPN.beam.position.copy(lp).lerp(end,0.5);WPN.beam.scale.set(0.012,0.012,L);WPN.beam.lookAt(end);
  WPN.dot.visible=!!hp;if(hp){WPN.dot.position.copy(hp).addScaledVector(d,-0.04);WPN.dot.scale.setScalar(0.16+Math.min(0.3,L*0.006));}
}
// przeładowanie: 0,15 s magazynek wypada • 0,85 s nowy wchodzi • 1,2 s zamek • koniec: naboje z zapasu do magazynka
function wpnReloadTick(dt){
  if(WPN.autoRl>0){WPN.autoRl-=dt;if(WPN.autoRl<=0)wpnReload();}
  var am=wpnAmmo(WPN.po);
  if(WPN.rl>0&&am){
    WPN.rl+=dt;var t=WPN.rl,f=WPN.rlF,a=WPN.act||{};
    if(!f.out&&t>0.15){f.out=true;wpnMagVis(false);wpnDropMag();wpnSnd('magout');}
    if(!f.inn&&t>0.85){f.inn=true;wpnMagVis(true);wpnSnd('magin');}
    if(!f.sl&&t>1.2){f.sl=true;wpnSnd('slide');}
    if(t>=WPN.rlDur){var need=drvNum(a.mag,15)-am.cur,take=Math.min(need,am.res);am.cur+=take;am.res-=take;WPN.rl=0;wpnMagVis(true);}
  }
  // licznik w panelu
  if(WPN.ui.am){var txt,cls='';
    if(!am)txt='';else if(WPN.rl>0){txt='przeładowanie…';cls='rl';}
    else{txt=am.cur+' / '+am.res;cls=am.cur===0?'no':(am.cur<=3?'lo':'');if(WPN.amFlash>0){WPN.amFlash-=dt;cls='up';}}
    if(txt+cls!==WPN.amTxt){WPN.amTxt=txt+cls;WPN.ui.am.textContent=txt;WPN.ui.am.className='am '+cls;}}
  if(!(WPN.rl>0))return 0;
  return Math.sin(Math.PI*Math.min(1,WPN.rl/WPN.rlDur));
}
function wpnFxTick(dt){
  if(WPN.light&&WPN.light.intensity>0){WPN.light.intensity*=Math.exp(-dt*35);if(WPN.light.intensity<0.05)WPN.light.intensity=0;}
  if(WPN.flashT>0){WPN.flashT-=dt;if(WPN.flashT<=0)[WPN.tps,WPN.fps].forEach(function(B){if(B){B.f1.visible=false;B.f2.visible=false;}});}
  for(var i=WPN.fx.length-1;i>=0;i--){
    var f=WPN.fx[i],m=f.m,t;f.age+=dt;t=Math.min(1,f.age/f.life);
    if(f.type==='tr'){m.scale.x=m.scale.y=0.014*(1-t);}
    else if(f.type==='sp'){f.v.y-=9.8*dt;m.position.addScaledVector(f.v,dt);m.scale.setScalar((f.sc||0.022)*Math.max(0.05,1-t));}
    else if(f.type==='pf'){m.position.addScaledVector(f.v,dt);f.v.multiplyScalar(Math.exp(-dt*3));m.scale.setScalar(f.s0+f.gr*f.age);m.material.opacity=f.op*(1-t);}
    else if(f.type==='dr'){
      f.vy-=9.8*dt;m.position.y+=f.vy*dt;m.rotation.y+=dt*(f.vy>0?4:1.5);
      if(m.position.y<=f.floor){m.position.y=f.floor;if(f.vy<-1.2){f.vy=-f.vy*0.25;wpnSnd('drop',Math.min(1,-f.vy));}else f.age=f.life;}
    }
    if(f.age>=f.life){if(f.type!=='dr'){if(m.parent)m.parent.remove(m);if(f.own&&m.material)m.material.dispose();}WPN.fx.splice(i,1);}
  }
  for(var q=WPN.mags.length-1;q>=0;q--){var M=WPN.mags[q];M.age+=dt;
    if(!M.rest){M.v.y-=9.8*dt;M.g.position.addScaledVector(M.v,dt);M.g.rotation.x+=M.rx*dt;M.g.rotation.z+=M.rz*dt;
      if(M.g.position.y<=M.floor+0.03){M.g.position.y=M.floor+0.03;
        if(M.v.y<-1.2&&M.bn<1){M.bn++;M.v.y=-M.v.y*0.25;M.v.x*=0.5;M.v.z*=0.5;wpnSnd('drop',0.5);}
        else{M.rest=true;M.g.rotation.set(Math.PI/2,M.g.rotation.y,0);M.g.position.y=M.floor+0.03;}}}
    if(M.age>10){wpnKillMag(M);WPN.mags.splice(q,1);}}
  for(var j=WPN.shells.length-1;j>=0;j--){
    var s=WPN.shells[j];s.age+=dt;
    if(!s.rest){
      s.v.y-=9.8*dt;s.m.position.addScaledVector(s.v,dt);s.m.rotation.x+=s.rx*dt;s.m.rotation.z+=s.rz*dt;
      if(s.m.position.y<=s.floor+0.012){s.m.position.y=s.floor+0.012;
        if(s.v.y<-0.8){s.v.y=-s.v.y*0.35;s.v.x*=0.55;s.v.z*=0.55;s.rx*=0.5;s.rz*=0.5;if(s.bn++<2)wpnSnd('shell');}
        else{s.rest=true;s.m.rotation.set(0,s.m.rotation.y,Math.PI/2);}}
    }
    if(s.age>8){s.m.scale.setScalar(Math.max(0.01,9-s.age));if(s.age>9){if(s.m.parent)s.m.parent.remove(s.m);WPN.shells.splice(j,1);}}
  }
}
// ===== 🛸 DRON: baza = lądowisko pod dronem • E bierze na plecy • F rozstawia lądowisko przed tobą i startuje • F w locie = powrót na to lądowisko
//        • przy lądowisku: E na plecy / F start • T w każdej chwili = zostaw drona (sam leci do bazy i ląduje) =====

  cam0:null,camT:0,sv:null,hum:null,noise:0,ui:null,touched:[],props:[],leds:[],keys:{},after:'placed',cruise:0,scanT:0,bases:[]};
// kamera na dronie (ludzik stoi): start, lot, powrót na lądowisko, płynny powrót kamery

function drnAct(){return (DRN.po&&DRN.po.action)||{};}
var DRN_SENS={soft:[1.8,3],norm:[3.2,5],sharp:[6,9]},DRN_SENS_L=['soft','norm','sharp'],DRN_SENS_N={soft:'Łagodna',norm:'Normalna',sharp:'Ostra'};
function drnA(a){a=a||{};return {ctl:a.ctl==='pilot'?'pilot':'easy',sens:DRN_SENS[a.sens]?a.sens:'norm',speed:Math.round(drvNum(a.speed,9)),range:Math.round(drvNum(a.range,80)),battery:Math.round(drvNum(a.battery,90))};}
function drnLabel(po){
  if(DRN.po===po){
    if(DRN.stage==='placed')return 'E — weź drona z lądowiskiem • F — start • T — zakończ';
    if(DRN.stage==='toBase')return 'Dron wraca na lądowisko…';
    if(DRN.stage==='carry')return 'Masz drona na plecach';
  }
  if(DRN.stage==='carry'||drnFlying()||DRN.stage==='placed')return 'Masz już drona w użyciu (T — zostaw)';

function drnHome(po){if(!po.gr.userData._drnHome){po.gr.userData._drnHome={p:po.gr.position.clone(),r:po.gr.rotation.clone()};DRN.touched.push(po);}}
function drnParts(po){DRN.props=[];DRN.leds=[];po.gr.traverse(function(o){var r=o.userData&&o.userData._role;if(r==='prop')DRN.props.push(o);else if(r==='led')DRN.leds.push(o);});}
// bazy: każde postawione drona dostaje swoje lądowisko (od razu po wstawieniu assetu)
function drnScanBases(dt){
  DRN.scanT-=dt;if(DRN.scanT>0)return;DRN.scanT=1;
  wpnPlaced().forEach(function(po){
    if(!po.action||po.action.type!=='drone'||!po.gr)return;

    var u=po.gr.userData;
    if(!u._drnBase){var b=drnMakePad(true);scene.add(b);u._drnBase=b;DRN.bases.push(b);drnEnsure();} // klawisze drona gotowe od razu
    if(!busy){var b2=u._drnBase,g=po.gr,bx=g.position.x,bz=g.position.z;
      if(Math.abs(b2.position.x-bx)>0.05||Math.abs(b2.position.z-bz)>0.05||!u._drnLift){ // obiekt przesunięty w edytorze — baza idzie za nim
        var base=u._drnLift?g.position.y-0.06:g.position.y;b2.position.set(bx,base,bz);if(!u._drnLift){g.position.y=base+0.06;u._drnLift=true;}}}
  });

}
function drnBasePos(po){var b=po.gr.userData._drnBase;if(b&&!b.visible)b.visible=true;return b?b.position:po.gr.position;}
// E: z bazy albo z lądowiska przed tobą — dron na plecy

function drnMakeCarry(){

// F
function drnPlacePad(){ // lądowisko drona kładziesz przed sobą — od teraz to jego baza
  var fx=-Math.sin(charAng),fz=-Math.cos(charAng),px=charX+fx*1.8,pz=charZ+fz*1.8,py=Math.max(onGr?charY:0,tbTerrH(px,pz));
  if(!DRN.pad){DRN.pad=drnMakePad(true);scene.add(DRN.pad);DRN.po.gr.userData._drnBase=DRN.pad;DRN.bases.push(DRN.pad);}
  DRN.pad.visible=true;DRN.pad.position.set(px,py,pz);return DRN.pad.position;
}
function drnKeyF(){
  if(DRN.stage==='none'){ // start z lądowiska, przy którym stoisz
    var best=null,bd=16;wpnPlaced().forEach(function(po){var b=po.action&&po.action.type==='drone'&&po.gr&&po.gr.userData._drnBase;if(!b||!b.visible||!po.gr.visible)return;
      var dx=charX-b.position.x,dz=charZ-b.position.z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=po;}});
    if(!best)return false;drnEnsure();drnHome(best);DRN.po=best;DRN.pad=best.gr.userData._drnBase;
    if(!DRN.batSet){DRN.bat=drvNum(best.action.battery,90);DRN.batSet=true;}
    DRN.stage='placed';drnStart();return true;
  }
  if(DRN.stage==='carry'){
    var pp=drnPlacePad();drnDropCarry();
    var g=DRN.po.gr;g.visible=true;g.position.set(pp.x,pp.y+0.06,pp.z);g.rotation.set(0,charAng,0);
    DRN.stage='placed';drnStart();return true;
  }
  if(DRN.stage==='placed'&&DRN.pad){var p=DRN.pad.position,dx=charX-p.x,dz=charZ-p.z;if(dx*dx+dz*dz<16){drnStart();return true;}return false;}
  if(DRN.stage==='fly'){drnAutoTo(DRN.pad.position,'return');drnToast('Dron wraca na lądowisko');return true;}
  return false;
}
// T: zostaw drona — koniec operacji, dron sam leci do bazy
function drnKeyT(){
  if(DRN.stage==='none'||DRN.stage==='toBase'||!DRN.po)return false;
  var bp0=drnBasePos(DRN.po),g=DRN.po.gr;
  if(DRN.stage==='carry'){ // kładziesz lądowisko przed sobą, dron sam przelatuje z pleców i na nim ląduje
    bp0=drnPlacePad();drnDropCarry();DRN.x=charX;DRN.y=charY+1.9;DRN.z=charZ;DRN.yaw=charAng;g.visible=true;
    DRN.vx=DRN.vy=DRN.vz=0;drnParts(DRN.po);drnHum(true);drnAutoTo(bp0,'toBase');
  }else if(DRN.stage==='placed'){ // dron już stoi na swoim lądowisku — koniec operacji
    DRN.stage='none';DRN.po=null;drnHud(false);drnToast('Dron zostaje na lądowisku');wpnHint();return true;
  }else{ // w locie: kamera płynnie wraca do ludzika, dron leci do bazy sam
    drnAutoTo(bp0,'toBase');DRN.after='toBase';DRN.stage='landed';DRN.camT=0;DRN.cam0={p:cam.position.clone(),q:cam.quaternion.clone()};drnOwn(false);
  }

  drnToast('Dron wraca na lądowisko');wpnHint();return true;

function drnStart(){
  var g=DRN.po.gr;drnParts(DRN.po);

function drnMakePad(isBase){
  var g=new THREE.Group();g.userData._wfx=true;
  function cyl(r,h,y,c){var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),new THREE.MeshStandardMaterial({color:c,roughness:0.8}));m.position.y=y;m.receiveShadow=true;m.userData._wfx=true;g.add(m);}
  function bx(sx,sz,x,z,c){var m=new THREE.Mesh(new THREE.BoxGeometry(sx,0.01,sz),new THREE.MeshStandardMaterial({color:c,roughness:0.7}));m.position.set(x,0.061,z);m.userData._wfx=true;g.add(m);}
  cyl(0.95,0.05,0.025,isBase?0x23262b:0x2b2e33);cyl(0.86,0.052,0.026,isBase?0xf2c200:0xe8e8e8);cyl(0.78,0.054,0.027,isBase?0x23262b:0x2b2e33);
  var hc=isBase?0xe8e8e8:0xf2c200;bx(0.09,0.62,-0.2,0,hc);bx(0.09,0.62,0.2,0,hc);bx(0.4,0.09,0,0,hc);
  [[0.9,0],[-0.9,0],[0,0.9],[0,-0.9]].forEach(function(q,i){var m=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.04,0.07),new THREE.MeshBasicMaterial({color:i%2?0x33ff66:0xff3333}));m.position.set(q[0],0.07,q[1]);m.userData._wfx=true;g.add(m);});
  return g;
}
// autopilot: najpierw w górę ponad przeszkody, potem górą nad cel, potem pionowo w dół — nigdy nie utknie
function drnAutoTo(p,mode){
  DRN.goal={x:p.x,y:p.y+0.06,z:p.z};DRN.auto=mode;
  var x0=Math.min(DRN.x,p.x)-3,x1=Math.max(DRN.x,p.x)+3,z0=Math.min(DRN.z,p.z)-3,z1=Math.max(DRN.z,p.z)+3,top=0;
  for(var i=0;i<wCols.length;i++){var w=wCols[i];if(w._gone)continue;if(w.x+w.hw<x0||w.x-w.hw>x1||w.z+w.hd<z0||w.z-w.hd>z1)continue;top=Math.max(top,(w.y||0)+(w.h||2));}
  for(var si=0;si<=24;si++){var tq=si/24;top=Math.max(top,tbTerrH(DRN.x+(p.x-DRN.x)*tq,DRN.z+(p.z-DRN.z)*tq)+1);} // ⛰ powrót ponad górami
  DRN.cruise=Math.min(Math.max(40,top+3),Math.max(DRN.y,p.y+4,top+3));
  if(mode==='return')DRN.stage='return';
}
function drnAutoStep(dt){
  var G=DRN.goal,dx=G.x-DRN.x,dz=G.z-DRN.z,d=Math.sqrt(dx*dx+dz*dz),tvx=0,tvz=0,tvy=0;
  if(d>0.25){
    if(DRN.y<DRN.cruise-0.4)tvy=5;                                  // 1) wznieś się
    else{var s=Math.min(10,d*1.8);tvx=dx/d*s;tvz=dz/d*s;tvy=(DRN.cruise-DRN.y)*2;}  // 2) leć górą
  }else{tvy=-Math.max(0.6,Math.min(3.5,(DRN.y-G.y)*1.5));DRN.x+=dx*Math.min(1,dt*6);DRN.z+=dz*Math.min(1,dt*6);} // 3) pionowo w dół
  var a=Math.min(1,dt*3);DRN.vx+=(tvx-DRN.vx)*a;DRN.vz+=(tvz-DRN.vz)*a;DRN.vy+=(tvy-DRN.vy)*Math.min(1,dt*5);
  DRN.x+=DRN.vx*dt;DRN.z+=DRN.vz*dt;DRN.y+=DRN.vy*dt;
  if(d<0.3&&DRN.y<=G.y+0.02){DRN.x=G.x;DRN.z=G.z;DRN.y=G.y;DRN.vx=DRN.vy=DRN.vz=0;return true;}
  return false;
}

    var b=po.gr.userData._drnBase;if(b){b.visible=true;b.position.set(po.gr.position.x,po.gr.position.y-0.06,po.gr.position.z);}});

  RACE.gates.forEach(function(G){if(G.spr){scene.remove(G.spr);G.spr.material.map.dispose();G.spr.material.dispose();}});
  RACE.gates=[];
  list.forEach(function(po){
    var a=po.action,gr=po.gr,G={gr:gr,po:po,n:+a.n,w:drvNum(a.w,4),h:drvNum(a.h,3),yb:drvNum(a.yb,0),t:drvNum(a.t,0.24),frame:!!a.frame,glow:[],flash:0,st:'',spr:null};
    gr.traverse(function(c){if(c.isMesh&&c.userData._role==='glow'){if(!c.userData._rcm){c.material=c.material.clone();c.userData._rcm=1;}c.castShadow=false;G.glow.push(c);}});

function raceTick(dt){
  if(!scene)return;raceScan(dt);
  if(!RACE.gates.length){if(RACE.ui&&RACE.ui.on){RACE.ui.on=false;RACE.ui.hud.style.display='none';RACE.ui.arrow.style.display='none';RACE.ui.end.style.display='none';}return;}
  raceEnsureUI();if(!RACE.ui.on){RACE.ui.on=true;RACE.ui.hud.style.display='block';}
  if(RACE.line)RACE.line.visible=RACE.state!=='run';
  var st=DRN.stage,fl=st==='takeoff'||st==='fly';
  if(st==='takeoff'&&RACE.stg!=='takeoff')raceBegin(); // czas rusza ze startem drona
  RACE.stg=st;
  if(RACE.state==='run'){
    if(!fl)raceAbort();
    else{
      RACE.t+=dt;var p1={x:DRN.x,y:DRN.y+0.2,z:DRN.z};
      if(RACE.lp){var G=RACE.gates[RACE.next];if(G&&G.gr.visible&&raceCross(G,RACE.lp,p1))racePass(G);}
      RACE.lp=p1;
    }
  }
  var tt=performance.now()/1000;
  RACE.gates.forEach(function(G,i){
    raceGateLook(G,raceGateState(i));
    if(G.st==='next')G.spr.position.y=G.sy+Math.sin(tt*3)*0.18;else G.spr.position.y=G.sy;
    if(G.flash>0){G.flash=Math.max(0,G.flash-dt);var k=G.flash/0.45;
      G.glow.forEach(function(m){m.material.emissive.setRGB(0.2+0.8*k,1,0.4+0.6*k);m.material.emissiveIntensity=1+2.5*k;});
      if(G.flash<=0)G.st='';}
  });
  if(RACE.spT>0){RACE.spT-=dt;if(RACE.spT<=0)RACE.ui.split.style.opacity='0';}
  if(RACE.flT>0){RACE.flT=Math.max(0,RACE.flT-dt);RACE.ui.flash.style.opacity=String(RACE.flT/0.35);}
  raceHud();raceArrow();
}

// ===== 📷 KAMERA PRZY ŚCIANACH: nie wchodzi w mur za ludzikiem — zostaje obok niego, z boku, przy ścianie =====
// Gdy za plecami jest ściana, kamera szuka najbliższego wolnego miejsca obok (obraca się wokół ludzika w bok),
// a dopiero gdy nigdzie nie ma miejsca — lekko się podnosi. Nigdy nie podjeżdża bliżej niż ~1,9 m (nie widać „środka” ludzika).

    var x0=w.x-w.hw-m,x1=w.x+w.hw+m,z0=w.z-w.hd-m,z1=w.z+w.hd+m,y0=(w.y||0)-m,y1=(w.y||0)+(w.h||3)+m;
    if(x1<sx0||x0>sx1||z1<sz0||z0>sz1||y1<sy0||y0>sy1)continue;
    if(px>x0&&px<x1&&py>y0&&py<y1&&pz>z0&&pz<z1)continue;
    var t0=0,t1=best,o=[px,py,pz],d=[dx,dy,dz],lo=[x0,y0,z0],hi=[x1,y1,z1],ok=true;
    for(var a=0;a<3&&ok;a++){if(Math.abs(d[a])<1e-6){if(o[a]<lo[a]||o[a]>hi[a])ok=false;continue;}
      var ta=(lo[a]-o[a])/d[a],tb=(hi[a]-o[a])/d[a];if(ta>tb){var q=ta;ta=tb;tb=q;}if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t0>t1)ok=false;}
    if(ok&&t0<best)best=t0;}

}

  var sw=(CCL.f||0)-(CCL.lf===undefined?-9:CCL.lf)>2;CCL.lf=CCL.f||0; // pierwsza klatka po przełączeniu z widoku z oczu (wyjście z windy, ze stanowiska, Tab): kamera startuje tuż za głową i jednym płynnym ruchem odjeżdża do tyłu

function mpStatus(t){MP.err=t;if(MP.ui)MP.ui.st.innerHTML=t;}

// ---------- połączenie ----------
// pokój jest przypisany do tej gry (i tej wersji pliku): kod z innej gry tu nie wpuści
function mpGid(){if(MP.gid)return MP.gid;var el=document.getElementById('editor-data'),s=(el&&el.textContent)||document.title||'tabby',h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}MP.gid=(h>>>0).toString(36);return MP.gid;}
function mpPid(code){return 'tabby-'+mpGid()+'-'+code;}
var MP_MAX=4,MP_SLOTS=8; // do 4 graczy w pokoju; 8 wspólnych pokoi na grę
function mpVer(){return mpGid().slice(0,5).toUpperCase();} // „wersja gry” — u obu graczy musi być taka sama
function mpNoRoom(code){return 'Nie znaleziono pokoju <b>'+mpEsc(code)+'</b> dla tej wersji gry (<b>'+mpVer()+'</b>).<br><span style="font-size:12px;color:#c9d1d9">Sprawdź: ✔ u gospodarza ta sama wersja gry • ✔ gospodarz ma zielony napis „Pokój widoczny w internecie” • ✔ „test w tej przeglądarce” odznaczony u obu</span>';}
// ===== 🛰 WŁASNA CENTRALA (Cloudflare Worker): przekazuje wiadomości między graczami — pewniejsza niż darmowy PeerJS =====
function mpRelay(){return typeof TABBY_RELAY!=='undefined'&&!!TABBY_RELAY;}
function mpRelayUrl(room){var u=String(TABBY_RELAY).trim().replace(/\/+$/,'');if(!/^(https?|wss?):\/\//.test(u))u='https://'+u;return u.replace(/^http/,'ws')+'/room/'+encodeURIComponent(room);}
function mpWsOpen(room,onCount,onFail){ // połącz z pokojem na centrali; onCount(n) = ilu jest w pokoju razem ze mną
  var ws;try{ws=new WebSocket(mpRelayUrl(room));}catch(e){onFail('Zły adres centrali');return null;}
  var got=false;MP.ws=ws;
  ws.onmessage=function(ev){var d;try{d=JSON.parse(ev.data);}catch(e){return;}
    if(d&&d.t==='_n'){if(!got){got=true;onCount(d.n);}return;}
    if(MP.ws===ws)mpMsg(d,null);};
  ws.onerror=function(){if(!got&&MP.ws===ws){got=true;onFail('Nie mogę połączyć się z centralą — sprawdź adres centrali i internet');}};
  ws.onclose=function(){if(MP.ws!==ws)return;MP.ws=null;
    if(!got){got=true;onFail('Centrala zamknęła połączenie');return;}
    if(MP.on){MP.on=false;if(!MP.host&&MP.phase!=='menu')mpHostGone();else{MP.net='fail';MP.err='Utracono połączenie z centralą';mpUIState();}}};
  setTimeout(function(){if(!got&&MP.ws===ws){got=true;try{ws.close();}catch(e){}MP.ws=null;onFail('Centrala nie odpowiada');}},9000);
  return ws;}
function mpWsClose(){if(MP.ws){var w=MP.ws;MP.ws=null;try{w.close();}catch(e){}}}
function mpStartR(host,code,tries){ // pokój prywatny przez własną centralę
  tries=tries||0;
  if(host){mpStatus('');mpEnterLobby();MP.net='wait';
    mpWsOpen(mpPid(code),function(n){if(n>1){mpWsClose();var c2=mpCode();MP.code=c2;if(MP.L)mpBoard(MP.L);mpStartR(true,c2);return;} // kod zajęty — losuję inny
      MP.on=true;MP.net='ok';MP.err='';mpHello();mpUIState();},
      function(m){MP.net='fail';mpStatus(m);});
    return;}
  mpStatus(tries?'Szukam pokoju… ('+tries+'/3)':'Łączenie…');
  mpWsOpen(mpPid(code),function(n){
    if(n<=1){mpWsClose();if(tries<3)setTimeout(function(){if(MP.phase==='menu'&&MP.code===code)mpStartR(false,code,tries+1);},2500);else mpStatus(mpNoRoom(code));return;}
    if(n>MP_MAX){mpWsClose();mpStatus('Ten pokój jest pełny (najwyżej '+MP_MAX+' graczy)');return;}
    MP.on=true;MP.net='ok';mpHello();
    setTimeout(function(){if(MP.phase==='menu'&&MP.code===code&&MP.ws){mpWsClose();MP.on=false;mpStatus(mpNoRoom(code));}},6000);},
    function(m){mpStatus(m);});}
function mpQuickR(n){ // ⚡ szybka gra przez własną centralę
  if(n>MP_SLOTS){mpStatus('Wszystkie wspólne pokoje są pełne — spróbuj za chwilę');return;}
  var code='pub'+n;MP.code=code;MP.slot=n;mpStatus('Szukam graczy… (pokój '+n+')');
  mpWsOpen(mpPid(code),function(c){
    if(c===1){MP.host=true;MP.on=true;MP.net='ok';mpStatus('');mpEnterLobby();mpHello();mpUIState();return;} // nikt nie czeka — zakładam
    if(c>MP_MAX){mpWsClose();mpQuickR(n+1);return;}
    MP.host=false;MP.on=true;mpHello();
    setTimeout(function(){if(MP.phase==='menu'&&MP.pub&&MP.slot===n&&MP.ws){mpWsClose();MP.on=false;Object.keys(MP.rem).forEach(mpDrop);mpQuickR(n+1);}},4000);}, // nikt nie przyjął — następny pokój
    function(m){mpStatus(m);});}
function mpStart(host,code){ // pokój prywatny: tylko z kodem
  mpStop(true);MP.host=host;MP.code=code;MP.pub=false;MP.hostGone=false;MP.net='';MP.local=MP.ui.ov.querySelector('#mp-local').checked;
  if(MP.local){ // test: dwie karty tej samej przeglądarki
    MP.bc=new BroadcastChannel('tabby-mp-'+mpPid(code));MP.bc.onmessage=function(e){mpMsg(e.data,null);};MP.on=true;MP.net='local';
    if(host){mpStatus('');mpEnterLobby();}else{mpStatus('Łączenie…');setTimeout(function(){if(MP.phase==='menu'&&MP.code===code)mpStatus('Nie ma pokoju <b>'+mpEsc(code)+'</b> w tej przeglądarce (tryb testu)');},4000);}
    mpHello();mpUIState();return;}
  if(mpRelay()){mpStartR(host,code);return;} // 🛰 własna centrala
  if(host){mpStatus('');mpEnterLobby();MP.net='wait';} // gospodarz od razu idzie do poczekalni
  else mpStatus('Łączenie…');
  mpLib(function(ok){
    if(!ok){MP.net='fail';mpStatus('Nie udało się uruchomić połączenia — sprawdź internet');return;}
    try{
      if(host){
        MP.peer=new Peer(mpPid(code));
        MP.peer.on('open',function(){MP.on=true;MP.net='ok';MP.err='';mpUIState();});
        MP.peer.on('connection',function(cn){mpConn(cn);});
        setTimeout(function(){if(MP.code===code&&MP.net==='wait'){MP.net='fail';}},12000);
      }else{
        var tries=0,shown=false;MP.peer=new Peer();
        var tryConn=function(){if(MP.phase!=='menu'||MP.code!==code||!MP.peer)return;var cn=MP.peer.connect(mpPid(code),{reliable:true});mpConn(cn);};
        MP.peer.on('open',function(){tryConn();
          setTimeout(function(){if(MP.phase==='menu'&&MP.code===code&&!shown)mpStatus('Pokój <b>'+mpEsc(code)+'</b> jest, ale nie da się połączyć — sieć może blokować bezpośrednie połączenie (np. sieć firmowa/szkolna). Spróbuj innej sieci, np. domowego Wi-Fi.');},14000);});
        MP.peer.on('error',function(e){var t=e&&e.type||'';
          if(t==='peer-unavailable'){if(++tries<4){mpStatus('Szukam pokoju… ('+tries+'/3)');setTimeout(tryConn,2500);}else{shown=true;mpStatus(mpNoRoom(code));}return;}
          shown=true;mpStatus('Błąd połączenia: '+t);});
        return;
      }
      MP.peer.on('error',function(e){var t=e&&e.type||'';MP.net='fail';
        mpStatus('Błąd połączenia: '+t+(t==='unavailable-id'?' — ten kod jest zajęty, odśwież stronę i utwórz pokój jeszcze raz':''));});
    }catch(e){MP.net='fail';mpStatus('Błąd: '+e.message);}
  });
}

  if(MP.local){MP.code='pub1';MP.bc=new BroadcastChannel('tabby-mp-'+mpPid('pub1'));MP.bc.onmessage=function(e){mpMsg(e.data,null);};MP.on=true;

function mpQuickSlot(n,tries){
  if(n>MP_SLOTS){mpStatus('Wszystkie wspólne pokoje są pełne — spróbuj za chwilę');return;}
  var code='pub'+n;MP.code=code;MP.slot=n;mpStatus('Szukam graczy… (pokój '+n+')');
  if(MP.peer){try{MP.peer.destroy();}catch(e){}MP.peer=null;}
  var P=new Peer(),done=false;MP.peer=P;
  function asHost(){if(done)return;done=true;try{P.destroy();}catch(e){}MP.peer=null;mpQuickHost(n,tries);}
  P.on('open',function(){var cn=P.connect(mpPid(code),{reliable:true});cn._slot=n;mpConn(cn);
    cn.on('open',function(){done=true;});
    setTimeout(function(){if(!done&&MP.phase==='menu')asHost();},6000);});
  P.on('error',function(e){if(e&&e.type==='peer-unavailable')asHost();else if(!done){done=true;mpStatus('Błąd połączenia: '+(e&&e.type||''));}});
}
function mpQuickHost(n,tries){ // nikt nie czeka w tym pokoju — zakładam go
  var P=new Peer(mpPid('pub'+n));MP.peer=P;
  P.on('open',function(){MP.host=true;MP.on=true;MP.net='ok';MP.err='';mpStatus('');mpEnterLobby();mpUIState();});
  P.on('connection',function(cn){mpConn(cn);});
  P.on('error',function(e){if(e&&e.type==='unavailable-id'){try{P.destroy();}catch(x){}MP.peer=null;if(tries<3)mpQuickSlot(n,tries+1);else mpQuickSlot(n+1,0);} // ktoś właśnie go założył — dołączam
    else mpStatus('Błąd połączenia: '+(e&&e.type||''));});
}

function mpLib(cb){if(typeof Peer!=='undefined'){cb(true);return;} // biblioteka jest zwykle wklejona w grę; zapas: pobranie z sieci
  var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=function(){cb(typeof Peer!=='undefined');};
  s.onerror=function(){cb(false);};document.head.appendChild(s);}
function mpConn(c){
  c.on('open',function(){
    if(MP.host&&(MP.conns.length>=MP_MAX-1||(MP.pub&&MP.phase==='game'))){try{c.send({t:'full',id:MP.me.id});}catch(e){}setTimeout(function(){try{c.close();}catch(e){}},400);return;} // pokój pełny albo gra już trwa
    MP.conns.push(c);MP.on=true;mpUIState();mpHello();});
  c.on('data',function(d){mpMsg(d,c);});
  c.on('close',function(){MP.conns=MP.conns.filter(function(x){return x!==c;});if(c._pid)mpDrop(c._pid);if(!MP.host&&MP.conns.length===0&&MP.phase!=='menu'){MP.hostGone=true;mpHostGone();}});
}
function mpSend(o){
  if(!MP.on)return;o.id=MP.me.id;
  if(MP.bc){MP.bc.postMessage(o);return;}
  if(MP.ws){if(MP.ws.readyState===1)MP.ws.send(JSON.stringify(o));return;}
  MP.conns.forEach(function(c){if(c.open)c.send(o);});
}
function mpMsg(d,from){
  if(!d||d.id===MP.me.id)return;
  if(from&&!from._pid)from._pid=d.id;
  if(MP.host&&from)MP.conns.forEach(function(c){if(c!==from&&c.open)c.send(d);}); // gospodarz przekazuje dalej
  if(d.t==='full'){if(MP.host||(d.to&&d.to!==MP.me.id))return;if(MP.pub&&MP.ws){mpWsClose();MP.on=false;Object.keys(MP.rem).forEach(mpDrop);mpQuickR((MP.slot||1)+1);return;}if(MP.pub&&!MP.local){try{if(from)from.close();}catch(e){}mpQuickSlot((MP.slot||1)+1,0);}else{mpStop(true);mpStatus('Ten pokój jest pełny (najwyżej '+MP_MAX+' graczy)');}return;}
  if(d.t==='bye'){mpDrop(d.id);return;}
  if(d.t==='ping'){if(MP.host)mpHello();return;}
  if(d.t==='cd'){if(!MP.host){if(d.v!==MP.cd&&d.v>0)mpBeep(660);MP.cd=d.v;}return;}  // odliczanie prowadzi gospodarz
  if(d.t==='go'){if(!MP.host&&MP.ready)mpGo();return;} // na start idą tylko gotowi
  if(!MP.rem[d.id]&&MP.host&&MP.ws&&(Object.keys(MP.rem).length>=MP_MAX-1||(MP.pub&&MP.phase==='game'))){mpSend({t:'full',to:d.id});return;} // centrala: pokój pełny albo gra trwa
  var R=MP.rem[d.id];if(!R){R=mpAvatar(d);MP.rem[d.id]=R;mpUIState();mpHello();} // nowy gracz: przedstawiamy się mu
  R.seen=performance.now();
  if(d.t==='hi'&&d.h&&!MP.host&&MP.phase==='menu'){mpStatus('');mpEnterLobby();} // gospodarz nas przyjął
  if(d.t==='hi'){R.host=!!d.h;if(d.name!==R.name||d.col!==R.col){mpRemoveAv(R);var N=mpAvatar(d);N.tx=R.tx;N.host=R.host;N.ph=R.ph;N.rd=R.rd;MP.rem[d.id]=N;}mpUIState();}
  else if(d.t==='s'){R.tx={x:d.x,y:d.y,z:d.z,a:d.a,m:d.m,r:d.r,w:d.w,v:d.v,dd:d.dd,rt:d.rt||null};R.ph=d.ph||0;R.rd=d.rd||0;if(d.op)mpPoseRecv(d.op,d.id);}
  else if(d.t==='ev'){mpApply(d);}
  else if(d.t==='en'){mpEnmRecv(d);}
  else if(d.t==='f'){mpTracer(d);}
  else if(/^(tr|tc|ts|kl|kb)$/.test(d.t)){if(typeof railNetRecv==='function'&&MP.phase==='game')railNetRecv(d);} // 🚂 kolej i 🚡 kolejka linowa
}

  else if(a.type==='light'){

// ============ COLLISION ============
function collide(nx,nz){
  var STEP=0.5;var floorY=tbTerrH(nx,nz);
  for(var i=0;i<wCols.length;i++){var w=wCols[i],dx=nx-w.x,dz=nz-w.z;
    var ox=w.hw+CR-Math.abs(dx),oz=w.hd+CR-Math.abs(dz);
    if(ox>0&&oz>0){
        var baseY=w.y||0;var topY=baseY+(w.h||2);
        if(w.ramp){var rt=((nx-w.x)*w.ramp[0]+(nz-w.z)*w.ramp[1])/(2*w.ramp[2])+0.5;topY=baseY+(w.h||2)*Math.max(0,Math.min(1,rt));} // schody = gładka pochylnia
        if(baseY>charY+1.8)continue; // np. podłoga piętra nad głową
        if(topY-charY<=STEP&&charY>=baseY-0.1){floorY=Math.max(floorY,topY);}
        else if(charY<topY-STEP){if(ox<oz)nx+=(dx>0?ox:-ox);else nz+=(dz>0?oz:-oz);}
    }
  }
  return[nx,nz,floorY];
}

// ============ UPDATE ============
function update(dt){
  if(drnFlying()){drnStep(dt);wpnUpdate(dt,null);return;} // 🛸 lot drona
  var pivY=charY+CPIVY;
  if(pLock){
    // STEP MOVEMENT (mobile)
    if(isMobile&&stepTarget){
      var sdx=stepTarget.x-charX,sdz=stepTarget.z-charZ;
      var sdist=Math.sqrt(sdx*sdx+sdz*sdz);
      if(sdist<0.15){charX=stepTarget.x;charZ=stepTarget.z;stepTarget=null;isMov=false;}
      else{var ss=STEP_SPEED*dt;charX+=sdx/sdist*Math.min(ss,sdist);charZ+=sdz/sdist*Math.min(ss,sdist);isMov=true;isRun=false;}
      charAng=mobileCamYaw;
      charGroup.position.set(charX,charY,charZ);
      charGroup.rotation.y=charAng;
    }
    // SMOOTH MOVEMENT (desktop)
    if(!isMobile){
      var mx=0,mz=0;
      if(keys.w){mx-=Math.sin(camYaw);mz-=Math.cos(camYaw);}
      if(keys.s){mx+=Math.sin(camYaw);mz+=Math.cos(camYaw);}
      if(keys.a){mx-=Math.cos(camYaw);mz+=Math.sin(camYaw);}
      if(keys.d){mx+=Math.cos(camYaw);mz-=Math.sin(camYaw);}
      var len=Math.sqrt(mx*mx+mz*mz);isMov=len>0.01;isRun=keys.sh&&isMov;
      var sp=(isRun?RSP:WSP)*(WPN.po?1-WPN.aimT*0.3:1)*winSlow();
      if(isMov){mx/=len;mz/=len;tgtAng=Math.atan2(-mx,-mz);
        var res=collide(charX+mx*sp*dt,charZ+mz*sp*dt);charX=res[0];charZ=res[1];var floorY=res[2];}else{var fres=collide(charX,charZ);var floorY=fres[2];}
      var faceCam=camStyle==='fps'||wpnReady();
      var tgt=faceCam?camYaw:tgtAng;var ad=tgt-charAng;
      while(ad>Math.PI)ad-=Math.PI*2;while(ad<-Math.PI)ad+=Math.PI*2;
      charAng+=ad*(faceCam?0.3:TSM);
      var wasGr=onGr&&velY<=0;
      if(keys.sp&&onGr){velY=JF;onGr=false;wasGr=false;}velY-=GR*dt;charY+=velY*dt;
      if(charY<=floorY||(wasGr&&charY-floorY<0.45)){charY=floorY;velY=0;onGr=true;} // przyklejenie do podłoża przy schodzeniu
      else if(charY-floorY>=0.45)onGr=false; // prawdziwe spadanie (np. z krawędzi)
      charGroup.position.set(charX,charY,charZ);
    }
    charGroup.rotation.y=charAng;animCh(dt);
  }

  // CAMERA
  if(isMobile){
    if(window._mobileTurnAnim)window._mobileTurnAnim(dt);
    if(window._mobileHoldCheck)window._mobileHoldCheck();
    camYaw=mobileCamYaw;
    camPitch=1.0;
    charAng=mobileCamYaw;
    charGroup.rotation.y=charAng;
  }
  if(camStyle==='fps'){
    var eyeY=charY+1.6,ld=10;CCL.fovT=undefined;if(renderer.clippingPlanes.length)renderer.clippingPlanes=[]; // widok z oczu: bez przycinania stropu
    cam.position.set(charX,eyeY,charZ);
    cam.lookAt(charX-Math.sin(camYaw)*Math.cos(camPitch)*ld,eyeY-Math.sin(camPitch)*ld,charZ-Math.cos(camYaw)*Math.cos(camPitch)*ld);
  } else {
    camTPS(charX,pivY,charZ,camYaw,camPitch,CDIST,camOff.indoor); // 🎥 na zewnątrz zwykła kamera, w budynku „przez ramię”
  }
  wpnUpdate(dt,camOff.aim);
}

  window._mobileTurnAnim=function(dt){
    if(!turnAnim)return;
    turnAnim.progress+=dt*4.5;
    if(turnAnim.progress>=1){turnAnim.progress=1;camYaw=turnAnim.to;mobileCamYaw=turnAnim.to;turnAnim=null;}
    else{var from=turnAnim.from,to=turnAnim.to,diff=to-from;

      camYaw=from+diff*turnAnim.progress;mobileCamYaw=camYaw;}
  };

    stepTarget={x:charX+d[1]*CELL,z:charZ+d[0]*CELL};}
  function moveBack(){if(stepTarget||turnAnim)return;var d=cardinalDR[facing];

    turnAnim={from:oldYaw,to:facingYaw[facing],progress:0};}

  var holdFn=null;

// 1) Nieruchomy obiekt: zwykłe klocki → jedna bryła z kolorami w wierzchołkach, a wszystkie jego kopie → jeden InstancedMesh.
//    Części specjalne (szyby, światła i ich poświata, części z rolą, niewidzialne strefy, świecące) ZOSTAJĄ osobno —
//    sklejamy resztę („częściowe sklejanie”: domek z 40 klocków i szybą = 2 rysowania zamiast 40).
// 2) Obiekt z akcją (pojazd, drzwi, fizyka…): sklejamy zwykłe klocki wewnątrz obiektu — koła, siedzenia, szyby zostają ruchome.

  if(u._role||u._isGlow||u._hidden||u._kolPart||u._noMerge)return false;
