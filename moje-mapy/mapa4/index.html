<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje opłaty — pobierz apkę</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:radial-gradient(ellipse at 20% 0%,#1a0f2e 0%,#0a0a14 55%,#000 100%);
    color:#e8e8ea;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .box{
    text-align:center;
    max-width:420px;
    width:100%;
  }
  .ikona{font-size:72px;display:block;margin-bottom:16px;filter:drop-shadow(0 4px 18px rgba(255,154,61,0.5))}
  h1{
    font-size:32px;font-weight:700;
    background:linear-gradient(180deg,#ffc94d,#ff9a3d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:8px;
  }
  .opis{
    color:#9a93a8;font-size:14px;line-height:1.6;
    margin-bottom:32px;
  }
  .btn{
    display:inline-block;
    padding:18px 48px;
    border-radius:16px;
    background:linear-gradient(180deg,#ffc94d,#ff9a3d);
    color:#241400;
    font-weight:700;
    font-size:18px;
    text-decoration:none;
    transition:transform .15s,box-shadow .2s;
    box-shadow:0 8px 30px rgba(255,154,61,0.3);
  }
  .btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 40px rgba(255,154,61,0.45);
  }
  .info{
    margin-top:28px;
    font-size:11px;
    color:#6a6478;
    line-height:1.7;
  }
  .wersja{
    margin-top:16px;
    font-size:12px;
    color:#9a93a8;
    letter-spacing:1px;
  }
</style>
</head>
<body>
  <div class="box">
    <span class="ikona">🚗</span>
    <h1>Moje opłaty</h1>
    <p class="opis">Przypominacz terminów opłat — OC, przeglądy, ubezpieczenia.<br>Prywatna apka, bez reklam, działa offline.</p>
    <a href="https://drive.google.com/uc?export=download&id=1hEBcbBarz7BUn9LdUNJL_Tcw5Lzu8eMp" class="btn">⬇ Pobierz apkę</a>
    <p class="info">
      Plik .apk · Android 8.0+<br>
      Po pobraniu otwórz plik i zezwól na instalację.
    </p>
    <p class="wersja">v1.0.0</p>
  </div>
</body>
</html>
