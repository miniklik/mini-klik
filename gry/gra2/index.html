<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory Training</title>
<meta name="description" content="Memory Training — train your brain! Memorize symbols and test your memory endlessly.">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;overflow-x:hidden}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(145deg,hsl(250,20%,8%),hsl(250,25%,14%) 40%,hsl(250,30%,18%));color:#f8f8f2;transition:background .6s}
  *::-webkit-scrollbar{display:none}
  *{scrollbar-width:none;-ms-overflow-style:none}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes particleBurst{0%{transform:translate(-50%,-50%) translate(0,0);opacity:1}100%{transform:translate(-50%,-50%) translate(var(--px),var(--py));opacity:0}}
  @keyframes floatScore{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}
  @keyframes countUp{from{transform:scale(1.4);opacity:.3}to{transform:scale(1);opacity:1}}
  @keyframes cardEnter{0%{opacity:0;transform:translateY(40px) scale(.7) rotateX(30deg)}60%{transform:translateY(-5px) scale(1.05) rotateX(0)}100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}}
  @keyframes cardFlipIn{0%{transform:rotateY(-90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}
  @keyframes ringPulse{0%,100%{filter:drop-shadow(0 0 8px var(--rc))}50%{filter:drop-shadow(0 0 22px var(--rc))}}
  @keyframes introFloat{0%{transform:translateY(100vh) rotate(0deg)}100%{transform:translateY(-100px) rotate(360deg)}}
  @keyframes screenFadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  @keyframes screenFadeOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.97)}}
  @keyframes shimmer{0%{filter:brightness(1)}50%{filter:brightness(1.3)}100%{filter:brightness(1)}}

  #app>.screen-enter{animation:screenFadeIn .35s ease-out both}
  .glass-card{
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    transition:transform .2s,box-shadow .2s;
  }
  .glass-card:hover:not(:disabled){transform:translateY(-4px) scale(1.06);box-shadow:0 8px 30px rgba(0,0,0,.15)!important}
  .glass-card:active:not(:disabled){transform:translateY(-1px) scale(1.02)}
  .tile-btn{transition:all .3s;position:relative;overflow:hidden}
  .tile-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.05)}
  .tile-btn:active:not(:disabled){transform:scale(0.97)}
  .tile-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent 60%);border-radius:inherit;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<script>
var SHAPES_FIGURES=[
  {symbol:"●"},{symbol:"▲"},{symbol:"■"},{symbol:"◆"},
  {symbol:"★"},{symbol:"♥"},{symbol:"⬟"},{symbol:"✦"},{symbol:"▼"}
];
var SHAPES_ANIMALS=[
  {symbol:"🐶"},{symbol:"🐱"},{symbol:"🐻"},{symbol:"🦊"},
  {symbol:"🐸"},{symbol:"🐵"},{symbol:"🦁"},{symbol:"🐯"},{symbol:"🐼"}
];
var SHAPES_PLANTS=[
  {symbol:"🌸"},{symbol:"🌻"},{symbol:"🌵"},{symbol:"🍀"},
  {symbol:"🌹"},{symbol:"🌺"},{symbol:"🍄"},{symbol:"🌿"},{symbol:"🌴"}
];
var CATEGORIES=[
  {id:"figures",name:"Shapes",icon:"🔷",symbols:SHAPES_FIGURES,hue:"250"},
  {id:"animals",name:"Animals",icon:"🐾",symbols:SHAPES_ANIMALS,hue:"30"},
  {id:"plants",name:"Plants",icon:"🌿",symbols:SHAPES_PLANTS,hue:"140"}
];
var COLORS=["#6c63ff","#ff6b6b","#4ecdc4","#ffd93d","#ff8a5c","#a29bfe","#fd79a8","#00cec9","#e17055"];

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function pickN(a,n){return shuffle(a).slice(0,n)}

var SND={muted:true,sounds:{},music:{menu:null,game:null},currentMusic:null};
function sndLoad(n,loop){try{var a=new Audio('sounds/'+n+'.mp3');a.preload='auto';a.loop=!!loop;if(loop)a.volume=0.4;a.addEventListener('error',function(){});return a;}catch(e){return null}}
function sndInit(){
  ['correct','wrong','memorize'].forEach(function(n){SND.sounds[n]=sndLoad(n,false)});
  SND.music.menu=sndLoad('bgm_menu',true);SND.music.game=sndLoad('bgm_game',true);
}
function sndPlay(n){if(SND.muted)return;var s=SND.sounds[n];if(!s)return;try{s.currentTime=0;s.play().catch(function(){})}catch(e){}}
function sndMusic(w){
  if(SND.currentMusic===w)return;
  if(SND.music.menu)try{SND.music.menu.pause();SND.music.menu.currentTime=0}catch(e){}
  if(SND.music.game)try{SND.music.game.pause();SND.music.game.currentTime=0}catch(e){}
  SND.currentMusic=w;if(SND.muted||!w)return;
  var m=SND.music[w];if(m)try{m.play().catch(function(){})}catch(e){}
}
function sndToggleMute(){
  SND.muted=!SND.muted;
  if(SND.muted){if(SND.music.menu)try{SND.music.menu.pause()}catch(e){}if(SND.music.game)try{SND.music.game.pause()}catch(e){}}
  else{if(SND.currentMusic){var m=SND.music[SND.currentMusic];if(m)try{m.play().catch(function(){})}catch(e){}}}
  render();
}

function spawnParticles(x,y,count){
  count=count||12;var wrap=document.createElement("div");
  wrap.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;pointer-events:none;z-index:999;";
  for(var i=0;i<count;i++){
    var ang=(i/count)*360,dist=50+Math.random()*70,sz=4+Math.random()*8;
    var px=Math.cos(ang*Math.PI/180)*dist,py=Math.sin(ang*Math.PI/180)*dist;
    var d=document.createElement("div");
    d.style.cssText="position:absolute;width:"+sz+"px;height:"+sz+"px;border-radius:50%;background:"+COLORS[i%COLORS.length]+";animation:particleBurst .8s cubic-bezier(.25,.46,.45,.94) forwards;transform:translate(-50%,-50%);--px:"+px+"px;--py:"+py+"px;box-shadow:0 0 6px "+COLORS[i%COLORS.length]+"80;";
    wrap.appendChild(d);
  }
  document.body.appendChild(wrap);setTimeout(function(){wrap.remove()},900);
}
function spawnFloatingScore(x,y,text,color){
  var el=document.createElement("div");el.textContent=text;
  el.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;pointer-events:none;z-index:998;font-size:28px;font-weight:900;color:"+color+";text-shadow:0 2px 10px "+color+"60;animation:floatScore 1.2s cubic-bezier(.25,.46,.45,.94) forwards;transform:translateX(-50%);";
  document.body.appendChild(el);setTimeout(function(){el.remove()},1300);
}

var S={
  screen:"intro",category:"figures",symbolCount:4,
  score:0,round:0,correct:0,wrong:0,
  shownShapes:[],targetShape:null,targetIndex:0,
  phase:"memorize",feedbackType:null,shakeWrong:-1,memorizeCountdown:0
};
var mTimerRef=null,mIntRef=null;
var app=document.getElementById("app");
var _lock=false;

function catObj(){for(var i=0;i<CATEGORIES.length;i++){if(CATEGORIES[i].id===S.category)return CATEGORIES[i]}return CATEGORIES[0]}
function catBg(){var h=catObj().hue;return "linear-gradient(145deg,hsl("+h+",20%,8%),hsl("+h+",25%,14%) 40%,hsl("+h+",30%,18%))"}
function memorizeTime(){return Math.max(2000,5000-S.symbolCount*250)}

function render(){
  if(S.screen!=="intro")document.body.style.background=catBg();
  else document.body.style.background="linear-gradient(145deg,hsl(250,20%,8%),hsl(250,25%,14%) 40%,hsl(250,30%,18%))";
  if(S.screen==="intro")app.innerHTML=renderIntro();
  else if(S.screen==="select")app.innerHTML=renderSelect();
  else if(S.screen==="game")app.innerHTML=renderGame();
}
function gotoScreen(scr){
  if(_lock)return;_lock=true;
  var el=app.firstElementChild;
  if(el){el.style.animation="screenFadeOut .25s ease-in forwards";
    setTimeout(function(){S.screen=scr;render();if(app.firstElementChild)app.firstElementChild.classList.add('screen-enter');_lock=false;},250);
  }else{S.screen=scr;render();if(app.firstElementChild)app.firstElementChild.classList.add('screen-enter');_lock=false;}
}
function muteBtn(){return '<button onclick="sndToggleMute()" style="position:fixed;top:14px;right:14px;z-index:100;width:38px;height:38px;border-radius:20px;background:rgba(255,255,255,0.08);border:none;font-size:16px;display:flex;align-items:center;justify-content:center;color:#fff;">'+(SND.muted?'🔇':'🔊')+'</button>';}

/* === TILE LAYOUT === */
function buildTileRows(count,symbols,colors){
  var items=[];
  for(var i=0;i<count;i++)items.push({symbol:symbols[i%symbols.length].symbol,color:colors[i%colors.length]});
  var rows=[],remaining=count;
  while(remaining>0){
    var inThisRow=Math.min(remaining,3);
    if(remaining>3&&remaining-3===1)inThisRow=2;
    rows.push(items.splice(0,inThisRow));remaining-=inThisRow;
  }
  return rows;
}
function renderTileContent(count,cat,isActive){
  var rows=buildTileRows(count,cat.symbols,COLORS);
  var isEmoji=cat.id!=="figures";
  var baseSize=count<=3?20:count<=5?15:count<=7?13:11;
  var gap=count<=4?6:count<=6?4:3;
  var rowGap=count<=4?5:3;
  var html='';
  for(var r=0;r<rows.length;r++){
    html+='<div style="display:flex;gap:'+gap+'px;justify-content:center;">';
    for(var c=0;c<rows[r].length;c++){
      var item=rows[r][c];
      if(isEmoji){
        html+='<span style="font-size:'+baseSize+'px;filter:drop-shadow(0 0 6px rgba(255,255,255,0.3));'+(isActive?'animation:shimmer 2s ease-in-out infinite;animation-delay:'+(c*0.2)+'s;':'')+'">'+item.symbol+'</span>';
      }else{
        html+='<span style="font-size:'+baseSize+'px;color:'+item.color+';filter:drop-shadow(0 0 8px '+item.color+'80);text-shadow:0 0 12px '+item.color+'40,0 0 24px '+item.color+'20;'+(isActive?'animation:shimmer 2s ease-in-out infinite;animation-delay:'+(c*0.15)+'s;':'')+'">'+item.symbol+'</span>';
      }
    }
    html+='</div>';
  }
  return '<div style="display:flex;flex-direction:column;gap:'+rowGap+'px;align-items:center;justify-content:center;min-height:50px;">'+html+'</div>';
}

/* === INTRO === */
function renderIntro(){
  var floats='';
  for(var i=0;i<14;i++){
    var s=SHAPES_FIGURES[i%SHAPES_FIGURES.length];
    floats+='<div style="position:absolute;font-size:'+(24+Math.random()*40)+'px;color:'+COLORS[i%COLORS.length]+';opacity:0.08;left:'+Math.random()*100+'%;animation:introFloat '+(8+Math.random()*12)+'s linear infinite;animation-delay:'+(-Math.random()*15)+'s;">'+s.symbol+'</div>';
  }
  return muteBtn()+
  '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;">'+
    floats+
    '<div style="text-align:center;z-index:2;animation:fadeInUp .8s ease-out;position:relative;">'+
      '<div style="font-size:64px;letter-spacing:8px;display:flex;gap:16px;justify-content:center;margin-bottom:12px;">'+
        '<span style="animation:pulse 2s ease-in-out infinite;">🧠</span>'+
        '<span style="animation:pulse 2s ease-in-out infinite;animation-delay:0.3s;">💡</span>'+
        '<span style="animation:pulse 2s ease-in-out infinite;animation-delay:0.6s;">✨</span>'+
      '</div>'+
      '<h1 style="font-size:36px;font-weight:800;margin:16px 0 0;letter-spacing:2px;">Memory Training</h1>'+
      '<p style="color:#a0a0b8;font-size:15px;margin:14px 0 36px;line-height:1.7;max-width:320px;">Train your brain!<br>Memorize symbols and test your memory.</p>'+
      '<button onclick="gotoSelect()" style="background:linear-gradient(135deg,#6c63ff,#8b5cf6);color:#fff;border:none;padding:18px 60px;font-size:22px;font-weight:800;border-radius:18px;letter-spacing:3px;box-shadow:0 0 20px #6c63ff40,0 0 40px #6c63ff20;animation:pulse 3s ease-in-out infinite;transition:transform .2s;">START</button>'+
    '</div>'+
  '</div>';
}
function gotoSelect(){sndMusic('menu');gotoScreen('select');}

/* === SELECT === */
function renderSelect(){
  var cat=catObj();
  var catTabs='';
  for(var ci=0;ci<CATEGORIES.length;ci++){
    var c=CATEGORIES[ci],active=c.id===S.category;
    catTabs+='<button onclick="selectCat(\''+c.id+'\')" class="glass-card" style="flex:1;min-width:100px;padding:14px 10px;border-radius:16px;border:'+(active?'2px solid #6c63ff':'1px solid rgba(255,255,255,0.12)')+';background:'+(active?'rgba(108,99,255,0.15)':'rgba(255,255,255,0.06)')+';display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:'+(active?'0 0 20px #6c63ff40':'0 4px 20px rgba(0,0,0,0.3)')+';transition:all .3s;"><span style="font-size:28px;">'+c.icon+'</span><span style="font-size:12px;font-weight:700;color:'+(active?'#6c63ff':'#a0a0b8')+';letter-spacing:1px;">'+c.name+'</span></button>';
  }
  var tiles='';
  for(var n=2;n<=9;n++){
    var isActive=n===S.symbolCount;
    var borderStyle=isActive?'2px solid #4ecdc4':'2px solid rgba(255,255,255,0.08)';
    var bgStyle=isActive?'rgba(78,205,196,0.1)':'rgba(255,255,255,0.04)';
    var glowStyle=isActive?'0 0 25px #4ecdc430,0 0 50px #4ecdc415':'0 4px 20px rgba(0,0,0,0.3)';
    var content=renderTileContent(n,cat,isActive);
    tiles+='<button onclick="selectCount('+n+')" class="tile-btn" style="--tc:#4ecdc4;width:100%;aspect-ratio:1;border-radius:20px;border:'+borderStyle+';background:'+bgStyle+';display:flex;align-items:center;justify-content:center;padding:10px 6px;box-shadow:'+glowStyle+';animation:cardEnter .5s ease-out '+((n-2)*0.07)+'s both;">'+content+'</button>';
  }
  return muteBtn()+
  '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px;animation:fadeInUp .5s ease-out;">'+
    '<div style="width:100%;max-width:400px;margin-bottom:20px;display:flex;align-items:center;gap:12px;">'+
      '<button onclick="gotoScreen(\'intro\')" class="glass-card" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:18px;font-weight:700;width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.3);">←</button>'+
      '<h2 style="font-size:22px;font-weight:800;letter-spacing:1px;">Choose Mode</h2>'+
    '</div>'+
    '<div style="display:flex;gap:8px;width:100%;max-width:400px;margin-bottom:24px;">'+catTabs+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:400px;margin-bottom:28px;">'+tiles+'</div>'+
    '<button onclick="startGame()" style="background:linear-gradient(135deg,#4ecdc4,#2ecc71);color:#fff;border:none;padding:18px 56px;font-size:20px;font-weight:800;border-radius:18px;letter-spacing:3px;box-shadow:0 0 20px #4ecdc440,0 0 40px #4ecdc420;animation:pulse 3s ease-in-out infinite;transition:transform .2s;">PLAY</button>'+
    '<div style="color:#a0a0b8;font-size:11px;margin-top:20px;text-align:center;opacity:.5;max-width:280px;line-height:1.5;">Endless training — no pressure, no time limit.<br>Just you and your memory.</div>'+
  '</div>';
}
function selectCat(id){S.category=id;render()}
function selectCount(n){S.symbolCount=n;render()}

/* === GAME === */
function renderGame(){
  var cat=catObj();
  var pct=S.correct+S.wrong>0?Math.round(S.correct/(S.correct+S.wrong)*100):0;

  var ringSize=140,ringStroke=6,ringR=(ringSize-ringStroke)/2,ringC=2*Math.PI*ringR;
  var ringHtml;
  if(S.phase==="memorize"){
    ringHtml='<div style="position:relative;width:'+ringSize+'px;height:'+ringSize+'px;margin-bottom:16px;">'+
      '<svg width="'+ringSize+'" height="'+ringSize+'" style="position:absolute;top:0;left:0;transform:rotate(-90deg);--rc:#4ecdc4;">'+
        '<circle cx="'+(ringSize/2)+'" cy="'+(ringSize/2)+'" r="'+ringR+'" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="'+ringStroke+'"/>'+
        '<circle id="ringProgress" cx="'+(ringSize/2)+'" cy="'+(ringSize/2)+'" r="'+ringR+'" fill="none" stroke="#4ecdc4" stroke-width="'+ringStroke+'" stroke-linecap="round" stroke-dasharray="'+ringC+'" stroke-dashoffset="0" style="transition:stroke-dashoffset .1s linear;animation:ringPulse 2s ease-in-out infinite;--rc:#4ecdc4;"/>'+
      '</svg>'+
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">'+
        '<span id="memCountdown" style="font-size:48px;font-weight:800;color:#4ecdc4;text-shadow:0 0 20px #4ecdc440,0 0 40px #4ecdc420;font-variant-numeric:tabular-nums;">'+S.memorizeCountdown+'</span>'+
      '</div></div>';
  }else{
    var tc=S.targetShape?S.targetShape.color:'rgba(255,255,255,0.15)';
    ringHtml='<div style="width:'+ringSize+'px;height:'+ringSize+'px;border-radius:50%;position:relative;border:3px solid '+(S.targetShape?tc+'50':'rgba(255,255,255,0.15)')+';display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:rgba(255,255,255,0.04);box-shadow:'+(S.targetShape?'0 0 20px '+tc+'40,0 0 40px '+tc+'20':'0 4px 20px rgba(0,0,0,0.3)')+';animation:'+(S.phase==='guess'?'pulse 1.5s ease-in-out infinite':'none')+';">'+
      (S.targetShape?'<span style="font-size:56px;color:'+tc+';filter:drop-shadow(0 0 12px '+tc+'80);text-shadow:0 0 20px '+tc+'40,0 0 40px '+tc+'20;animation:popIn .4s ease-out;">'+S.targetShape.symbol+'</span>':'')+
    '</div>';
  }

  var cardsHtml='';
  for(var i=0;i<S.shownShapes.length;i++){
    var shape=S.shownShapes[i];
    var isOk=S.phase==="feedback"&&S.feedbackType==="correct"&&i===S.targetIndex;
    var isReveal=S.phase==="feedback"&&S.feedbackType==="wrong"&&i===S.targetIndex;
    var isShake=S.shakeWrong===i;
    var border=isOk?'3px solid #4ecdc4':isReveal?'3px solid #ffd93d':S.phase==='memorize'?'2px solid '+shape.color+'40':'2px solid rgba(255,255,255,0.12)';
    var bg=isOk?'rgba(78,205,196,0.15)':isReveal?'rgba(255,217,61,0.15)':'rgba(255,255,255,0.06)';
    var anim=isShake?"shakeX .5s ease":S.phase==="memorize"?"cardEnter .5s ease-out "+(i*0.08)+"s both":"cardFlipIn .3s ease-out";
    var inner;
    if(S.phase==="memorize"){
      inner='<span style="font-size:38px;color:'+shape.color+';filter:drop-shadow(0 0 12px '+shape.color+'80);text-shadow:0 0 16px '+shape.color+'50,0 0 32px '+shape.color+'25;animation:shimmer 2s ease-in-out infinite;animation-delay:'+(i*0.15)+'s;">'+shape.symbol+'</span>';
    }else if(isReveal){
      inner='<span style="font-size:38px;color:#ffd93d;filter:drop-shadow(0 0 12px #ffd93d80);animation:popIn .4s ease-out;">'+shape.symbol+'</span>';
    }else if(isOk){
      inner='<span style="font-size:38px;color:#4ecdc4;filter:drop-shadow(0 0 12px #4ecdc480);animation:popIn .4s ease-out;">'+shape.symbol+'</span>';
    }else{
      inner='<span style="font-size:30px;color:rgba(255,255,255,0.15);">?</span>';
    }
    cardsHtml+='<button class="glass-card" onclick="handleAnswer('+i+',event)" '+(S.phase!=="guess"?"disabled":"")+' style="width:82px;height:82px;border-radius:20px;border:'+border+';background:'+bg+';display:flex;align-items:center;justify-content:center;cursor:'+(S.phase==='guess'?'pointer':'default')+';animation:'+anim+';box-shadow:'+(isOk||isReveal?'0 0 25px '+(isOk?'#4ecdc4':'#ffd93d')+'40':'0 4px 20px rgba(0,0,0,0.3)')+';backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);">'+inner+'</button>';
  }

  var feedbackText=S.phase==="memorize"?"Memorize the symbols!":S.phase==="guess"?"Pick the right symbol":S.feedbackType==="correct"?"✓ Correct!":"✗ Try again!";
  var feedbackColor=S.phase==='memorize'?'#4ecdc4':S.feedbackType==='correct'?'#4ecdc4':S.feedbackType==='wrong'?'#ff6b6b':'#a0a0b8';

  return muteBtn()+
  '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px;position:relative;">'+
    '<div style="text-align:center;height:28px;">'+
      '<div style="font-size:14px;font-weight:700;letter-spacing:1px;">'+cat.icon+' '+cat.name+' · ×'+S.symbolCount+'</div>'+
    '</div>'+

    '<div style="display:flex;gap:24px;justify-content:center;width:100%;max-width:400px;margin:12px 0 8px;">'+
      '<div style="text-align:center;"><div style="color:#4ecdc4;font-size:22px;font-weight:800;">'+S.correct+'</div><div style="color:#a0a0b8;font-size:10px;">correct</div></div>'+
      '<div style="text-align:center;"><div style="color:#ff6b6b;font-size:22px;font-weight:800;">'+S.wrong+'</div><div style="color:#a0a0b8;font-size:10px;">wrong</div></div>'+
      '<div style="text-align:center;"><div style="color:#ffd93d;font-size:22px;font-weight:800;">'+pct+'%</div><div style="color:#a0a0b8;font-size:10px;">accuracy</div></div>'+
      '<div style="text-align:center;"><div style="color:#a29bfe;font-size:22px;font-weight:800;">'+S.round+'</div><div style="color:#a0a0b8;font-size:10px;">rounds</div></div>'+
    '</div>'+

    '<div style="height:24px;display:flex;align-items:center;justify-content:center;"><span style="color:'+feedbackColor+';font-size:16px;font-weight:600;text-shadow:0 0 10px '+feedbackColor+'30;transition:color .3s;">'+feedbackText+'</span></div>'+

    ringHtml+

    '<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:380px;min-height:82px;align-content:center;">'+cardsHtml+'</div>'+

    '<button onclick="quitGame()" class="glass-card" style="margin-top:32px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#a0a0b8;padding:10px 32px;font-size:13px;font-weight:600;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.3);">✕ Quit</button>'+
  '</div>';
}

/* === GAME LOGIC === */
function startGame(){
  clearTimeout(mTimerRef);clearInterval(mIntRef);
  S.score=0;S.round=0;S.correct=0;S.wrong=0;
  S.screen="game";sndMusic('game');startNewRound();
}
function startNewRound(){
  var cat=catObj();
  var picked=pickN(cat.symbols,S.symbolCount);
  var cols=pickN(COLORS,S.symbolCount);
  var withC=[];for(var i=0;i<picked.length;i++)withC.push({symbol:picked[i].symbol,color:cols[i]});
  var idx=Math.floor(Math.random()*S.symbolCount);
  S.shownShapes=withC;S.targetShape=withC[idx];S.targetIndex=idx;
  S.phase="memorize";S.feedbackType=null;S.shakeWrong=-1;
  clearTimeout(mTimerRef);clearInterval(mIntRef);
  sndPlay('memorize');
  var mt=memorizeTime();
  S.memorizeCountdown=Math.ceil(mt/1000);
  var st=Date.now(),rR=(140-6)/2,rC=2*Math.PI*rR;
  render();
  mIntRef=setInterval(function(){
    var elapsed=Date.now()-st,newVal=Math.max(0,Math.ceil((mt-elapsed)/1000));
    if(newVal!==S.memorizeCountdown){S.memorizeCountdown=newVal;var span=document.getElementById("memCountdown");if(span){span.textContent=String(newVal);span.style.animation="countUp .3s ease-out";}}
    var ring=document.getElementById("ringProgress");
    if(ring){var pct=Math.min(elapsed/mt,1);ring.setAttribute("stroke-dashoffset",String(pct*rC));}
  },50);
  mTimerRef=setTimeout(function(){clearInterval(mIntRef);S.memorizeCountdown=0;S.phase="guess";render();},mt);
}

function handleAnswer(index,e){
  if(S.phase!=="guess")return;
  if(index===S.targetIndex){
    S.correct++;S.feedbackType="correct";S.phase="feedback";
    sndPlay('correct');
    if(e&&e.currentTarget){var r=e.currentTarget.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2,12);spawnFloatingScore(r.left+r.width/2,r.top,"✓","#4ecdc4");}
    render();
    setTimeout(function(){S.round++;startNewRound()},800);
  }else{
    S.wrong++;S.feedbackType="wrong";S.shakeWrong=index;S.phase="feedback";
    sndPlay('wrong');render();
    setTimeout(function(){startNewRound()},1200);
  }
}

function quitGame(){clearTimeout(mTimerRef);clearInterval(mIntRef);sndMusic('menu');gotoScreen('select');}

sndInit();render();
</script>
