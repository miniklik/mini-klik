<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Multiply Master</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;overflow-x:hidden}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(145deg,hsl(250,20%,8%),hsl(250,25%,14%) 40%,hsl(250,30%,18%));color:#f8f8f2;transition:background .6s}
  *::-webkit-scrollbar{display:none}
  *{scrollbar-width:none;-ms-overflow-style:none}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes particleBurst{0%{transform:translate(-50%,-50%) translate(0,0);opacity:1}100%{transform:translate(-50%,-50%) translate(var(--px),var(--py));opacity:0}}
  @keyframes floatScore{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}
  @keyframes cardEnter{0%{opacity:0;transform:translateY(30px) scale(.8)}60%{transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes screenFadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  @keyframes screenFadeOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.97)}}
  @keyframes shimmer{0%{filter:brightness(1)}50%{filter:brightness(1.3)}100%{filter:brightness(1)}}
  @keyframes comboGlow{0%{text-shadow:0 0 10px #ffd93d40}50%{text-shadow:0 0 30px #ffd93d80,0 0 60px #ffd93d40}100%{text-shadow:0 0 10px #ffd93d40}}
  @keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes introFloat{0%{transform:translateY(100vh) rotate(0deg)}100%{transform:translateY(-100px) rotate(360deg)}}
  @keyframes streakBounce{0%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(.9)}100%{transform:scale(1)}}
  @keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes owlBlink{0%,42%,46%,100%{ry:14px;cy:0}44%{ry:1px;cy:6px}}
  @keyframes owlThink{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes owlBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes owlSad{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(3px) rotate(-2deg)}}
  @keyframes owlWave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
  @keyframes owlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes sparkle{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}
  @keyframes questionMark{0%,100%{opacity:0.3;transform:translateY(0)}50%{opacity:0.8;transform:translateY(-5px)}}
  @keyframes tearDrop{0%{opacity:0;transform:translateY(0)}50%{opacity:0.7}100%{opacity:0;transform:translateY(12px)}}

  #app>.screen-enter{animation:screenFadeIn .35s ease-out both}
  .glass-card{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);transition:transform .2s,box-shadow .2s}
  .glass-card:hover:not(:disabled){transform:translateY(-4px) scale(1.06);box-shadow:0 8px 30px rgba(0,0,0,.15)!important}
  .glass-card:active:not(:disabled){transform:translateY(-1px) scale(1.02)}
  .tile-btn{transition:all .3s;position:relative;overflow:hidden}
  .tile-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.05)}
  .tile-btn:active:not(:disabled){transform:scale(0.97)}
  .tile-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent 60%);border-radius:inherit;pointer-events:none}
  .ans-btn{transition:transform .15s,box-shadow .15s,border-color .3s,background .3s;position:relative;overflow:hidden}
  .ans-btn:hover:not(:disabled){transform:translateY(-4px) scale(1.06);box-shadow:0 8px 25px rgba(0,0,0,.25)!important}
  .ans-btn:active:not(:disabled){transform:scale(0.95)}
  .ans-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent 60%);border-radius:inherit;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
var COLORS=["#6c63ff","#ff6b6b","#4ecdc4","#ffd93d","#ff8a5c","#a29bfe","#fd79a8","#00cec9","#e17055"];
var CATEGORIES=[
  {id:"easy",name:"Łatwe",icon:"🌱",range:[2,5],hue:"140"},
  {id:"medium",name:"Średnie",icon:"⚡",range:[6,8],hue:"220"},
  {id:"hard",name:"Trudne",icon:"🔥",range:[9,12],hue:"0"}
];
var FLOAT_SYMS=["×","÷","+","−","=","1","2","3","4","5","6","7","8","9"];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

var S={
  screen:"intro",category:"easy",selectedTable:0,
  score:0,round:0,correct:0,wrong:0,streak:0,maxStreak:0,combo:1,
  gameStartTime:0,elapsedTime:0,
  question:null,phase:"question",feedbackType:null,shakeWrong:-1,
  timerLeft:0,timerMax:8,roundsTotal:15,wrongHistory:{}
};
var timerRef=null,stopwatchRef=null,tickRef=null;
var app=document.getElementById("app");
var _lock=false;

/* ===== AUDIO ENGINE (Web Audio API, no files) ===== */
var _actx=null;
function actx(){if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();return _actx;}
function sndTick(){
  try{var c=actx(),t=c.currentTime;
  var o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(600,t+0.04);
  g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.06);}catch(e){}
}
function sndCorrect(){
  try{var c=actx(),t=c.currentTime;
  /* rising two-tone chime */
  var o1=c.createOscillator(),g1=c.createGain();
  o1.type='sine';o1.frequency.setValueAtTime(523,t);o1.frequency.setValueAtTime(659,t+0.1);o1.frequency.setValueAtTime(784,t+0.2);
  g1.gain.setValueAtTime(0.18,t);g1.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  o1.connect(g1);g1.connect(c.destination);o1.start(t);o1.stop(t+0.35);
  /* sparkle overtone */
  var o2=c.createOscillator(),g2=c.createGain();
  o2.type='triangle';o2.frequency.setValueAtTime(1047,t+0.05);o2.frequency.setValueAtTime(1318,t+0.15);
  g2.gain.setValueAtTime(0.08,t+0.05);g2.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  o2.connect(g2);g2.connect(c.destination);o2.start(t+0.05);o2.stop(t+0.35);}catch(e){}
}
function sndWrong(){
  try{var c=actx(),t=c.currentTime;
  /* descending buzz */
  var o=c.createOscillator(),g=c.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(150,t+0.25);
  g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.3);
  /* low thud */
  var o2=c.createOscillator(),g2=c.createGain();
  o2.type='sine';o2.frequency.setValueAtTime(120,t);o2.frequency.exponentialRampToValueAtTime(80,t+0.15);
  g2.gain.setValueAtTime(0.15,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o2.connect(g2);g2.connect(c.destination);o2.start(t);o2.stop(t+0.2);}catch(e){}
}
function sndClick(){
  try{var c=actx(),t=c.currentTime;
  var o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(1200,t);o.frequency.exponentialRampToValueAtTime(800,t+0.05);
  g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.07);}catch(e){}
}
function startTicking(){
  stopTicking();
  tickRef=setInterval(function(){if(S.phase==='question')sndTick();},1000);
}
function stopTicking(){clearInterval(tickRef);tickRef=null;}

function formatTime(ms){var ts=Math.floor(ms/1000),m=Math.floor(ts/60),s=ts%60;return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function catObj(){for(var i=0;i<CATEGORIES.length;i++){if(CATEGORIES[i].id===S.category)return CATEGORIES[i];}return CATEGORIES[0];}
function catBg(){var h=catObj().hue;return"linear-gradient(145deg,hsl("+h+",20%,8%),hsl("+h+",25%,14%) 40%,hsl("+h+",30%,18%))";}

function spawnParticles(x,y,cnt){
  cnt=cnt||12;var w=document.createElement("div");
  w.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;pointer-events:none;z-index:999;";
  for(var i=0;i<cnt;i++){
    var ang=(i/cnt)*360,dist=50+Math.random()*70,sz=4+Math.random()*8;
    var px=Math.cos(ang*Math.PI/180)*dist,py=Math.sin(ang*Math.PI/180)*dist;
    var d=document.createElement("div");
    d.style.cssText="position:absolute;width:"+sz+"px;height:"+sz+"px;border-radius:50%;background:"+COLORS[i%COLORS.length]+";animation:particleBurst .8s cubic-bezier(.25,.46,.45,.94) forwards;transform:translate(-50%,-50%);--px:"+px+"px;--py:"+py+"px;box-shadow:0 0 6px "+COLORS[i%COLORS.length]+"80;";
    w.appendChild(d);
  }
  document.body.appendChild(w);setTimeout(function(){w.remove();},900);
}
function spawnFloat(x,y,text,color){
  var el=document.createElement("div");el.textContent=text;
  el.style.cssText="position:fixed;left:"+x+"px;top:"+y+"px;pointer-events:none;z-index:998;font-size:28px;font-weight:900;color:"+color+";text-shadow:0 2px 10px "+color+"60;animation:floatScore 1.2s cubic-bezier(.25,.46,.45,.94) forwards;transform:translateX(-50%);";
  document.body.appendChild(el);setTimeout(function(){el.remove();},1300);
}

/* ===== PROFESOR SÓWKA — SVG CHARACTER ===== */
function owlSVG(state,size){
  /* state: 'wave','think','happy','sad','idle' */
  size=size||120;
  var bodyAnim=state==='think'?'owlThink 2s ease-in-out infinite':state==='happy'?'owlBounce .5s ease-out 2':state==='sad'?'owlSad .8s ease-out forwards':state==='wave'?'owlFloat 3s ease-in-out infinite':'owlFloat 3s ease-in-out infinite';
  var eyeL,eyeR;
  if(state==='happy'){eyeL='<ellipse cx="37" cy="48" rx="6" ry="2" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="1.5"/><line x1="31" y1="44" x2="43" y2="44" stroke="#4ecdc4" stroke-width="1.5" stroke-linecap="round"/>';eyeR='<ellipse cx="63" cy="48" rx="6" ry="2" fill="#1a1a2e" stroke="#4ecdc4" stroke-width="1.5"/><line x1="57" y1="44" x2="69" y2="44" stroke="#4ecdc4" stroke-width="1.5" stroke-linecap="round"/>';}
  else if(state==='sad'){eyeL='<ellipse cx="37" cy="50" rx="7" ry="10" fill="#fff" stroke="#a29bfe" stroke-width="1.5"/><circle cx="37" cy="52" r="4" fill="#2d2b55"/><ellipse cx="37" cy="50" rx="7" ry="14" fill="none" stroke="#a29bfe" stroke-width="0" style="animation:owlBlink 4s infinite;"/>';eyeR='<ellipse cx="63" cy="50" rx="7" ry="10" fill="#fff" stroke="#a29bfe" stroke-width="1.5"/><circle cx="63" cy="52" r="4" fill="#2d2b55"/>';}
  else{eyeL='<ellipse cx="37" cy="48" rx="8" ry="14" fill="#fff" stroke="#a29bfe" stroke-width="1.5"/><circle cx="37" cy="48" r="5" fill="#2d2b55"/><circle cx="35" cy="45" r="2" fill="#fff"/><ellipse cx="37" cy="48" rx="8" ry="14" fill="none" stroke="none" style="animation:owlBlink 3.5s ease-in-out infinite"/>';eyeR='<ellipse cx="63" cy="48" rx="8" ry="14" fill="#fff" stroke="#a29bfe" stroke-width="1.5"/><circle cx="63" cy="48" r="5" fill="#2d2b55"/><circle cx="61" cy="45" r="2" fill="#fff"/><ellipse cx="63" cy="48" rx="8" ry="14" fill="none" stroke="none" style="animation:owlBlink 3.8s ease-in-out infinite;animation-delay:.2s"/>';}
  /* glasses */
  var glasses='<circle cx="37" cy="48" r="13" fill="none" stroke="#a29bfe" stroke-width="2" opacity=".7"/><circle cx="63" cy="48" r="13" fill="none" stroke="#a29bfe" stroke-width="2" opacity=".7"/><line x1="50" y1="46" x2="50" y2="46" stroke="#a29bfe" stroke-width="2" opacity=".7"/><path d="M49 46 Q50 43 51 46" fill="none" stroke="#a29bfe" stroke-width="1.5" opacity=".7"/>';
  /* beak */
  var beak='<path d="M46 58 L50 65 L54 58" fill="#ffd93d" stroke="#e6c22e" stroke-width="1" stroke-linejoin="round"/>';
  /* graduation cap */
  var cap='<polygon points="50,12 20,25 50,32 80,25" fill="#2d2b55" stroke="#6c63ff" stroke-width="1.5"/><rect x="46" y="25" width="8" height="8" rx="1" fill="#2d2b55" stroke="#6c63ff" stroke-width="1"/><line x1="75" y1="25" x2="78" y2="35" stroke="#6c63ff" stroke-width="1.5"/><circle cx="78" cy="36" r="2" fill="#ffd93d"/>';
  /* body */
  var body='<ellipse cx="50" cy="62" rx="30" ry="28" fill="#3d3578" stroke="#6c63ff" stroke-width="1.5"/>';
  /* belly */
  var belly='<ellipse cx="50" cy="68" rx="18" ry="16" fill="#4a4090" stroke="none"/>';
  /* wings */
  var wingL,wingR;
  if(state==='wave'){wingL='<path d="M20 60 Q8 50 12 38 Q15 45 20 50" fill="#3d3578" stroke="#6c63ff" stroke-width="1.5" style="transform-origin:20px 60px;animation:owlWave 1s ease-in-out infinite;"/>';wingR='<path d="M80 60 Q92 55 88 42 Q85 50 80 55" fill="#3d3578" stroke="#6c63ff" stroke-width="1.5"/>';}
  else if(state==='sad'){wingL='<path d="M22 62 Q10 70 14 80" fill="#3d3578" stroke="#6c63ff" stroke-width="1.5"/>';wingR='<path d="M78 62 Q90 70 86 80" fill="#3d3578" stroke="#6c63ff" stroke-width="1.5"/>';}
  else{wingL='<path d="M20 58 Q8 52 12 40" fill="#3d3578" stroke="#6c63ff" stroke-width="1.5"/>';wingR='<path d="M80 58 Q92 52 88 40" fill="#3d3578" stroke="#6c63ff" stroke-width="1.5"/>';}
  /* feet */
  var feet='<ellipse cx="40" cy="89" rx="8" ry="3" fill="#ffd93d" stroke="#e6c22e" stroke-width="1"/><ellipse cx="60" cy="89" rx="8" ry="3" fill="#ffd93d" stroke="#e6c22e" stroke-width="1"/>';
  /* cheeks */
  var cheeks='<circle cx="28" cy="56" r="5" fill="#ff6b6b" opacity=".15"/><circle cx="72" cy="56" r="5" fill="#ff6b6b" opacity=".15"/>';
  /* extras per state */
  var extras='';
  if(state==='think'){extras='<text x="82" y="28" font-size="18" fill="#ffd93d" opacity=".6" style="animation:questionMark 2s ease-in-out infinite;">?</text><text x="12" y="35" font-size="14" fill="#a29bfe" opacity=".4" style="animation:questionMark 2.5s ease-in-out infinite;animation-delay:.5s;">?</text>';}
  if(state==='happy'){extras='<circle cx="18" cy="30" r="3" fill="#ffd93d" style="animation:sparkle 1s ease-in-out infinite;"/><circle cx="82" cy="25" r="2.5" fill="#4ecdc4" style="animation:sparkle 1.2s ease-in-out infinite;animation-delay:.3s;"/><circle cx="75" cy="18" r="2" fill="#ff8a5c" style="animation:sparkle 1.5s ease-in-out infinite;animation-delay:.6s;"/><circle cx="25" cy="20" r="2" fill="#a29bfe" style="animation:sparkle 1.3s ease-in-out infinite;animation-delay:.2s;"/>';}
  if(state==='sad'){extras='<circle cx="40" cy="60" r="2" fill="#6c63ff" opacity=".5" style="animation:tearDrop 2s ease-in infinite;"/><circle cx="64" cy="60" r="2" fill="#6c63ff" opacity=".5" style="animation:tearDrop 2s ease-in infinite;animation-delay:.5s;"/>';}
  return '<svg viewBox="0 0 100 95" width="'+size+'" height="'+Math.round(size*0.95)+'" xmlns="http://www.w3.org/2000/svg" style="animation:'+bodyAnim+';overflow:visible;filter:drop-shadow(0 4px 12px rgba(108,99,255,0.2));">'+
    body+belly+wingL+wingR+feet+eyeL+eyeR+glasses+beak+cheeks+cap+extras+'</svg>';
}
/* speech bubble */
function owlBubble(text){
  return '<div style="background:rgba(108,99,255,0.12);border:1px solid rgba(108,99,255,0.25);border-radius:14px 14px 14px 4px;padding:6px 14px;font-size:12px;color:#a29bfe;font-weight:600;max-width:180px;text-align:center;animation:fadeInUp .3s ease-out;">'+text+'</div>';
}

/* ===== SCREEN TRANSITIONS (only time we do full innerHTML) ===== */
function render(){
  if(S.screen!=="intro")document.body.style.background=catBg();
  else document.body.style.background="linear-gradient(145deg,hsl(250,20%,8%),hsl(250,25%,14%) 40%,hsl(250,30%,18%))";
  if(S.screen==="intro")app.innerHTML=renderIntro();
  else if(S.screen==="select")app.innerHTML=renderSelect();
  else if(S.screen==="game")app.innerHTML=renderGame();
  else if(S.screen==="results")app.innerHTML=renderResults();
}
function gotoScreen(scr){
  if(_lock)return;_lock=true;
  var el=app.firstElementChild;
  if(el){el.style.animation="screenFadeOut .25s ease-in forwards";
    setTimeout(function(){S.screen=scr;render();if(app.firstElementChild)app.firstElementChild.classList.add('screen-enter');_lock=false;},250);
  }else{S.screen=scr;render();if(app.firstElementChild)app.firstElementChild.classList.add('screen-enter');_lock=false;}
}

/* ===== INTRO ===== */
function renderIntro(){
  var f='';
  for(var i=0;i<18;i++){
    f+='<div style="position:absolute;font-size:'+(20+Math.random()*36)+'px;color:'+COLORS[i%COLORS.length]+';opacity:0.07;left:'+Math.random()*100+'%;animation:introFloat '+(8+Math.random()*12)+'s linear infinite;animation-delay:'+(-Math.random()*15)+'s;font-weight:800;">'+FLOAT_SYMS[i%FLOAT_SYMS.length]+'</div>';
  }
  return '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;">'+f+
    '<div style="text-align:center;z-index:2;animation:fadeInUp .8s ease-out;position:relative;">'+
      '<div style="font-size:64px;letter-spacing:8px;display:flex;gap:16px;justify-content:center;margin-bottom:12px;">'+
        '<span style="animation:pulse 2s ease-in-out infinite;">🧮</span>'+
        '<span style="animation:pulse 2s ease-in-out infinite;animation-delay:.3s;">💡</span>'+
        '<span style="animation:pulse 2s ease-in-out infinite;animation-delay:.6s;">🔥</span>'+
      '</div>'+
      '<h1 style="font-size:34px;font-weight:800;margin:16px 0 0;letter-spacing:2px;">Multiply Master</h1>'+
      '<p style="color:#a0a0b8;font-size:15px;margin:14px 0 8px;line-height:1.7;max-width:320px;">Naucz się tabliczki mnożenia<br>przez zabawę! 🎯</p>'+
      '<div style="margin:10px 0 20px;display:flex;flex-direction:column;align-items:center;gap:6px;">'+owlSVG('wave',130)+owlBubble('Cześć! Uczmy się razem!')+'</div>'+
      '<button onclick="gotoScreen(\'select\')" style="background:linear-gradient(135deg,#6c63ff,#8b5cf6);color:#fff;border:none;padding:18px 60px;font-size:22px;font-weight:800;border-radius:18px;letter-spacing:3px;box-shadow:0 0 20px #6c63ff40,0 0 40px #6c63ff20;animation:pulse 3s ease-in-out infinite;">START</button>'+
    '</div>'+
    '<div style="position:absolute;bottom:20px;color:rgba(255,255,255,0.2);font-size:13px;font-weight:500;letter-spacing:1px;">mini-klik.pl</div>'+
  '</div>';
}

/* ===== SELECT (with DOM-patching, no full re-render) ===== */
function renderSelect(){
  var cat=catObj();
  var colCount=Math.min(cat.range[1]-cat.range[0]+2,5);
  return '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px;animation:fadeInUp .5s ease-out;">'+
    '<div style="width:100%;max-width:400px;margin-bottom:20px;display:flex;align-items:center;gap:12px;">'+
      '<button onclick="gotoScreen(\'intro\')" class="glass-card" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#fff;font-size:18px;font-weight:700;width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.3);">←</button>'+
      '<h2 style="font-size:22px;font-weight:800;letter-spacing:1px;">Wybierz tryb</h2>'+
    '</div>'+
    '<div id="catTabs" style="display:flex;gap:8px;width:100%;max-width:400px;margin-bottom:24px;">'+buildCatTabs()+'</div>'+
    '<div id="tilesWrap" style="width:100%;max-width:400px;margin-bottom:24px;">'+
      '<div id="tilesGrid" style="display:grid;grid-template-columns:repeat('+colCount+',1fr);gap:12px;">'+buildTableTiles()+'</div>'+
    '</div>'+

/* ===== QUESTION GENERATION ===== */
function genQuestion(){
  var cat=catObj();
  var a=S.selectedTable===0?(cat.range[0]+Math.floor(Math.random()*(cat.range[1]-cat.range[0]+1))):S.selectedTable;
  var b=1+Math.floor(Math.random()*10);
  var correct=a*b;
  var pool={};pool[correct]=1;
  var tries=0;
  while(Object.keys(pool).length<4&&tries<60){
    var w,r=Math.random();
    if(r<.25)w=correct+Math.floor(Math.random()*5)+1;
    else if(r<.5)w=correct-(Math.floor(Math.random()*5)+1);
    else if(r<.65)w=a*(b+1);
    else if(r<.8)w=a*(b-1);
    else if(r<.9)w=(a+1)*b;
    else w=(a-1)*b;
    if(w>0&&!pool[w]){pool[w]=1;}
    tries++;
  }
  var fb=2;while(Object.keys(pool).length<4){if(!pool[correct+fb])pool[correct+fb]=1;fb++;}
  var ans=[];for(var k in pool){if(parseInt(k)!==correct)ans.push(parseInt(k));}
  ans=shuffle(ans).slice(0,3);
  var ci=Math.floor(Math.random()*4);
  ans.splice(ci,0,correct);
  return{a:a,b:b,correct:correct,answers:ans,correctIndex:ci};
}

/* ===== GAME LOGIC ===== */
function startGame(){
  clearInterval(stopwatchRef);clearInterval(timerRef);
  S.score=0;S.round=0;S.correct=0;S.wrong=0;S.streak=0;S.maxStreak=0;S.combo=1;
  S.gameStartTime=Date.now();S.elapsedTime=0;S.wrongHistory={};
  S.timerMax=S.category==='hard'?6:S.category==='medium'?7:8;
  /* one-time full render for game screen */
  gotoScreen('game');
  /* wait for transition then start first round */
  setTimeout(function(){startNewRound();},300);
}
function startNewRound(){
  if(S.round>=S.roundsTotal){finishGame();return;}
  S.question=genQuestion();
  S.phase='question';S.feedbackType=null;S.shakeWrong=-1;
  S.timerLeft=S.timerMax;
  /* patch DOM pieces */
  patchStats();
  patchCombo();
  patchFeedback('Wybierz odpowiedź!','#a0a0b8');
  patchQuestion();
  patchAnswers();
  patchOwl('think');
  var hint=document.getElementById('gHint');if(hint)hint.innerHTML='';
  startTimer();
}
function startTimer(){
  clearInterval(timerRef);
  startTicking();
  var start=Date.now();
  var bar=document.getElementById('gTimerBar');
  timerRef=setInterval(function(){
    var elapsed=(Date.now()-start)/1000;
    S.timerLeft=Math.max(0,S.timerMax-elapsed);
    if(bar){
      var pct=Math.max(0,(S.timerLeft/S.timerMax)*100);
      bar.style.width=pct+'%';
      bar.style.background=pct>50?'#4ecdc4':pct>25?'#ffd93d':'#ff6b6b';
      if(pct<25)bar.style.animation='timerPulse .5s ease-in-out infinite';
      else bar.style.animation='none';
    }
    if(S.timerLeft<=0){clearInterval(timerRef);handleTimeout();}
  },50);
}
function handleTimeout(){
  if(S.phase!=='question')return;
  stopTicking();sndWrong();
  S.wrong++;S.streak=0;S.combo=1;S.feedbackType='wrong';S.phase='feedback';
  var key=S.question.a+'x'+S.question.b;
  S.wrongHistory[key]=(S.wrongHistory[key]||0)+1;
  disableAnswers();
  patchStats();patchCombo();
  patchFeedback('⏱ Czas minął! To było '+S.question.correct,'#ff6b6b');
  patchQuestionColor('#ff6b6b');
  patchOwl('timeout');
  styleAnswer(S.question.correctIndex,'3px solid #ffd93d','rgba(255,217,61,0.15)','#ffd93d','popIn .4s ease-out');
  patchHint();
  setTimeout(function(){S.round++;startNewRound();},1800);
}
function handleAnswer(index,e){
  if(S.phase!=='question')return;
  clearInterval(timerRef);stopTicking();S.phase='feedback';
  disableAnswers();

  if(index===S.question.correctIndex){
    sndCorrect();
    S.correct++;S.streak++;
    if(S.streak>S.maxStreak)S.maxStreak=S.streak;
    S.combo=S.streak>=9?4:S.streak>=6?3:S.streak>=3?2:1;
    S.score+=10*S.combo;
    S.feedbackType='correct';
    patchStats();patchCombo();
    patchFeedback('✓ Dobrze!'+(S.combo>1?' (×'+S.combo+')':''),'#4ecdc4');
    patchQuestionColor('#4ecdc4');
    patchOwl('happy');
    styleAnswer(index,'3px solid #4ecdc4','rgba(78,205,196,0.2)','#4ecdc4','correctPop .35s ease-out');
    if(e&&e.currentTarget){var r=e.currentTarget.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2,14);spawnFloat(r.left+r.width/2,r.top,'+'+10*S.combo,S.combo>1?'#ffd93d':'#4ecdc4');}
    setTimeout(function(){S.round++;startNewRound();},700);
  }else{
    sndWrong();
    S.wrong++;S.streak=0;S.combo=1;S.feedbackType='wrong';S.shakeWrong=index;
    var key=S.question.a+'x'+S.question.b;
    S.wrongHistory[key]=(S.wrongHistory[key]||0)+1;
    patchStats();patchCombo();
    patchFeedback('✗ Źle! To było '+S.question.correct,'#ff6b6b');
    patchQuestionColor('#ff6b6b');
    patchOwl('sad');
    styleAnswer(index,'3px solid #ff6b6b','rgba(255,107,107,0.15)','#ff6b6b','shakeX .5s ease');
    styleAnswer(S.question.correctIndex,'3px solid #ffd93d','rgba(255,217,61,0.15)','#ffd93d','popIn .4s ease-out');
    patchHint();
    setTimeout(function(){S.round++;startNewRound();},1800);
  }
}

  S.elapsedTime=Date.now()-S.gameStartTime;

/* ===== PREVENT SCROLL ===== */
window.addEventListener("keydown",function(e){if(["ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();});
window.addEventListener("wheel",function(e){e.preventDefault();},{passive:false});

/* ===== UI CLICK SOUND (all buttons except game answers) ===== */
document.addEventListener("click",function(e){
  var btn=e.target.closest("button");
  if(!btn)return;
  /* skip answer buttons during game — they have their own sounds */
  if(btn.classList.contains("ans-btn"))return;
  /* skip quit button during game to keep it silent, or add sound too — let's add */
  if(S.screen==="game"&&!btn.classList.contains("glass-card"))return;
  sndClick();
},true);

render();
