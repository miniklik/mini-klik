<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zapamiętaj Figury · mini-klik.pl</title>
<meta name="description" content="Zapamiętaj Figury — gra pamięciowa. Zapamiętaj układ figur, zanim znikną!">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;overflow-x:hidden}
  body{font-family:'Segoe UI',system-ui,sans-serif}
  button{font-family:inherit;-webkit-appearance:none;appearance:none}
  input{font-family:inherit}

  @keyframes floatShape{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(-30px) rotate(15deg)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%{transform:scale(1)}100%{transform:scale(1.08)}}
  @keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @keyframes particleBurst{0%{transform:translate(-50%,-50%) translate(0,0);opacity:1}100%{transform:translate(-50%,-50%) translate(var(--px),var(--py));opacity:0}}
  @keyframes countPop{0%{transform:scale(1.3);opacity:.5}100%{transform:scale(1);opacity:1}}
  @keyframes levelUp{0%{transform:translateX(-50%) scale(.8);opacity:0}50%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1);opacity:1}}
  @keyframes breathe{0%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.7}}
  @keyframes transIn{from{opacity:0}to{opacity:1}}
  @keyframes transFadeText{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes floatParticle{0%{transform:translateY(0) translateX(0) scale(1)}50%{transform:translateY(-30px) translateX(15px) scale(1.3)}100%{transform:translateY(-60px) translateX(-10px) scale(0.8)}}

  .shape-btn:hover:not(:disabled){transform:scale(1.08)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ DANE / KONFIGURACJA ============ */
const SHAPES = [
  { symbol: "●" }, { symbol: "▲" }, { symbol: "■" }, { symbol: "◆" },
  { symbol: "★" }, { symbol: "♥" }, { symbol: "⬟" }, { symbol: "✦" },
];
const COLORS_DARK = ["#6c63ff","#ff6b6b","#4ecdc4","#ffd93d","#ff8a5c","#a29bfe","#fd79a8","#00cec9"];
const COLORS_LIGHT = ["#4A90E2","#E74C3C","#27AE60","#F39C12","#E67E22","#8E44AD","#E84393","#00B894"];

const LEVELS = Array.from({ length: 15 }, (_, i) => {
  const n = i + 1;
  return {
    id: n,
    shapes: Math.min(2 + Math.floor(i / 3), 6),
    memorizeMs: 5000,
    guessMs: Math.max(2000, 6000 - i * 260),
    rounds: n <= 3 ? 3 : n <= 9 ? 4 : 5,
    label: n <= 3 ? "Łatwy" : n <= 6 ? "Średni" : n <= 9 ? "Trudny" : n <= 12 ? "Expert" : "Mistrz",
  };
});

const THEMES = {
  dark: {
    key:"dark", bg:"linear-gradient(145deg,#0f0e17,#1a1a2e 40%,#16213e)",
    title:"#f8f8f2", subtitle:"#a0a0b8", accent:"#6c63ff",
    accentGrad:"linear-gradient(135deg,#6c63ff,#8b5cf6)",
    correct:"#4ecdc4", wrong:"#ff6b6b", gold:"#ffd93d", combo:"#ff8a5c",
    cardBg:"#ffffff08", cardBorder:"#ffffff15", cardHover:"#ffffff18",
    circleBg:"#ffffff06", timerTrack:"#ffffff10",
    hudText:"#f8f8f2", mutedText:"#ffffff20",
    btnSecBg:"transparent", btnSecBorder:"#a0a0b830", btnSecText:"#a0a0b8",
    colors: COLORS_DARK, switchIcon:"☀️", switchBg:"#ffffff12",
    mapNodeDone:"#4ecdc4", mapNodeCurrent:"#6c63ff", mapNodeLocked:"#ffffff15",
    mapLine:"#ffffff12", mapBg:"linear-gradient(145deg,#0f0e17,#1a1a2e 40%,#16213e)",
    heartDim:"grayscale(1) opacity(0.25)", shadow:"none",
    dropShadow: c => `drop-shadow(0 0 10px ${c}60)`,
  },
  light: {
    key:"light", bg:"linear-gradient(145deg,#FFF8E7,#FFE5B4 40%,#FFF4D6)",
    title:"#333", subtitle:"#777", accent:"#4A90E2",
    accentGrad:"linear-gradient(135deg,#4A90E2,#5BA0F2)",
    correct:"#27AE60", wrong:"#E74C3C", gold:"#F39C12", combo:"#E67E22",
    cardBg:"#ffffff", cardBorder:"#d0d0d0", cardHover:"#f0f0f0",
    circleBg:"#ffffff", timerTrack:"#e0d8c8",
    hudText:"#333", mutedText:"#ccc",
    btnSecBg:"#fff", btnSecBorder:"#ccc", btnSecText:"#777",
    colors: COLORS_LIGHT, switchIcon:"🌙", switchBg:"#00000010",
    mapNodeDone:"#27AE60", mapNodeCurrent:"#4A90E2", mapNodeLocked:"#ddd",
    mapLine:"#e0d0b8", mapBg:"linear-gradient(145deg,#FFF8E7,#FFE5B4 40%,#FFF4D6)",
    heartDim:"grayscale(1) opacity(0.3)", shadow:"0 2px 10px rgba(0,0,0,0.07)",
    dropShadow: () => "none",
  },
};

const MAX_LIVES = 10, LIFE_EVERY = 100;
const FS_BASE = "https://firestore.googleapis.com/v1/projects/miniklik/databases/(default)/documents";
const FS_KEY = "AIzaSyBYCfUzKiKZOsqO4fX504EQWuUs7murmi8";

/* ============ HELPERY ============ */
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pickN(a,n){return shuffle(a).slice(0,n);}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

/* ============ PERSYSTENCJA (localStorage — działa na hostingu; w podglądzie może nie zapisywać) ============ */
function loadProgress(){
  try{const r=localStorage.getItem("mk_zf_progress");return r?JSON.parse(r):{unlocked:1,bestScores:{}};}
  catch(e){return {unlocked:1,bestScores:{}};}
}
function saveProgress(data){ try{localStorage.setItem("mk_zf_progress",JSON.stringify(data));}catch(e){} }
function loadNick(){ try{return localStorage.getItem("mk_zf_nick")||"";}catch(e){return "";} }
function saveNick(n){ try{localStorage.setItem("mk_zf_nick",n);}catch(e){} }

async function loadRecords(){
  try{
    const res = await fetch(`${FS_BASE}/zapamietaj_rekordy?key=${FS_KEY}&pageSize=100`);
    const data = await res.json();
    if(!data.documents) return [];
    return data.documents.map(doc=>({
      nick: doc.fields.nick?.stringValue || "Anonim",
      score: parseInt(doc.fields.score?.integerValue || "0"),
      level: parseInt(doc.fields.level?.integerValue || "0"),
      date: doc.fields.date?.stringValue || "",
    })).sort((a,b)=>b.score-a.score).slice(0,20);
  }catch(e){ return []; }
}
async function addRecord(nick,score,level){
  const dateStr = new Date().toLocaleDateString("pl-PL");
  try{
    await fetch(`${FS_BASE}/zapamietaj_rekordy?key=${FS_KEY}`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ fields:{
        nick:{stringValue:(nick||"Anonim").slice(0,16)},
        score:{integerValue:String(score)},
        level:{integerValue:String(level)},
        date:{stringValue:dateStr},
      }})
    });
  }catch(e){}
  return loadRecords();
}

/* ============ STAN GLOBALNY ============ */
const S = {
  theme: "light",
  screen: "intro",
  progress: {unlocked:1,bestScores:{}},
  nick: "",
  records: [],
  recordsLoading: false,
  startLevel: 1,
  level: 1,
  roundInLevel: 0,
  score: 0,
  lives: 3,
  combo: 0,
  shownShapes: [],
  targetShape: null,
  targetIndex: 0,
  phase: "memorize",
  feedbackType: null,
  shakeWrong: -1,
  memorizeCountdown: 0,
  isNewBest: false,
  levelUpBanner: false,
  paused: false,
  lifeBanner: false,
  nextLifeAt: LIFE_EVERY,
  transition: null,
  isRetry: false,
};
let mTimerRef=null, mIntRef=null, rafId=null, transInT=null, transOutT=null, gameOverT=null;

function t(){ return THEMES[S.theme]; }
function ld(){ return LEVELS[Math.min(S.level-1, LEVELS.length-1)]; }

const app = document.getElementById("app");
function render(){
  document.body.style.background = t().bg;
  if(S.screen==="intro") app.innerHTML = renderIntro();
  else if(S.screen==="map") app.innerHTML = renderMap();
  else if(S.screen==="records") app.innerHTML = renderRecords();
  else if(S.screen==="gameover") app.innerHTML = renderGameOver();
  else if(S.screen==="game") { app.innerHTML = renderGame(); afterGameRender(); }
}

/* ============ THEME TOGGLE (wspólny dla wszystkich ekranów) ============ */
function themeToggleHtml(){
  const th=t();
  return `<button onclick="toggleTheme()" title="${th.key==='dark'?'Jasny':'Ciemny'}" style="
    position:fixed;top:14px;right:14px;z-index:100;width:40px;height:40px;border-radius:12px;
    background:${th.switchBg};border:none;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;">${th.switchIcon}</button>`;
}
function toggleTheme(){ S.theme = S.theme==="dark"?"light":"dark"; render(); }

/* ============ EKRAN: INTRO ============ */
function renderIntro(){
  const th=t();
  const floats = SHAPES.map((s,i)=>`
    <div style="position:absolute;font-size:${30+i*8}px;color:${th.colors[i%th.colors.length]};opacity:${th.key==='dark'?0.12:0.18};
      animation:floatShape ${4+i*0.7}s ease-in-out infinite alternate;animation-delay:${i*0.4}s;
      top:${10+(i*13)%70}%;left:${5+(i*17)%80}%;">${s.symbol}</div>`).join("");
  const shapesTitle = ["●","▲","■"].map((s,i)=>`<span style="color:${th.colors[i]};filter:${th.dropShadow(th.colors[i])};animation:pulse ${1.5+i*0.3}s ease-in-out infinite alternate;">${s}</span>`).join("");
  return `
  ${themeToggleHtml()}
  <div style="min-height:100vh;background:${th.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;">
    ${floats}
    <div style="text-align:center;z-index:2;animation:fadeInUp .8s ease-out;">
      <div style="font-size:54px;letter-spacing:4px;display:flex;gap:12px;justify-content:center;margin-bottom:8px;">${shapesTitle}</div>
      <h1 style="color:${th.title};font-size:38px;font-weight:800;margin:16px 0 0;letter-spacing:3px;">Zapamiętaj Figury</h1>
      <p style="color:${th.subtitle};font-size:16px;margin:14px 0 20px;line-height:1.6;max-width:320px;">
        Zapamiętaj układ figur, zanim znikną.<br>Z każdym poziomem jest trudniej!
      </p>
      <div style="margin-bottom:24px;">
        <input type="text" id="nickInput" value="${esc(S.nick)}" placeholder="Twój nick..." maxlength="16"
          oninput="handleNickChange(this.value)"
          style="background:${th.key==='dark'?'rgba(255,255,255,0.08)':'#fff'};border:2px solid ${th.cardBorder};
          border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;color:${th.title};
          text-align:center;width:200px;outline:none;">
      </div>
      ${S.progress.unlocked>1?`<div style="color:${th.gold};font-size:13px;margin-bottom:18px;letter-spacing:1px;">★ Odblokowany poziom: ${S.progress.unlocked}</div>`:""}
      <div style="display:flex;flex-direction:column;gap:12px;align-items:center;">
        <button onclick="startGame(S.progress.unlocked)" style="background:${th.accentGrad};color:#fff;border:none;
          padding:16px 56px;font-size:20px;font-weight:700;border-radius:14px;cursor:pointer;letter-spacing:2px;
          box-shadow:0 4px 20px ${th.accent}25;">START</button>
        <button onclick="goto('map')" style="background:${th.btnSecBg};color:${th.subtitle};border:1px solid ${th.btnSecBorder};
          padding:12px 36px;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;letter-spacing:1px;">🗺️ Poziomy</button>
        <button onclick="goto('records')" style="background:${th.btnSecBg};color:${th.subtitle};border:1px solid ${th.btnSecBorder};
          padding:12px 36px;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;letter-spacing:1px;">🏆 Rekordy</button>
      </div>
    </div>
  </div>`;
}
function handleNickChange(v){ S.nick=v; saveNick(v); }
function goto(screen){ S.screen=screen; render(); if(screen==="records") refreshRecords(); }

/* ============ EKRAN: MAPA POZIOMÓW ============ */
function renderMap(){
  const th=t();
  const positions = LEVELS.map((_,i)=>{
    const row=i, zigzag = row%2===0;
    const x = zigzag ? 30+(i%3)*25 : 70-(i%3)*25;
    return {x, y: 60+row*62};
  });
  const totalH = positions[positions.length-1].y+80;

  const lines = positions.map((p,i)=>{
    if(i===0) return "";
    const prev=positions[i-1];
    const done = i<S.progress.unlocked;
    return `<line x1="${prev.x/100*400}" y1="${prev.y}" x2="${p.x/100*400}" y2="${p.y}"
      stroke="${done?th.mapNodeDone:th.mapLine}" stroke-width="${done?3:2}" stroke-dasharray="${done?'':'6 4'}" opacity="${done?0.7:0.4}"/>`;
  }).join("");

  const nodes = LEVELS.map((lvl,i)=>{
    const pos=positions[i];
    const done = lvl.id<S.progress.unlocked;
    const current = lvl.id===S.progress.unlocked;
    const locked = lvl.id>S.progress.unlocked;
    const best = S.progress.bestScores[lvl.id];
    const stars = best ? (best>=lvl.rounds*15?3:best>=lvl.rounds*10?2:1) : 0;
    return `<button ${locked?"disabled":`onclick="selectLevel(${lvl.id})"`} style="
      position:absolute;left:calc(${pos.x}% - 28px);top:${pos.y-28}px;width:56px;height:56px;border-radius:50%;
      border:${current?`3px solid ${th.mapNodeCurrent}`:done?`3px solid ${th.mapNodeDone}`:`2px solid ${th.mapNodeLocked}`};
      background:${current?`${th.mapNodeCurrent}18`:done?`${th.mapNodeDone}12`:th.key==='dark'?'#ffffff06':'#ffffff80'};
      cursor:${locked?'default':'pointer'};display:flex;flex-direction:column;align-items:center;justify-content:center;
      box-shadow:${current?`0 0 20px ${th.mapNodeCurrent}40`:done?th.shadow:'none'};
      animation:${current?'pulse 2s ease-in-out infinite alternate':'none'};opacity:${locked?0.4:1};">
      <span style="font-size:${locked?16:18}px;font-weight:800;color:${locked?th.mutedText:current?th.mapNodeCurrent:done?th.mapNodeDone:th.subtitle};line-height:1;">${locked?"🔒":lvl.id}</span>
      ${done&&stars>0?`<span style="font-size:8px;margin-top:1px;letter-spacing:1px;line-height:1;">${"★".repeat(stars)}${"☆".repeat(3-stars)}</span>`:""}
    </button>`;
  }).join("");

  const labels = LEVELS.map((lvl,i)=>{
    const pos=positions[i];
    if(lvl.id>S.progress.unlocked) return "";
    return `<div style="position:absolute;left:calc(${pos.x}% + 36px);top:${pos.y-16}px;font-size:11px;color:${th.subtitle};white-space:nowrap;font-weight:600;">
      ${lvl.shapes} figur · ${lvl.label}</div>`;
  }).join("");

  return `
  <div style="min-height:100vh;background:${th.mapBg};display:flex;flex-direction:column;align-items:center;padding:20px 16px;box-sizing:border-box;">
    <div style="width:100%;max-width:400px;margin-bottom:16px;display:flex;align-items:center;gap:12px;">
      <button onclick="goto('intro')" style="background:${th.key==='dark'?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)'};border:none;color:${th.title};
        font-size:20px;font-weight:700;cursor:pointer;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;">←</button>
      <h2 style="color:${th.title};font-size:22px;font-weight:800;margin:0;letter-spacing:1px;">Mapa poziomów</h2>
    </div>
    <div style="position:relative;width:100%;max-width:400px;height:${totalH}px;margin-bottom:20px;">
      <svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 400 ${totalH}" preserveAspectRatio="xMidYMid meet">${lines}</svg>
      ${nodes}
      ${labels}
    </div>
    <div style="color:${th.subtitle};font-size:13px;text-align:center;max-width:300px;line-height:1.5;">
      Wybierz odblokowany poziom, aby rozpocząć od niego grę.
    </div>
  </div>`;
}
function selectLevel(lvl){ startGame(lvl); }

/* ============ EKRAN: REKORDY ============ */
function renderRecords(){
  const th=t();
  let body;
  if(S.recordsLoading){
    body = `<div style="color:${th.subtitle};font-size:15px;margin-top:40px;animation:pulse 1s ease-in-out infinite alternate;">Ładowanie rekordów...</div>`;
  } else if(S.records.length===0){
    body = `<div style="color:${th.subtitle};font-size:15px;margin-top:40px;text-align:center;">Brak rekordów. Zagraj, żeby zapisać swój wynik!</div>`;
  } else {
    body = `<div style="width:100%;max-width:400px;">` + S.records.map((rec,i)=>{
      const medal = i<3 ? ["🥇","🥈","🥉"][i] : (i+1);
      const bg = i===0?`${th.gold}15`:i===1?`${th.subtitle}10`:i===2?`${th.combo}10`:th.cardBg;
      const border = i===0?th.gold+"40":i===1?th.subtitle+"20":i===2?th.combo+"20":th.cardBorder;
      const circBg = i===0?th.gold+"25":i===1?"#c0c0c025":i===2?"#cd7f3225":"transparent";
      const circColor = i===0?th.gold:i===1?"#aaa":i===2?th.combo:th.subtitle;
      return `<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:8px;border-radius:14px;
        background:${bg};border:1px solid ${border};">
        <div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          font-size:${i<3?16:13}px;font-weight:800;background:${circBg};color:${circColor};">${medal}</div>
        <div style="flex:1;">
          <div style="color:${th.title};font-size:15px;font-weight:700;">${esc(rec.nick)}</div>
          <div style="color:${th.subtitle};font-size:11px;margin-top:2px;">Poziom ${rec.level} · ${esc(rec.date)}</div>
        </div>
        <div style="color:${i===0?th.gold:th.accent};font-size:20px;font-weight:800;">${rec.score}</div>
      </div>`;
    }).join("") + `</div>`;
  }
  return `
  <div style="min-height:100vh;background:${th.bg};display:flex;flex-direction:column;align-items:center;padding:20px 16px;animation:fadeInUp .5s ease-out;">
    <div style="width:100%;max-width:400px;margin-bottom:6px;display:flex;align-items:center;gap:12px;">
      <button onclick="goto('intro')" style="background:${th.key==='dark'?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)'};border:none;color:${th.title};
        font-size:20px;font-weight:700;cursor:pointer;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;">←</button>
      <h2 style="color:${th.title};font-size:22px;font-weight:800;margin:0;flex:1;letter-spacing:1px;">🏆 Księga rekordów</h2>
      <button onclick="refreshRecords()" style="background:${th.key==='dark'?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.06)'};border:none;color:${th.subtitle};
        font-size:16px;cursor:pointer;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;">🔄</button>
    </div>
    <div style="color:${th.subtitle};font-size:11px;margin-bottom:16px;letter-spacing:1px;">🌍 Ranking globalny</div>
    ${body}
  </div>`;
}
function refreshRecords(){
  S.recordsLoading=true; render();
  loadRecords().then(r=>{S.records=r;S.recordsLoading=false;render();}).catch(()=>{S.recordsLoading=false;render();});
}

/* ============ EKRAN: KONIEC GRY ============ */
function renderGameOver(){
  const th=t();
  const emoji = S.score>=30?"🏆":S.score>=15?"🌟":"👏";
  return `
  <div style="min-height:100vh;background:${th.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeInUp .6s ease-out;">
    <div style="font-size:56px;margin-bottom:12px;">${emoji}</div>
    <h2 style="color:${th.title};font-size:32px;font-weight:800;margin:0;">Koniec gry!</h2>
    <div style="margin:24px 0;text-align:center;">
      <div style="color:${th.subtitle};font-size:14px;margin-bottom:4px;">Wynik</div>
      <div style="color:${th.gold};font-size:56px;font-weight:800;line-height:1;filter:${th.dropShadow(th.gold)};">${S.score}</div>
      <div style="color:${th.subtitle};font-size:14px;margin-top:12px;">Osiągnięty poziom: ${S.level}</div>
      ${S.isNewBest?`<div style="color:${th.correct};font-size:16px;font-weight:700;margin-top:12px;animation:pulse 1s ease-in-out infinite alternate;">✦ Nowy rekord! ✦</div>`:""}
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;">
      <button onclick="startGame(S.startLevel)" style="background:${th.accentGrad};color:#fff;border:none;padding:14px 32px;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;">Jeszcze raz</button>
      <button onclick="goto('map')" style="background:${th.btnSecBg};color:${th.btnSecText};border:1px solid ${th.btnSecBorder};padding:14px 24px;font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;">🗺️ Mapa</button>
      <button onclick="goto('intro')" style="background:${th.btnSecBg};color:${th.btnSecText};border:1px solid ${th.btnSecBorder};padding:14px 24px;font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;">Menu</button>
    </div>
    <div style="color:${th.subtitle};font-size:11px;margin-top:22px;letter-spacing:.5px;opacity:.6;">za chwilę zobaczysz ranking 🏆</div>
  </div>`;
}

/* ============ EKRAN: GRA ============ */
function renderGame(){
  const th=t(); const L=ld();
  return `
  <div id="gameRoot" style="min-height:100vh;background:${th.bg};display:flex;flex-direction:column;align-items:center;padding:20px 16px;box-sizing:border-box;position:relative;">

    ${S.levelUpBanner?`<div style="position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:50;background:${th.accentGrad};
      color:#fff;padding:10px 28px;border-radius:12px;font-size:16px;font-weight:700;animation:levelUp .6s ease-out;letter-spacing:1px;
      box-shadow:0 4px 20px ${th.accent}40;">🎉 Poziom ${S.level}!</div>`:""}

    ${S.lifeBanner?`<div style="position:fixed;top:${S.levelUpBanner?110:60}px;left:50%;transform:translateX(-50%);z-index:50;
      background:linear-gradient(135deg,${th.wrong},#ff8a5c);color:#fff;padding:10px 28px;border-radius:12px;font-size:16px;font-weight:700;
      animation:levelUp .6s ease-out;letter-spacing:1px;box-shadow:0 4px 20px ${th.wrong}40;">♥ +1 życie!</div>`:""}

    ${S.paused?`<div style="position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.6);display:flex;flex-direction:column;
      align-items:center;justify-content:center;animation:fadeInUp .3s ease-out;">
      <div style="background:${th.key==='dark'?'#1a1a2e':'#fff'};border-radius:20px;padding:36px 44px;text-align:center;
        box-shadow:0 8px 40px rgba(0,0,0,0.3);max-width:320px;width:90%;">
        <div style="font-size:36px;margin-bottom:8px;">⏸️</div>
        <h3 style="color:${th.title};font-size:22px;font-weight:800;margin:0 0 8px;">Pauza</h3>
        <div style="color:${th.subtitle};font-size:14px;margin-bottom:24px;">Poziom ${S.level} · Wynik: ${S.score}</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button onclick="doResume()" style="background:${th.accentGrad};color:#fff;border:none;padding:14px 0;font-size:17px;font-weight:700;border-radius:12px;cursor:pointer;width:100%;">▶ Wznów</button>
          <button onclick="S.paused=false;goto('intro')" style="background:${th.btnSecBg};color:${th.btnSecText};border:1px solid ${th.btnSecBorder};padding:12px 0;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;width:100%;">Wyjdź do menu</button>
        </div>
      </div>
    </div>`:""}

    ${renderTransition()}

    <div style="text-align:center;margin-bottom:6px;">
      <div style="color:${th.hudText};font-size:14px;font-weight:700;letter-spacing:1px;">Poziom ${S.level}</div>
      <div style="color:${th.subtitle};font-size:10px;margin-top:1px;">Runda ${S.roundInLevel+1}/${L.rounds}</div>
    </div>
    <div style="display:flex;justify-content:space-between;width:100%;max-width:400px;align-items:center;margin-bottom:4px;">
      <div style="min-width:50px;">
        <div style="color:${th.gold};font-size:18px;font-weight:800;">${S.score}</div>
        <div style="color:${th.subtitle};font-size:9px;margin-top:1px;">punkty</div>
      </div>
      <div style="display:flex;gap:2px;align-items:center;">
        ${Array.from({length:MAX_LIVES}).map((_,i)=>`<span style="font-size:14px;filter:${i<S.lives?'none':th.heartDim};">${i<S.lives?"♥":"♡"}</span>`).join("")}
      </div>
      <div style="min-width:50px;"></div>
    </div>

    ${S.combo>=2?`<div style="color:${th.combo};font-size:13px;font-weight:700;letter-spacing:1px;animation:pulse .6s ease-in-out infinite alternate;margin-bottom:4px;">COMBO ×${Math.min(S.combo,5)} 🔥</div>`:""}

    ${S.phase!=="memorize"
      ? `<div style="width:100%;max-width:400px;height:6px;background:${th.timerTrack};border-radius:3px;overflow:hidden;margin:12px 0;">
           <div id="timerFill" style="width:100%;height:100%;background:${th.correct};border-radius:3px;"></div>
         </div>`
      : `<div style="height:30px;"></div>`}

    ${S.isRetry && S.phase==="memorize" ? `<div style="color:${th.wrong};font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:4px;">🔄 Poprawiasz rundę ${S.roundInLevel+1}</div>` : ""}

    <div style="color:${S.phase==='memorize'?(S.isRetry?th.wrong:th.correct):S.phase==='feedback'&&S.feedbackType==='correct'?th.correct:S.phase==='feedback'&&S.feedbackType==='wrong'?th.wrong:th.subtitle};
      font-size:16px;font-weight:600;margin-bottom:20px;min-height:24px;">
      ${S.phase==="memorize" ? (S.isRetry?"Spróbuj jeszcze raz!":"Zapamiętaj figury!") : ""}
      ${S.phase==="guess" ? "Wskaż właściwą figurę" : ""}
      ${S.phase==="feedback" && S.feedbackType==="correct" ? `Dobrze! +${10*Math.min(S.combo,5)+S.level*5}` : ""}
      ${S.phase==="feedback" && S.feedbackType==="wrong" ? "Pudło!" : ""}
    </div>

    <div style="width:130px;height:130px;border-radius:50%;
      border:${S.phase==='memorize'?`4px solid ${th.correct}80`:`3px solid ${S.targetShape?S.targetShape.color+"60":th.mutedText}`};
      display:flex;align-items:center;justify-content:center;margin-bottom:32px;background:${th.circleBg};
      animation:${S.phase==='guess'?'pulse 1.5s ease-in-out infinite alternate':'none'};box-shadow:${th.shadow};">
      ${S.phase==="memorize" ? `<span id="memCountdown" style="font-size:52px;font-weight:800;color:${th.correct};filter:${th.dropShadow(th.correct)};font-variant-numeric:tabular-nums;">${S.memorizeCountdown}</span>` : ""}
      ${S.phase!=="memorize" && S.targetShape ? `<span style="font-size:56px;color:${S.targetShape.color};filter:${th.dropShadow(S.targetShape.color)};">${S.targetShape.symbol}</span>` : ""}
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:360px;">
      ${S.shownShapes.map((shape,i)=>{
        const isOk = S.phase==="feedback" && S.feedbackType==="correct" && i===S.targetIndex;
        const isReveal = S.phase==="feedback" && S.feedbackType==="wrong" && i===S.targetIndex;
        const isShake = S.shakeWrong===i;
        const border = isOk?`3px solid ${th.correct}`:isReveal?`3px solid ${th.gold}`:S.phase==='memorize'?`2px solid ${shape.color}50`:`2px solid ${th.cardBorder}`;
        const bg = isOk?`${th.correct}15`:isReveal?`${th.gold}15`:th.cardBg;
        const anim = isShake?"shakeX .5s ease":isReveal?"popIn .4s ease-out":"popIn .35s ease-out";
        let inner;
        if(S.phase==="memorize") inner = `<span style="font-size:36px;color:${shape.color};filter:${th.dropShadow(shape.color)};">${shape.symbol}</span>`;
        else if(isReveal) inner = `<span style="font-size:36px;color:${th.gold};filter:${th.dropShadow(th.gold)};">${shape.symbol}</span>`;
        else if(isOk) inner = `<span style="font-size:36px;color:${th.correct};">${shape.symbol}</span>`;
        else inner = `<span style="font-size:28px;color:${th.mutedText};">?</span>`;
        return `<button class="shape-btn" onclick="handleAnswer(${i}, event)" ${S.phase!=="guess"?"disabled":""} style="
          width:80px;height:80px;border-radius:16px;border:${border};background:${bg};
          display:flex;align-items:center;justify-content:center;cursor:${S.phase==='guess'?'pointer':'default'};
          animation:${anim};box-shadow:${isOk?`0 0 20px ${th.correct}40`:isReveal?`0 0 20px ${th.gold}40`:th.shadow};">
          ${inner}
        </button>`;
      }).join("")}
    </div>

    <div style="color:${th.subtitle};font-size:11px;margin-top:24px;letter-spacing:.5px;text-align:center;opacity:.7;">
      ${L.shapes} figur · ${L.label} · +♥ za ${S.nextLifeAt} pkt
    </div>
    <button onclick="doPause()" style="margin-top:14px;background:none;border:1px solid ${th.btnSecBorder};color:${th.subtitle};
      padding:10px 32px;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;letter-spacing:1px;">⏸ Pauza</button>
  </div>`;
}

function renderTransition(){
  if(!S.transition) return "";
  const th=t();
  const tLvl = LEVELS[Math.min(S.transition.level-1,14)];
  const particles = S.transition.isLevelUp ? Array.from({length:16}).map((_,i)=>`
    <div style="position:absolute;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;border-radius:50%;
      background:${th.colors[i%th.colors.length]};opacity:${0.3+Math.random()*0.3};left:${Math.random()*100}%;top:${Math.random()*100}%;
      animation:floatParticle ${2+Math.random()*3}s ease-in-out infinite alternate;animation-delay:${Math.random()*2}s;"></div>`).join("") : "";
  const content = S.transition.isLevelUp ? `
    <div style="font-size:44px;margin-bottom:16px;animation:popIn .6s ease-out;">🎉</div>
    <div style="font-size:13px;color:${th.subtitle};letter-spacing:3px;font-weight:600;margin-bottom:12px;text-transform:uppercase;">Nowy poziom</div>
    <div style="font-size:40px;color:${th.accent};font-weight:800;letter-spacing:2px;">Poziom ${S.transition.level}</div>
    <div style="margin-top:24px;display:flex;gap:24px;">
      <div style="text-align:center;"><div style="font-size:28px;font-weight:800;color:${th.accent};">${tLvl.shapes}</div><div style="font-size:11px;color:${th.subtitle};margin-top:2px;letter-spacing:1px;">figur</div></div>
      <div style="width:1px;background:${th.cardBorder};opacity:.5;"></div>
      <div style="text-align:center;"><div style="font-size:28px;font-weight:800;color:${th.accent};">${tLvl.rounds}</div><div style="font-size:11px;color:${th.subtitle};margin-top:2px;letter-spacing:1px;">rund</div></div>
    </div>
    <div style="font-size:12px;color:${th.subtitle};margin-top:20px;letter-spacing:1px;">${tLvl.label}</div>
  ` : `
    <div style="font-size:13px;color:${th.subtitle};letter-spacing:3px;font-weight:600;margin-bottom:12px;text-transform:uppercase;">Następna runda</div>
    <div style="font-size:28px;color:${th.accent};font-weight:800;letter-spacing:2px;">Runda ${S.transition.round}</div>
    <div style="font-size:15px;color:${th.subtitle};margin-top:8px;font-weight:500;">z ${tLvl.rounds}</div>
  `;
  return `<div style="position:fixed;inset:0;z-index:70;background:${th.key==='dark'?'rgba(15,14,23,0.95)':'rgba(255,245,220,0.95)'};
    display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);opacity:${S.transition.fading==='in'?1:0};transition:opacity .8s ease-in-out;overflow:hidden;">
    ${particles}
    ${content}
    <div style="width:60px;height:3px;border-radius:2px;background:${th.accent};margin-top:24px;opacity:.4;animation:breathe 2s ease-in-out infinite;"></div>
  </div>`;
}

/* ============ LOGIKA GRY ============ */
function startNewRound(lvl){
  const th=t();
  const L = LEVELS[Math.min(lvl-1, LEVELS.length-1)];
  const picked = pickN(SHAPES, L.shapes);
  const cols = pickN(th.colors, L.shapes);
  const withC = picked.map((s,i)=>({...s, color: cols[i]}));
  const idx = Math.floor(Math.random()*L.shapes);
  S.shownShapes = withC; S.targetShape = withC[idx]; S.targetIndex = idx;
  S.phase = "memorize"; S.feedbackType = null; S.shakeWrong = -1;
  clearTimeout(mTimerRef); clearInterval(mIntRef); cancelAnimationFrame(rafId);

  const mt = L.memorizeMs;
  S.memorizeCountdown = Math.ceil(mt/1000);
  const st = Date.now();
  render();
  mIntRef = setInterval(()=>{
    const newVal = Math.max(0, Math.ceil((mt-(Date.now()-st))/1000));
    if(newVal !== S.memorizeCountdown){
      S.memorizeCountdown = newVal;
      const span = document.getElementById("memCountdown");
      if(span) span.textContent = String(newVal);
    }
  }, 100);
  mTimerRef = setTimeout(()=>{
    clearInterval(mIntRef);
    S.memorizeCountdown = 0;
    S.phase = "guess";
    render();
    runTimer(L.guessMs);
  }, mt);
}

function runTimer(duration){
  const startT = Date.now();
  const fill = document.getElementById("timerFill");
  if(!fill) return;
  function tick(){
    if(S.phase!=="guess"){ return; }
    const elapsed = Date.now()-startT;
    const pct = Math.max(0, 100-(elapsed/duration)*100);
    const f = document.getElementById("timerFill");
    const th = t();
    if(f){
      f.style.width = pct+"%";
      f.style.background = pct>50?th.correct:pct>25?th.gold:th.wrong;
    }
    if(pct<=0){ handleExpire(); return; }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function afterGameRender(){
  if(S.phase==="guess"){ runTimer(ld().guessMs); }
}

function startGame(fromLevel){
  clearTimeout(mTimerRef); clearInterval(mIntRef); cancelAnimationFrame(rafId);
  S.startLevel = fromLevel; S.level = fromLevel; S.roundInLevel = 0;
  S.score = 0; S.lives = 3; S.combo = 0; S.isNewBest=false; S.levelUpBanner=false;
  S.paused=false; S.lifeBanner=false; S.nextLifeAt=LIFE_EVERY; S.isRetry=false;
  S.screen = "game";
  startNewRound(fromLevel);
}

function doPause(){
  if(S.paused || S.phase==="feedback") return;
  clearTimeout(mTimerRef); clearInterval(mIntRef); cancelAnimationFrame(rafId);
  S.paused = true; render();
}
function doResume(){ S.paused=false; startNewRound(S.level); }

function endGame(finalScore, finalLevel){
  const newProg = {...S.progress, bestScores:{...S.progress.bestScores}};
  newProg.unlocked = Math.min(Math.max(newProg.unlocked, finalLevel), 15);
  const prevBest = newProg.bestScores[S.startLevel] || 0;
  const isBest = finalScore > prevBest;
  if(isBest) newProg.bestScores[S.startLevel] = finalScore;
  S.progress = newProg; saveProgress(newProg);
  S.isNewBest = isBest;
  addRecord(S.nick, finalScore, finalLevel).then(r=>{ S.records=r; });
  S.screen = "gameover";
  render();
  clearTimeout(gameOverT);
  gameOverT = setTimeout(()=>{
    if(S.screen==="gameover") goto("records");
  }, 4000);
}

function showTransition(nextRound, nextLvl, isLevelUp, callback){
  clearTimeout(transInT); clearTimeout(transOutT);
  S.transition = { round: nextRound, level: nextLvl, isLevelUp, fading: "in" };
  render();
  const holdTime = isLevelUp ? 4200 : 3200;
  transInT = setTimeout(()=>{
    if(S.transition) S.transition = {...S.transition, fading:"out"};
    render();
    transOutT = setTimeout(()=>{ S.transition = null; callback(); }, 800);
  }, holdTime);
}

function advanceLevel(){
  const nextLvl = Math.min(S.level+1, 15);
  showTransition(1, nextLvl, true, ()=>{
    S.level = nextLvl; S.roundInLevel = 0; S.levelUpBanner = true;
    startNewRound(nextLvl);
    setTimeout(()=>{ S.levelUpBanner=false; render(); }, 1200);
  });
}

function spawnParticles(x,y){
  const th=t();
  const wrap = document.createElement("div");
  wrap.style.cssText = `position:fixed;left:${x}px;top:${y}px;pointer-events:none;z-index:999;`;
  for(let i=0;i<12;i++){
    const ang=(i/12)*360, dist=40+Math.random()*60, sz=4+Math.random()*6;
    const px=Math.cos(ang*Math.PI/180)*dist, py=Math.sin(ang*Math.PI/180)*dist;
    const dot = document.createElement("div");
    dot.style.cssText = `position:absolute;width:${sz}px;height:${sz}px;border-radius:50%;
      background-color:${th.colors[i%th.colors.length]};animation:particleBurst .7s ease-out forwards;
      transform:translate(-50%,-50%);--px:${px}px;--py:${py}px;`;
    wrap.appendChild(dot);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 700);
}

function handleAnswer(index, e){
  if(S.phase!=="guess") return;
  cancelAnimationFrame(rafId);
  const L = ld();
  if(index===S.targetIndex){
    S.isRetry = false;
    const mult = Math.min(S.combo+1,5);
    const pts = 10*mult + S.level*5;
    const newScore = S.score+pts;
    S.score = newScore; S.combo++; S.feedbackType="correct"; S.phase="feedback";
    if(newScore>=S.nextLifeAt && S.lives<MAX_LIVES){
      S.lives = Math.min(S.lives+1, MAX_LIVES);
      S.nextLifeAt += LIFE_EVERY;
      S.lifeBanner = true;
      setTimeout(()=>{ S.lifeBanner=false; render(); }, 1500);
    }
    if(e && e.currentTarget){
      const r = e.currentTarget.getBoundingClientRect();
      spawnParticles(r.left+r.width/2, r.top+r.height/2);
    }
    render();
    const nextRound = S.roundInLevel+1;
    setTimeout(()=>{
      if(nextRound>=L.rounds){ advanceLevel(); }
      else {
        showTransition(nextRound+1, S.level, false, ()=>{
          S.roundInLevel = nextRound;
          startNewRound(S.level);
        });
      }
    }, 800);
  } else {
    S.combo = 0; S.feedbackType = "wrong"; S.shakeWrong = index; S.phase = "feedback";
    S.lives -= 1;
    render();
    const nl = S.lives;
    setTimeout(()=>{
      if(nl<=0) endGame(S.score, S.level);
      else { S.isRetry = true; startNewRound(S.level); }
    }, 1800);
  }
}

function handleExpire(){
  if(S.phase!=="guess") return;
  S.combo=0; S.feedbackType="wrong"; S.phase="feedback";
  S.lives -= 1;
  render();
  const nl = S.lives;
  setTimeout(()=>{
    if(nl<=0) endGame(S.score, S.level);
    else { S.isRetry = true; startNewRound(S.level); }
  }, 1800);
}

/* ============ START ============ */
S.progress = loadProgress();
S.nick = loadNick();
loadRecords().then(r=>{ S.records = r; });
render();
</script>
