<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banki Alicji 3</title>
<style>
  /* te same kolory co Alicja 3 */
  :root{ --nieb:#1f5fd0; --nieb2:#2c72e6; --nieb3:#164bb0; --napis:#eaf2ff; --zloto:#ffd25a; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:"Segoe UI",Arial,sans-serif;color:var(--napis);
       background:radial-gradient(ellipse at 50% 0%,#1d3566,#0a0f1c 70%) fixed;min-height:100vh}
  .gora{display:flex;align-items:center;gap:20px;max-width:1100px;margin:0 auto;padding:28px 4vw 0}
  .wroc{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;text-decoration:none;
        background:#12141acc;border:1px solid #7fb1ff55;color:var(--napis);font-weight:600}
  .wroc:hover{background:#2c72e633}
  h1{margin:6vh 0 0;text-align:center;font-size:clamp(28px,6vh,54px);letter-spacing:.12em;color:#d9e2f2;text-shadow:0 0 24px #2c72e680}
  h1 b{color:var(--zloto)}
  .pod{text-align:center;color:#8fa6cf;letter-spacing:.2em;text-transform:uppercase;font-size:14px;margin-top:10px}
  .pusto{max-width:520px;margin:8vh auto;padding:40px 24px;text-align:center;border:1px dashed #7fb1ff55;border-radius:16px;color:#8fa6cf;font-size:17px}
  .pusto span{display:block;font-size:46px;margin-bottom:10px}
</style>
</head>
<body>
  <div class="gora"><a class="wroc" href="../">← Alicja 3</a></div>
  <h1>BANKI ALICJI <b>3</b></h1>
  <div class="pod">brzmienia .alicja do pobrania</div>
  <div class="pusto"><span>📁</span>na razie pusto</div>
</body>
</html>
