<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Alicja 3</title>
<style>
  :root{
    --nieb:#1f5fd0; --nieb2:#2c72e6; --nieb3:#164bb0; --ciemny:#0d2f74;
    --panel:#1b56c4; --linia:#7fb1ff; --napis:#eaf2ff; --szary:#202430;
    --ekran:#0e1622; --ekranNapis:#7fb8ff; --zloto:#ffd25a; --lampka:#b6ff5a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#15171d;font-family:"Segoe UI",Arial,sans-serif;color:var(--napis);user-select:none}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  #skala{transform-origin:center center}
  #prog{width:1200px;height:880px;background:#1c1f27;border-radius:8px;box-shadow:0 10px 40px #0009;position:relative;overflow:hidden}

  /* ---------- górny pasek ---------- */
  #gora{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(#2a2e38,#1e2129);border-bottom:1px solid #000}
  #logo{font-size:30px;font-weight:700;letter-spacing:1px;color:#d9e2f2}
  #logo b{color:var(--zloto)}
  #brzmienieBox{flex:0 0 520px;height:40px;background:#12141a;border-radius:6px;display:flex;align-items:center;padding:0 12px;gap:10px;border:1px solid #000}
  #brzmienieBox .kat{background:#3a4152;color:#cfd8ea;font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px}
  #nazwaGora{flex:1;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strz{cursor:pointer;font-size:18px;color:#e6ecf8;padding:0 4px}
  .strz:hover{color:var(--zloto)}
  .guzG{height:40px;min-width:54px;background:#12141a;border:1px solid #000;border-radius:6px;font-size:11px;color:#c9d3e6;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .guzG span{font-size:16px}
  .guzG:hover{color:#fff}
  #wyjGora{margin-left:auto;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#c9d3e6}

  /* ---------- niebieska bryła ---------- */
  #bryla{position:absolute;left:10px;right:10px;top:64px;height:676px;border-radius:12px;
         background:linear-gradient(160deg,var(--nieb2) 0%,var(--nieb) 45%,var(--nieb3) 100%);
         box-shadow:inset 0 2px 0 #ffffff40, inset 0 -3px 0 #00000040, 0 4px 14px #0008}
  .sruba{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e9eef6,#7d8796 60%,#3b424d);box-shadow:0 1px 3px #0009}
  .sruba::after{content:"";position:absolute;left:8px;top:8px;width:14px;height:14px;border-radius:50%;background:#2a2f37;box-shadow:inset 0 1px 2px #000}

  .ramka{position:absolute;background:linear-gradient(#2463d3,#1a52bb);border-radius:8px;box-shadow:inset 0 1px 0 #ffffff30, 0 2px 6px #0006}
  .tytul{position:absolute;left:8px;top:8px;right:8px;height:22px;display:flex;align-items:center}
  .tytul b{background:#f2f6fd;color:#1a3f86;font-size:15px;font-weight:600;padding:1px 10px 1px 8px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);min-width:150px}
  .tytul i{flex:1;height:2px;background:#e8f0ff;margin-left:-6px;align-self:flex-start;margin-top:0}

  /* gałki */
  .galka{position:absolute;width:64px;text-align:center}
  .galka .kolo{width:52px;height:52px;margin:0 auto;border-radius:50%;position:relative;cursor:ns-resize;
               background:radial-gradient(circle at 40% 32%,#8b95a5,#4b5361 55%,#2a2f39);
               box-shadow:0 0 0 4px #1a4cb0, 0 0 0 6px #e8f0ff55, 0 3px 6px #0009}
  .galka .kolo::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px dotted #e8f0ffcc}
  .galka .wsk{position:absolute;left:50%;top:6px;width:3px;height:15px;margin-left:-1.5px;background:#fff;border-radius:2px;transform-origin:50% 20px}
  .galka .op{font-size:15px;color:#cfe0ff;margin-top:6px}
  .guzik{position:absolute;width:44px;height:44px;background:linear-gradient(#3a3f4a,#22262e);border-radius:3px;box-shadow:0 2px 3px #0009, inset 0 1px 0 #ffffff20;cursor:pointer}
  .guzik + .op{position:absolute;font-size:15px;color:#e8f0ff}
  .lamp{position:absolute;width:12px;height:12px;border-radius:50%;background:#2f3d1c;box-shadow:inset 0 1px 2px #000}
  .lamp.wl{background:var(--lampka);box-shadow:0 0 8px var(--lampka)}

  /* ekran */
  #obudowa{position:absolute;left:338px;top:12px;width:500px;height:470px;border-radius:14px;
           background:linear-gradient(#2d6fe3,#1748a8);box-shadow:inset 0 2px 0 #ffffff50, 0 4px 10px #0008}
  #obudowa .nap{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:30px;font-weight:700;letter-spacing:4px;color:#fff;
                text-shadow:0 0 0 #fff;font-style:italic}
  #obudowa .nap span{color:var(--zloto)}
  #obudowa .midi{position:absolute;right:36px;top:66px;font-size:15px;display:flex;align-items:center;gap:6px}
  #ekran{position:absolute;left:30px;top:96px;width:440px;height:330px;background:var(--ekran);border:6px solid #0a0d12;border-radius:3px;box-shadow:0 0 0 3px #3c7df0}
  .kolumna{position:absolute;top:12px;height:236px}
  .kolumna .glowa{height:18px;display:flex;align-items:center;margin-bottom:4px}
  .kolumna .glowa b{background:#b9d3f5;color:#0e1d33;font-size:11px;font-weight:600;padding:0 14px 0 8px;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
  .kolumna .glowa i{flex:1;height:1px;background:#b9d3f5;align-self:flex-start}
  .lista{height:210px;overflow-y:auto;font-size:14px;line-height:19px;color:var(--ekranNapis);scrollbar-width:thin;scrollbar-color:#b9d3f5 transparent}
  .lista div{cursor:pointer;white-space:nowrap;padding:0 4px;border-radius:2px}
  .lista div:hover{background:#1d2a3d}
  .lista div.wyb{background:#2c4a78;color:#fff}
  .lista .zapomnij{float:right;color:#5f7da8;font-size:11px;padding:0 3px;border-radius:2px}
  .lista .zapomnij:hover{color:#fff;background:#c0392b}
  .lista .ik{display:inline-block;width:12px;height:12px;margin-right:6px;background:#b9d3f5;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);vertical-align:-1px}
  #kolKat{left:10px;width:200px}
  #kolBrz{left:220px;width:200px}
  #dol{position:absolute;left:10px;right:10px;bottom:10px;height:60px}
  #dol .glowa{display:flex;align-items:center;height:16px}
  #dol .glowa b{background:#b9d3f5;color:#0e1d33;font-size:11px;font-weight:600;padding:0 14px 0 8px;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
  #nazwaEkran{font-size:22px;color:var(--ekranNapis);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:250px}
  #info{position:absolute;right:0;top:0;width:150px;font-size:11px;color:#b9d3f5}
  #zapisWiersz{display:flex;gap:5px;margin-top:8px}
  #nazwaBarwy{width:118px;height:22px;background:#0b1220;border:1px solid #3d5d8f;border-radius:3px;color:#fff;font-size:12px;padding:0 5px;outline:none}
  #nazwaBarwy:focus{border-color:#b9d3f5}
  #nazwaBarwy::placeholder{color:#4f6a96}
  #zapiszBarwe{width:22px;height:22px;padding:0;background:#13203a;border:1px solid #3d5d8f;border-radius:3px;color:#b9d3f5;font-size:14px;line-height:20px;cursor:pointer}
  #zapiszBarwe:hover{border-color:var(--lampka);color:var(--lampka);text-shadow:0 0 4px var(--lampka)}
  #info .pasek{height:6px;background:#22344d;margin:6px 0 0}
  .wskaz{position:absolute;top:52px;width:16px;height:22px;display:flex;flex-direction:column;gap:4px}
  .wskaz i{display:block;height:3px;background:#0f1d3c}

  /* szufladki */
  .szuf{position:absolute;top:36px;width:186px;height:166px;border-radius:6px;background:#123f99;box-shadow:inset 0 2px 5px #0008, inset 0 0 0 1px #6fa2ff55}
  .szuf .nr{position:absolute;left:8px;top:6px;font-size:12px;color:#a9c8ff}
  .szuf .wl{position:absolute;right:8px;top:6px;width:12px;height:12px;border-radius:50%;background:#2f3d1c;box-shadow:inset 0 1px 2px #000;cursor:pointer}
  .szuf .wl.on{background:var(--lampka);box-shadow:0 0 8px var(--lampka)}
  .szuf .miejsce{position:absolute;left:30px;right:8px;top:24px;height:46px;border:2px dashed #6fa2ff88;border-radius:5px;
                 display:flex;align-items:center;justify-content:center;font-size:13px;color:#a9c8ff;text-align:center;padding:0 6px}
  .szuf .miejsce.pelna{border-style:solid;border-color:#b9d3f5;background:#0e1622;color:#fff;font-size:14px}
  .szuf .miejsce.nad{background:#1d55c4;border-color:#fff}
  .szuf.nad{box-shadow:0 0 0 3px var(--lampka), inset 0 2px 5px #0008}
  .szuf .x{position:absolute;right:12px;top:28px;font-size:13px;color:#a9c8ff;cursor:pointer;display:none}
  .szuf .x:hover{color:#fff}
  .suw{position:absolute;left:8px;right:8px;display:flex;align-items:center;gap:5px;font-size:11px;color:#d6e6ff}
  .suw label{width:54px;flex:none}
  .suw output{width:24px;flex:none;text-align:right;font-size:11px;color:#a9c8ff}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:6px;border-radius:3px;background:#0a2a6b;box-shadow:inset 0 1px 2px #000;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff,#a9b4c4);box-shadow:0 1px 3px #000;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff,#a9b4c4);box-shadow:0 1px 3px #000;cursor:pointer}

  /* wyjście */
  .miernik{position:absolute;display:grid;grid-template-columns:12px 12px;gap:3px 4px}
  .miernik i{width:12px;height:9px;border-radius:2px;background:#3b0f12;box-shadow:inset 0 1px 1px #000}
  .miernik i.z{background:#1d3a12}

  /* pasek pod bryłą */
  #pasek{position:absolute;left:0;right:0;top:748px;height:30px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:11px;color:#8d96a8}
  .makro{height:22px;padding:0 10px;white-space:nowrap;flex:none;background:#262a33;border:1px solid #101217;border-radius:11px;display:flex;align-items:center;gap:8px;color:#c4ccdb}
  .makro i{width:14px;height:14px;border-radius:50%;background:#14161b;box-shadow:inset 0 0 0 2px #3a404c}

  /* klawiatura */
  #klawisze{position:absolute;left:10px;right:10px;top:782px;height:90px;background:#101217;border-radius:6px;display:flex;align-items:stretch;padding:6px}
  #kolka{width:70px;display:flex;gap:8px;justify-content:center;padding:4px 0}
  .kolko{width:22px;background:linear-gradient(90deg,#14161b,#30343e,#14161b);border-radius:3px;position:relative;box-shadow:inset 0 0 0 1px #000}
  .kolko i{position:absolute;left:2px;right:2px;height:10px;background:#d9e2f2;border-radius:2px;top:50%;margin-top:-5px}
  #klaw{flex:1;position:relative}
  #klaw .b{position:absolute;top:0;bottom:0;background:linear-gradient(#cdd8ec,#eef3fb);border:1px solid #6f7d96;border-radius:0 0 3px 3px;cursor:pointer}
  #klaw .c{position:absolute;top:0;height:58%;background:linear-gradient(#1f2430,#3a4050);border-radius:0 0 2px 2px;cursor:pointer;z-index:2;box-shadow:0 2px 2px #0008}
  #klaw .b.wc{background:linear-gradient(#9fc0f5,#cfe0fb)}
  #klaw .c.wc{background:linear-gradient(#2c72e6,#5a96f5)}
  .usbGuz{white-space:nowrap;flex:none;margin-left:14px;height:22px;padding:0 10px;background:#262a33;border:1px solid #101217;border-radius:11px;color:#c4ccdb;font-size:11px;cursor:pointer}
  .usbGuz:hover{color:#fff;background:#2f3440}
  #status b{color:#ffd25a}
  .okt{position:absolute;left:6px;top:24px;width:20px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
  .okt span{font-size:9px;line-height:12px;color:#5f86c8;cursor:pointer;width:20px;text-align:center;border-radius:3px}
  .okt span:hover{color:#fff;background:#1d55c4}
  .okt b{font-size:13px;font-weight:700;color:#7f9fd6;line-height:16px}
  .okt b.zm{color:var(--lampka);text-shadow:0 0 4px var(--lampka)}
  .strefy{position:absolute;left:8px;right:8px;top:140px;display:flex;gap:6px}
  .strefy span{flex:1;height:16px;border-radius:8px;background:#0a2a6b;box-shadow:inset 0 1px 2px #000;font-size:11px;line-height:16px;text-align:center;color:#2f4f86;cursor:pointer}
  .strefy span.on{color:var(--lampka);text-shadow:0 0 4px var(--lampka),0 0 9px var(--lampka)}
  #pasekKl{position:absolute;left:86px;right:16px;top:778px;height:4px;display:flex}
  #pasekKl i{flex:1}

  /* ===== POWITANIE: z lewej prawdziwa Alicja 3 w małym (prospekt wtyczki), z prawej foldery ===== */
  #powitanie{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:6vw;
             background:radial-gradient(ellipse at 50% 0%,#1d3566,#0a0f1c 70%);cursor:pointer;transition:opacity 1.5s ease}
  #powitanie.znika{opacity:0;pointer-events:none}
  .powLewa{display:flex;flex-direction:column;align-items:center;gap:2.2vh}
  #powMiejsce{width:min(46vw,calc(62vh*1200/880));aspect-ratio:1200/880}      /* tu staje pomniejszona Alicja 3 */
  .powLewa h1{margin:0;font:700 clamp(28px,6vh,60px) "Segoe UI",Arial,sans-serif;letter-spacing:.12em;color:#d9e2f2;
              text-shadow:0 0 24px #2c72e680;opacity:0;animation:powPojaw 3s ease forwards}
  .powLewa h1 b{color:var(--zloto)}
  .powKliknij{font-size:clamp(13px,2vh,18px);letter-spacing:.25em;text-transform:uppercase;color:#8fa6cf;opacity:0;animation:powMruga 2.4s ease-in-out 3s infinite}
  .powPrawa{display:grid;grid-template-columns:repeat(2,150px);gap:18px;cursor:default;opacity:0;animation:powPojaw 3s ease forwards}
  .powPrawa h2{grid-column:1/-1;margin:0 0 2px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#8fa6cf;font-weight:600}
  .folder{position:relative;height:110px;border:0;background:none;cursor:pointer;color:var(--napis);font:inherit;padding:0}
  .folder::before{content:"";position:absolute;left:8px;top:6px;width:56px;height:18px;border-radius:7px 7px 0 0;background:#2463d3}
  .folder i{position:absolute;left:8px;right:8px;top:18px;bottom:26px;border-radius:4px 10px 10px 10px;
            background:linear-gradient(160deg,var(--nieb2),var(--nieb) 50%,var(--nieb3));box-shadow:inset 0 2px 0 #ffffff40,0 4px 12px #0008}
  .folder span{position:absolute;left:0;right:0;bottom:2px;font-size:13px;color:#b9c6dd}
  .folder:hover i{filter:brightness(1.15)}
  .folder.wkr span{color:var(--zloto)}
  @media (max-width:900px){#powitanie{flex-direction:column;gap:3vh}#powMiejsce{width:min(90vw,calc(40vh*1200/880))}.powPrawa{grid-template-columns:repeat(3,110px)}.folder{height:90px}}
  @keyframes powPojaw{to{opacity:1}}
  @keyframes powMruga{0%,100%{opacity:.35}50%{opacity:1}}
  body.witaj #skala{position:relative;z-index:101;pointer-events:none}          /* mała Alicja leży nad zasłoną, klik przechodzi do zasłony */
  #skala.jedzie{transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
</style>
</head>
<body class="witaj">
<div id="skala">
<div id="prog">

  <!-- górny pasek -->
  <div id="gora">
    <div id="logo">ALICJA <b>3</b></div>
    <div id="brzmienieBox">
      <span class="kat" id="katGora">ORG</span>
      <div id="nazwaGora">Pryncypał 8'</div>
      <span class="strz" id="wstecz">◀</span><span class="strz" id="dalej">▶</span>
    </div>
    <div class="guzG" id="wczytajBank" title="Wczytaj bank .alicja z „Alicja – sampler” (albo zestaw .organy)"><span>📂</span>BANK</div>
    <div class="guzG"><span>☰</span>BARWY</div>
    <div class="guzG"><span>✎</span>EDYTUJ</div>
    <div class="guzG"><span>▤</span>SZUFLADY</div>
    <div class="guzG"><span>⚙</span>USTAW.</div>
    <div id="wyjGora" style="gap:6px">
      <div class="galka" style="position:relative;width:34px"><div class="kolo" style="width:24px;height:24px;box-shadow:0 0 0 2px #444,0 2px 3px #000"><div class="wsk" style="height:8px;top:3px;transform-origin:50% 9px;width:2px"></div></div></div>
      Wyjście
    </div>
  </div>

  <!-- niebieska bryła -->
  <div id="bryla">
    <div class="sruba" style="left:16px;top:90px"></div>
    <div class="sruba" style="right:16px;top:90px"></div>
    <div class="sruba" style="left:16px;top:500px"></div>
    <div class="sruba" style="right:16px;top:500px"></div>

    <!-- lewy panel: Barwa -->
    <div class="ramka" id="lewy" style="left:60px;top:40px;width:256px;height:400px">
      <div class="tytul"><b>Barwa</b><i></i></div>
    </div>

    <!-- prawy panel: Głośność -->
    <div class="ramka" id="prawy" style="right:60px;top:40px;width:256px;height:400px">
      <div class="tytul"><b>Aura</b><i></i></div>
    </div>

    <!-- ekran w środku -->
    <div id="obudowa">
      <div class="wskaz" style="left:18px"><i></i><i></i><i></i></div>
      <div class="wskaz" style="right:18px"><i></i><i></i><i></i></div>
      <div class="nap">ALICJA <span>3</span></div>
      <div class="midi"><span class="lamp" id="lampMidi" style="position:relative"></span>midi</div>
      <div id="ekran">
        <div class="kolumna" id="kolKat"><div class="glowa"><b>kategoria</b><i></i></div><div class="lista" id="listaKat"></div></div>
        <div class="kolumna" id="kolBrz"><div class="glowa"><b>dźwięk</b><i></i></div><div class="lista" id="listaBrz"></div></div>
        <div id="dol">
          <div class="glowa"><b>nazwa</b></div>
          <div id="nazwaEkran">Pryncypał 8'</div>
          <div id="info"><div class="glowa" style="display:flex"><b>zapisz barwę</b></div>
            <div id="zapisWiersz"><input id="nazwaBarwy" maxlength="28" placeholder="nazwa barwy…" title="wpisz nazwę i kliknij kopertkę (albo Enter)"><button id="zapiszBarwe" title="zapisz wszystkie szufladki i Aurę do „Moje barwy”">✉</button></div>
          </div>
        </div>
      </div>
    </div>

    <!-- dolny rząd -->
    <div class="ramka" id="filtrGl" style="left:60px;top:452px;width:256px;height:210px">
      <div class="tytul"><b>Filtr główny</b><i></i></div>
    </div>

    <div class="ramka" id="szuflady" style="left:328px;top:452px;width:680px;height:210px">
      <div class="tytul"><b>Szufladki</b><i></i></div>
    </div>

  </div>

  <!-- pasek pod bryłą -->
  <div id="pasek">
    <span id="status" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b9c6dd" title=""></span>
        <div class="makro"><i></i>Makro 1</div>
    <div class="makro"><i></i>Makro 2</div>
    <div class="makro"><i></i>Makro 3</div>
    <div class="makro"><i></i>Makro 4</div>
    <button id="szukajUsb" class="usbGuz">🔌 Szukaj USB</button><span class="lamp" style="position:relative" id="lampUsb"></span>
  </div>

  <div id="pasekKl"><i style="background:#5ad38a"></i><i style="background:#6e8df5"></i></div>
  <div id="klawisze">
    <div id="kolka"><div class="kolko"><i></i></div><div class="kolko"><i style="top:auto;bottom:4px;margin:0"></i></div></div>
    <div id="klaw"></div>
  </div>
</div>
</div>


<!-- ===== POWITANIE ===== -->
<div id="powitanie">
  <div class="powLewa">
    <div id="powMiejsce"></div>
    <h1>ALICJA <b>3</b></h1>
    <div class="powKliknij">kliknij, aby wejść</div>
  </div>
  <div class="powPrawa" id="powPrawa">
    <h2>Banki</h2>

<script>
// ===== dźwięki na ekranie — prawdziwe nazwy z mini-organy.html i piano-pro-barwy.html =====
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[z]));

/* =====================================================================

   ===================================================================== */
let audio = null, wyjscieAlicji = null, ogrWspolny = null, pogWyslij = null, pogSplot = null;
// pokrętło Pogłos: JEDYNY pogłos w Alicji 3. 0 = zupełnie sucho, na maksa — wyraźnie, ale nie za dużo
let pogloWart = 0, pogloWl = true;
const POGLOS_MAKS = 1.4;              // na maksa: pogłos trochę głośniejszy od czystego dźwięku — jak średni kościół, nie katedra
/* =====================================================================
   PRZESTRZEŃ (po swojemu) — jeden ruch myszką ustawia trzy rzeczy naraz:
   1. ODBICIA: 6 wczesnych odbić od ścian (11–59 ms, im głębiej tym dalej), na zmianę lewo / prawo
   2. GŁĘBIA: długi, ciemny ogon sali — od 1,2 s do 10 s; czysty dźwięk lekko się oddala (cichnie)
   3. SZEROKOŚĆ: stereo środek / boki (M/S) — boki głośniej, plus delikatne rozsunięcie środka (efekt Haasa)

   ===================================================================== */
const PRZ = { v: 0 };
function zbudujPrzestrzen() {
  const A = audio, g = v => { const n = A.createGain(); n.gain.value = v; return n; };
  PRZ.przed = g(1);                                    // tu wpada wszystko: czysty dźwięk, pogłos, odbicia, głębia
  PRZ.sucho = g(1); wyjscieAlicji.connect(PRZ.sucho).connect(PRZ.przed);
  // 1. odbicia
  PRZ.mono = g(1); PRZ.mono.channelCount = 1; PRZ.mono.channelCountMode = 'explicit'; wyjscieAlicji.connect(PRZ.mono);
  PRZ.odbicia = [0.011, 0.017, 0.023, 0.031, 0.043, 0.059].map((t, i) => {
    const d = A.createDelay(0.2), gn = g(0), p = A.createStereoPanner(), ton = A.createBiquadFilter();
    ton.type = 'lowpass'; ton.frequency.value = 6000 - i * 700;            // dalsze odbicie = ciemniejsze
    d.delayTime.value = t; PRZ.mono.connect(d).connect(ton).connect(gn).connect(p).connect(PRZ.przed);
    return { d, gn, p, t, sila: [0.5, 0.42, 0.36, 0.3, 0.24, 0.18][i], strona: i % 2 ? 1 : -1 };
  });

  PRZ.ciemno = A.createBiquadFilter(); PRZ.ciemno.type = 'lowpass'; PRZ.ciemno.frequency.value = 4500;
  PRZ.sala = A.createConvolver(); PRZ.salaGl = g(0);

  PRZ.przed.connect(roz);
  const srodek = g(1), bok = g(1), ujemny = g(-1);
  const lP = g(0.5), pP = g(0.5), lB = g(0.5), pB = g(-0.5);
  roz.connect(lP, 0); roz.connect(pP, 1); lP.connect(srodek); pP.connect(srodek);
  roz.connect(lB, 0); roz.connect(pB, 1); lB.connect(bok); pB.connect(bok);
  PRZ.bok = g(1); bok.connect(PRZ.bok);

  const dA = A.createDelay(0.05), dB = A.createDelay(0.05); dA.delayTime.value = 0.007; dB.delayTime.value = 0.013;

function salaPrzestrzeni(sek) {                         // ogon sali: szum, który gaśnie i ciemnieje (jak pogłos barw Alicji)
  const sr = audio.sampleRate, dl = Math.floor(sr * sek), imp = audio.createBuffer(2, dl, sr);
  for (let k = 0; k < 2; k++) { const d = imp.getChannelData(k); let c = 0;

      c += ((Math.random() * 2 - 1) - c) * j; d[i] = t < .03 ? 0 : c * gas; } }

}
function ustawPrzestrzen(v, liczSale) {
  PRZ.v = v; if (!audio || !PRZ.przed) return;
  const zapamietane = v; v = pogloWl ? v : 0;                       // panel wyłączony: przestrzeń nic nie dodaje
  const t = audio.currentTime, gl = (a, x) => a.setTargetAtTime(x, t, 0.04);
  gl(PRZ.sucho.gain, 1 - v * 0.25);                                 // czysty dźwięk lekko się oddala

/* =====================================================================
   ECHO (ping-pong) — odbicia skaczą na zmianę: lewo, prawo, lewo…
   ekranik: w górę = głośniejsze echo i więcej powtórzeń; suwak = szybkość (czas między odbiciami)
   ===================================================================== */
const ECH = { v: 0, ms: 375 };
function zbudujEcho() {
  const A = audio, g = v => { const n = A.createGain(); n.gain.value = v; return n; };
  ECH.wej = g(0); ECH.wej.channelCount = 1; ECH.wej.channelCountMode = 'explicit';   // echo z całości (mono), potem rozrzucone na boki
  ECH.dL = A.createDelay(2.5); ECH.dP = A.createDelay(2.5);
  ECH.ton = A.createBiquadFilter(); ECH.ton.type = 'lowpass'; ECH.ton.frequency.value = 4000;   // każde odbicie trochę ciemniejsze (jak w barwach Alicji)
  ECH.fb = g(0);
  const zl = A.createChannelMerger(2);
  wyjscieAlicji.connect(ECH.wej).connect(ECH.dL);
  ECH.dL.connect(zl, 0, 0);                                       // pierwsze odbicie: lewo
  ECH.dL.connect(ECH.dP); ECH.dP.connect(zl, 0, 1);               // drugie: prawo
  ECH.dP.connect(ECH.ton).connect(ECH.fb).connect(ECH.dL);        // i wraca — coraz ciszej
  zl.connect(PRZ.przed);                                          // echo też przechodzi przez przestrzeń
  ustawEcho();
}
function ustawEcho() {
  if (!audio || !ECH.wej) return;
  const t = audio.currentTime, gl = (a, x) => a.setTargetAtTime(x, t, 0.04), v = pogloWl ? ECH.v : 0, sek = ECH.ms / 1000;
  gl(ECH.wej.gain, v * 0.55);
  gl(ECH.fb.gain, v < 0.01 ? 0 : 0.15 + v * 0.6);                 // powtórzenia: od kilku do bardzo wielu (najwyżej 0,75 — nigdy się nie „zawiesi”)
  gl(ECH.dL.delayTime, sek); gl(ECH.dP.delayTime, sek);
}

function ustawWspolnyPoglos() { if (pogWyslij) pogWyslij.gain.setTargetAtTime(pogloWl ? pogloWart * POGLOS_MAKS : 0, audio.currentTime, 0.05); }

  wyjscieAlicji = audio.createGain(); wyjscieAlicji.gain.value = 1;
  // ogranicznik na samym końcu: cztery szufladki naraz nie mogą przesterować (tak samo ustawiony jak w organach)
  ogrWspolny = audio.createDynamicsCompressor();
  ogrWspolny.threshold.value = -4; ogrWspolny.knee.value = 0; ogrWspolny.ratio.value = 20; ogrWspolny.attack.value = 0.001; ogrWspolny.release.value = 0.15;
  ogrWspolny.connect(audio.destination);

  zbudujEcho();

  pogWyslij = audio.createGain(); pogWyslij.gain.value = 0; pogSplot = audio.createConvolver();
  { const p = 0.33, sek = 1.2 + p * 5.3, sr = audio.sampleRate, dl = Math.floor(sr * sek), imp = audio.createBuffer(2, dl, sr);
    for (let k = 0; k < 2; k++) { const d = imp.getChannelData(k); let c = 0;
      for (let i = 0; i < dl; i++) { const t = i / sr, g = Math.pow(1 - i / dl, 2.2) * Math.exp(-t * 1.1);
        c += ((Math.random() * 2 - 1) - c) * Math.max(0.04, 0.55 * Math.exp(-t * 0.9)); d[i] = t < 0.018 ? 0 : c * g; } }

  ustawWspolnyPoglos();
  szuflady.forEach(s => { if (s.dzwiek && !s.inst) zbuduj(s); });
}

const ZAKRES_RZEDU = { A: [36, 108], B: [24, 108], C: [36, 96], D: [36, 96], E: [36, 96], F: [36, 96], G: [36, 108], H: [36, 96], J: [36, 96] };

  D: { alikwoty: [1, 0.59, 0.44, 0.35, 0.30, 0.26, 0.23, 0.21, 0.19, 0.18, 0.17, 0.16, 0.15, 0.14, 0.13, 0.12], wejscie: 0.09, oddech: 0.05 },
  E: { formanta: [1500, 900, 30], wejscie: 0.02, oddech: 0 },

  G: { alikwoty: [1, 0.292, 0.087, 0.165, 0.037, 0.014, 0.007, 0.004, 0.004, 0.003], wejscie: 0.22, lagodnie: true, oddech: 0.18,
       vibrato: 6, vibratoHz: 4.6, falowanie: 10 },
  H: { formanta: [2800, 2200, 40], wejscie: 0.012, oddech: 0, przestrzal: 1.25, opad: 0.06, brzek: 35, chrapliwosc: 0.35, zPrzodu: 0.5 },
  J: { rzedy: [[3, 1], [5, 0.667]], alikwoty: [1, 0.04, 0.06, 0.02, 0.10], wejscie: 0.05, oddech: 0.30, oddechStaly: 0.04, pasmo: 5, szerokosc: 0.7 }

function alikwotyRzedu(P, f) {
  if (!P.formanta) return P.alikwoty;
  const [srodek, szer, ile] = P.formanta, a = [];
  for (let k = 1; k < ile; k++) a.push((1 / Math.pow(k, 0.35)) * (0.25 + Math.exp(-Math.pow((f * k - srodek) / szer, 2))) * (P.nieparzyste ? (k % 2 ? P.nieparzyste : 0.8) : 1));

let FALE = null, SZUM = null;
function przygotujOrgany() {
  if (FALE) return; FALE = {};
  SZUM = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
  const d = SZUM.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

  const P = PRZEPISY[r], klucz = P.formanta ? r + Math.round(f) : r;
  if (!FALE[klucz]) { const a = alikwotyRzedu(P, f), re = new Float32Array(a.length + 1), im = new Float32Array(a.length + 1); a.forEach((x, i) => im[i + 1] = x); FALE[klucz] = audio.createPeriodicWave(re, im); }

// jeden głos organów w szufladce — łańcuch jak w startAudio() i ustawPoglos() z mini-organy.html
function nowyGlosOrganow(R, wyjscie) {
  przygotujOrgany();
  const kompresor = audio.createDynamicsCompressor(); kompresor.threshold.value = -14; kompresor.ratio.value = 4;
  const wyjscieGl = audio.createGain(); wyjscieGl.gain.value = 70 / 100 * 0.9;          // głośność organów na start: 70 % × 0,9
  const ogranicznik = audio.createDynamicsCompressor();
  ogranicznik.threshold.value = -4; ogranicznik.knee.value = 0; ogranicznik.ratio.value = 20; ogranicznik.attack.value = 0.001; ogranicznik.release.value = 0.15;
  kompresor.connect(wyjscieGl).connect(ogranicznik).connect(wyjscie);
  const sucho = audio.createGain(), mokro = audio.createGain(), poglos = audio.createConvolver();
  sucho.connect(kompresor); mokro.connect(poglos).connect(kompresor);
  // Alicja 3: głos organów gra NA SUCHO (jak w organach z wyłączonym pogłosem: sucho 1, mokro 0).
  // Cały pogłos daje jedno wspólne pokrętło „pogłos” w prawym panelu.
  sucho.gain.value = 1; mokro.gain.value = 0;

  function dzwiek(n) {                                    // = glosAlicji(R, n) z mini-organy.html
    if (R.doNuty && n > R.doNuty) return () => {};

    const osc0 = [];
    const strona = n % 2 === 0 ? -1 : 1, szer = 0.6 - 0.4 * Math.max(0, Math.min(1, (n - 36) / 60));
    const przes = ((R.id || '').split('').reduce((h, z) => (h * 31 + z.charCodeAt(0)) | 0, 7) % 9) / 100;
    const pan = audio.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, strona * szer + przes));
    const nuta = audio.createGain(); nuta.gain.value = 0;
    const doSucho = audio.createGain(), doMokro = audio.createGain();
    doSucho.gain.value = 1 + (P.zPrzodu || 0) * 0.25; doMokro.gain.value = 1 - (P.zPrzodu || 0) * 0.7;
    pan.connect(doSucho).connect(sucho); doMokro.connect(mokro);
    let wyjscieNuty = nuta;
    if (P.chrapliwosc) { const ws = audio.createWaveShaper(); ws.curve = krzywaChrapania(P.chrapliwosc); ws.oversample = '2x'; nuta.connect(ws); wyjscieNuty = ws; }
    wyjscieNuty.connect(pan); wyjscieNuty.connect(doMokro);
    let zrodloOsc = nuta;
    if (P.falowanie) { const fal = audio.createGain(), fo = audio.createOscillator(), fg = audio.createGain();
      fal.gain.value = 1; fo.frequency.value = 2.6; fg.gain.value = P.falowanie / 100; fo.connect(fg).connect(fal.gain); fal.connect(nuta); fo.start(t); zrodloOsc = fal; osc0.push(fo); }
    const osc = [];
    const skladniki = P.rzedy ? P.rzedy.map(([k, a]) => { let kk = k; while (f * kk > 4200) kk /= 2; return [kk, a * 0.45]; }) : [[1, 1]];
    for (const [k, a] of skladniki) {
      const o = audio.createOscillator(), g = audio.createGain(), wiatr = audio.createOscillator(), wg = audio.createGain();
      o.setPeriodicWave(falaRzedu(R.rzad, f)); o.frequency.value = f * k; o.detune.value = (Math.random() * 2 - 1) * 1.5;
      if (P.brzek) { o.detune.setValueAtTime(P.brzek + o.detune.value, t); o.detune.setTargetAtTime((Math.random() * 2 - 1) * 1.5, t + 0.004, 0.012); }
      wiatr.frequency.value = 3.3 + Math.random() * 1.2; wg.gain.value = STROJ_WIATR; wiatr.connect(wg).connect(o.detune);
      if (P.vibrato) { const vo = audio.createOscillator(), vg = audio.createGain(); vo.frequency.value = P.vibratoHz || 4.5; vg.gain.value = P.vibrato; vo.connect(vg).connect(o.detune); vo.start(t); osc.push(vo); }
      g.gain.value = a; o.connect(g).connect(zrodloOsc); o.start(t); wiatr.start(t); osc.push(o, wiatr);

/* =====================================================================
   BANKI z „Alicja – sampler” (.alicja) i zestawy organów (.organy)
   Bank wczytuje się „wstępnie”: program czyta tylko OPIS (nazwy głosów, gdzie leżą nagrania).
   Kliknięcie głosu = wycinam z pliku i gram tylko jego nagranie próbne (★).
   Głos w szufladce = dopiero wtedy wczytuję wszystkie jego nagrania. ✕ w szufladce zwalnia pamięć.

}
async function dekodujOpus(bajty, op) {                 // z samplera / organów, bez zmian

function nowyGlosSampli(B, g, wyjscie, tylkoProbka = false) {

  return { nazwa: '🎼 ' + B.nazwa, skrot: 'BANK', bank: B,

}

  else { BANKI.push(B); KATEGORIE.push(kategoriaBanku(B)); }

}

  const { opis, baza, glosy, organy } = await czytajNaglowekBanku(plik);
  return { id: (opis.nazwa || plik.name) + '|' + plik.name, nazwa: opis.nazwa || plik.name.replace(/\.\w+$/, ''), nazwaPliku: plik.name, glosy, plik, baza, uchwyt, organy };

// bank zapamiętany, ale jeszcze nie otwarty w tej sesji: przeglądarka raz pyta o zgodę na odczyt pliku
async function otworzBank(B) {
  if (B.plik) return true;
  if (!B.uchwyt) { status(`Bank <b>${esc(B.nazwa)}</b> trzeba wczytać od nowa — kliknij <b>📂 BANK</b>.`); return false; }
  try {
    let zgoda = await B.uchwyt.queryPermission({ mode: 'read' });
    if (zgoda !== 'granted') zgoda = await B.uchwyt.requestPermission({ mode: 'read' });
    if (zgoda !== 'granted') { status(`Bez zgody przeglądarki nie odczytam banku <b>${esc(B.nazwa)}</b>.`); return false; }
    const nowy = await bankZPliku(await B.uchwyt.getFile(), B.uchwyt);
    Object.assign(B, { plik: nowy.plik, baza: nowy.baza, glosy: nowy.glosy });
    // podmieniam tylko dane głosów — lista na ekranie zostaje (przerysowanie pod myszką zrywało przeciąganie)

    return true;
  } catch (e) { status(`✖ Nie mogę otworzyć banku <b>${esc(B.nazwa)}</b> (${esc(e.message)}). Może plik został przeniesiony — wczytaj go od nowa przyciskiem <b>📂 BANK</b>.`); return false; }
}

    status(`📂 Wczytany ${B.organy ? 'zestaw organów' : 'bank'} <b>${esc(B.nazwa)}</b>: ${B.glosy.length} ${B.glosy.length === 1 ? 'głos' : B.glosy.length < 5 ? 'głosy' : 'głosów'}. Kliknij głos — usłyszysz próbkę; przeciągnij do szufladki — wczyta się cały.`); }

  try { const db = await bazaBankow(); const st = db.transaction('banki').objectStore('banki');
    const klucze = await new Promise(ok => { const r = st.getAllKeys(); r.onsuccess = () => ok(r.result); r.onerror = () => ok([]); });
    const wpisy = await new Promise(ok => { const r = st.getAll(); r.onsuccess = () => ok(r.result); r.onerror = () => ok([]); });
    wpisy.forEach((w, i) => { if (!w || !w.uchwyt) return;

  } catch (e) {}
}

// głos z banku: wycinam z pliku TYLKO nagranie próbne (★) i gram je przez 1,2 s — reszty głosu nie wczytuję
async function probkaBanku(d) {
  if (probkaStop) { probkaStop(true); probkaStop = null; } clearTimeout(probkaCzas);
  if (!(await otworzBank(d.bank))) return;
  const g = d.bank.glosy[d.gi], n = klawiszProbki(g); if (n == null) return;
  const klucz = d.bank.id + '|' + d.gi;
  if (probkaNazwa !== klucz) { if (probkaInst) probkaInst.zniszcz(); probkaInst = nowyGlosSampli(d.bank, g, wyjscieAlicji, true); probkaNazwa = klucz; }
  const inst = probkaInst;
  try { await inst.zaladuj(n); } catch (e) { status(`✖ Nie umiem odczytać próbki głosu <b>${esc(d.nazwa)}</b>: ${esc(e.message)}`); return; }
  if (inst !== probkaInst) return;
  probkaStop = inst.dzwiek(n); $("lampMidi").classList.add("wl");
  status(`🔊 Próbka głosu <b>${esc(d.nazwa)}</b> z banku <b>${esc(d.bank.nazwa)}</b> (klawisz ${n}). Przeciągnij go do szufladki, żeby grać.`);
  probkaCzas = setTimeout(() => { if (probkaStop) { probkaStop(); probkaStop = null; } if (!Object.keys(grajace).length) $("lampMidi").classList.remove("wl"); }, 1200);
}
// PRÓBKA: kliknięty dźwięk gra jedną nutę g¹ (67) — tak jak przy wyborze barwy w Piano Pro.
// Barwa gra 350 ms (jak w Piano Pro), głos organów 600 ms (piszczałka potrzebuje chwili, żeby się „rozśpiewać”).
// Próbka ma swój osobny dźwięk — nie rusza szufladek.
let probkaInst = null, probkaNazwa = null, probkaStop = null, probkaCzas = null;
function probka() {
  const d = KATEGORIE[katNr].dzwieki[dzwNr]; if (!d || d.typ === 'moja') return;   // „Moja barwa” to cały zestaw — wczytuje się dwuklikiem
  startAudio();
  if (d.typ === 'sample') { probkaBanku(d); return; }
  if (probkaStop) { probkaStop(true); probkaStop = null; } clearTimeout(probkaCzas);
  if (probkaNazwa !== d.nazwa) {
    if (probkaInst) probkaInst.zniszcz();
    probkaInst = d.typ === 'organy' ? nowyGlosOrganow(d.R, wyjscieAlicji) : nowaBarwa(d.nazwa, wyjscieAlicji);
    probkaNazwa = d.nazwa;
  }
  probkaStop = probkaInst.organy ? probkaInst.dzwiek(67) : probkaInst.dzwiek(67, .8);
  $("lampMidi").classList.add("wl");
  probkaCzas = setTimeout(() => { if (probkaStop) { probkaStop(); probkaStop = null; } if (!Object.keys(grajace).length) $("lampMidi").classList.remove("wl"); },
                          probkaInst.organy ? 600 : 350);
}

/* ===== EKRANIKI: siatka w głębi jak w tle u Alicji — złap i ciągnij w górę / w dół ===== */
function ekranik({ top, napis, wartosc, rysujFale, zmiana, puszczenie, opisStatus, dymek }) {
  const SZ = 228, WY = 84, c = document.createElement('canvas'), dpr = 2;
  c.width = SZ * dpr; c.height = WY * dpr;
  Object.assign(c.style, { position: 'absolute', left: '14px', top: top + 'px', width: SZ + 'px', height: WY + 'px', borderRadius: '6px', cursor: 'ns-resize',
    boxShadow: 'inset 0 2px 5px #000, 0 0 0 2px #0a2a6b, 0 0 0 3px #6fa2ff55' });
  c.title = dymek; PP.appendChild(c);
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  let v = wartosc, faza = 0;
  (function rysuj() {
    faza += 0.02; x.clearRect(0, 0, SZ, WY);
    const tlo = x.createLinearGradient(0, 0, 0, WY); tlo.addColorStop(0, '#05081c'); tlo.addColorStop(1, '#0d1846'); x.fillStyle = tlo; x.fillRect(0, 0, SZ, WY);
    const hor = WY * (0.40 - v * 0.22), sx = SZ / 2;
    x.save(); x.beginPath(); x.rect(0, hor, SZ, WY - hor); x.clip(); x.lineWidth = 1;
    for (let k = -12; k <= 12; k++) { const dol = sx + k * (SZ / 8) * (1 + v * 0.8);
      x.strokeStyle = k === 0 ? '#7fb1ffcc' : '#3a4fb0aa'; x.beginPath(); x.moveTo(sx + k * 2, hor); x.lineTo(dol, WY); x.stroke(); }
    const ile = 7 + Math.round(v * 9), przesun = (faza * (0.3 + v)) % 1;
    for (let k = 0; k < ile; k++) { const u = (k + przesun) / ile, y = hor + (WY - hor) * u * u;
      x.strokeStyle = `rgba(90,120,230,${0.25 + 0.6 * u})`; x.beginPath(); x.moveTo(0, y); x.lineTo(SZ, y); x.stroke(); }
    x.restore();
    const blask = x.createLinearGradient(0, hor - 6, 0, hor + 6); blask.addColorStop(0, 'rgba(127,177,255,0)'); blask.addColorStop(.5, 'rgba(127,177,255,.55)'); blask.addColorStop(1, 'rgba(127,177,255,0)');
    x.fillStyle = blask; x.fillRect(0, hor - 6, SZ, 12);
    const luk = (cx, cy, strona, a, R = 15) => { x.strokeStyle = `rgba(182,255,90,${a})`; x.lineWidth = 2.5; x.shadowColor = '#b6ff5a'; x.shadowBlur = 10 * a;
      x.beginPath(); x.arc(cx, cy, R, strona < 0 ? Math.PI * 0.7 : -Math.PI * 0.3, strona < 0 ? Math.PI * 1.3 : Math.PI * 0.3); x.stroke(); x.shadowBlur = 0; };
    rysujFale(x, v, faza, luk, SZ, WY);
    x.fillStyle = '#b9d3f5'; x.font = '10px Segoe UI, Arial'; x.textAlign = 'left'; x.fillText(napis, 6, 12);
    x.textAlign = 'right'; x.fillText(Math.round(v * 100) + '%', SZ - 6, 12);
    requestAnimationFrame(rysuj);
  })();
  const zmien = (nowa, koniec) => { v = Math.max(0, Math.min(1, nowa)); zmiana(v); if (koniec && puszczenie) puszczenie(v); status(opisStatus(v)); };
  c.onpointerdown = e => { startAudio(); c.setPointerCapture(e.pointerId); const y0 = e.clientY, v0 = v;
    c.onpointermove = m => zmien(v0 + (y0 - m.clientY) / (m.shiftKey ? 500 : 140), false);
    c.onpointerup = () => { c.onpointermove = null; zmien(v, true); }; };
  c.ondblclick = () => zmien(0, true);
  c.onwheel = e => { e.preventDefault(); startAudio(); zmien(v - Math.sign(e.deltaY) * 0.04, true); };
  c.ustaw = nv => { v = Math.max(0, Math.min(1, nv)); zmiana(v); if (puszczenie) puszczenie(v); };
  return c;
}

const EK_PRZ = ekranik({ top: 152, napis: 'przestrzeń', wartosc: PRZ.v,
  dymek: 'Przestrzeń: złap i ciągnij w górę (głębiej i szerzej) albo w dół. Dwuklik = bez przestrzeni.',
  zmiana: v => ustawPrzestrzen(v, false), puszczenie: v => ustawPrzestrzen(v, true),   // ogon sali liczy się po puszczeniu
  opisStatus: v => `Przestrzeń: <b>${Math.round(v * 100)}%</b> — sala ok. ${(1.2 + v * 8.8).toFixed(1).replace('.', ',')} s, ${v < .05 ? 'bez przestrzeni' : v < .4 ? 'trochę szerzej' : v < .75 ? 'szeroko i głęboko' : 'bardzo szeroko i głęboko'}`,
  rysujFale(x, v, faza, luk, SZ, WY) {
    const cy = WY * 0.62, roz = 7 + v * 78, sx = SZ / 2, slady = Math.round(v * 4);
    for (let j = slady; j >= 1; j--) { const a = 0.5 * (1 - j / (slady + 1)) * (0.6 + 0.4 * Math.sin(faza * 3 - j)); luk(sx - roz + j * 9, cy, -1, a); luk(sx + roz - j * 9, cy, 1, a); }
    luk(sx - roz, cy, -1, 1); luk(sx + roz, cy, 1, 1);
  } }); EK_PRZ.id = 'przestrzen';

// ECHO: od środka odbicia skaczą na zmianę w lewo i w prawo, coraz dalej i coraz słabsze
const EK_ECH = ekranik({ top: 248, napis: 'echo', wartosc: ECH.v,
  dymek: 'Echo: złap i ciągnij w górę (głośniej i więcej powtórzeń) albo w dół. Dwuklik = bez echa.',
  zmiana: v => { ECH.v = v; ustawEcho(); },
  opisStatus: v => `Echo: <b>${Math.round(v * 100)}%</b> — ${v < .01 ? 'bez echa' : 'powtórzenia gasną po ok. ' + Math.max(1, Math.round(Math.log(0.05) / Math.log(0.15 + v * 0.6))) + ' odbiciach'}, co ${ECH.ms} ms`,
  rysujFale(x, v, faza, luk, SZ, WY) {
    const cy = WY * 0.62, sx = SZ / 2, fb = v < 0.01 ? 0 : 0.15 + v * 0.6;
    const krok = 8 + 22 * Math.log(ECH.ms / 60) / Math.log(1000 / 60);           // szybkie echo = odbicia gęsto, wolne = rzadko
    const ruch = (faza * (420 / ECH.ms)) % 1;                                     // fala biegnie z prędkością echa
    luk(sx - 7, cy, -1, 1, 11); luk(sx + 7, cy, 1, 1, 11);                        // źródło dźwięku na środku
    if (v < 0.01) return;
    let a = 0.95;
    for (let j = 1; j <= 9 && a > 0.04; j++) {
      const strona = j % 2 ? -1 : 1, dx = 7 + (Math.ceil(j / 2) - 1 + ruch) * krok + krok * 0.6;
      if (dx > SZ / 2 - 6) break;
      luk(sx + strona * dx, cy, strona, a * (0.55 + 0.45 * v), 11 + j * 0.8);
      a *= j === 1 ? 1 : fb;
    }
  } });

    const [k, d] = (e.dataTransfer.getData("text/plain") || "").split(":").map(Number); let dz = KATEGORIE[k] && KATEGORIE[k].dzwieki[d];
    if (!dz) { status(`Szufladka ${i + 1}: tu można upuścić tylko dźwięk z listy na ekranie.`); return; }
    if (dz.typ === 'moja') { status(`„Moja barwa” to cały zestaw szufladek — wczytaj ją <b>dwuklikiem</b> na liście.`); return; }
    if (dz.typ === 'sample' && !dz.bank.plik) {          // bank zapamiętany, jeszcze zamknięty: najpierw go odblokuj
      status(`Odblokowuję bank <b>${esc(dz.bank.nazwa)}</b>…`);
      if (!(await otworzBank(dz.bank))) { status(`Szufladka ${i + 1}: bank <b>${esc(dz.bank.nazwa)}</b> jest jeszcze zamknięty — <b>kliknij jego nazwę</b> w kategoriach (przeglądarka zapyta o zgodę) i przeciągnij jeszcze raz.`); return; }
      dz = KATEGORIE[k].dzwieki[d]; }
    oproznij(s); s.dzwiek = dz; s.wlaczona = true; startAudio(); zbuduj(s); s.odswiez();
    status(`Szufladka ${i + 1}: <b>${esc(dz.nazwa)}</b>${dz.typ === 'sample' ? ' — wczytuję cały głos…' : '. Graj!'}`); };
  x.onclick = () => { oproznij(s); m.textContent = "przeciągnij tu dźwięk"; m.classList.remove("pelna"); x.style.display = "none"; wl.classList.remove("on"); };
  wl.onclick = () => { if (!s.dzwiek) return; s.wlaczona = !s.wlaczona; wl.classList.toggle("on", s.wlaczona); ustawGlosnosc(s); };
  const [g, p] = el.querySelectorAll("input"), [og, op] = el.querySelectorAll("output");
  g.oninput = () => { og.textContent = g.value; s.glosnosc = g.value / 100; ustawGlosnosc(s); };
  p.oninput = () => { op.textContent = p.value == 0 ? "Ś" : (p.value < 0 ? "L" + (-p.value) : "P" + p.value); s.panorama = p.value / 50; if (s.pan) s.pan.pan.setTargetAtTime(s.panorama, audio.currentTime, 0.02); };
  p.ondblclick = () => { p.value = 0; p.oninput(); };
  g.ondblclick = () => { g.value = 100; g.oninput(); };
  // podział klawiatury: lewa / prawa; oba włączone albo oba wyłączone = cała klawiatura
  const bL = el.querySelector(".sL"), bP = el.querySelector(".sP");
  const pokazStrefy = () => { bL.classList.toggle("on", s.lewa); bP.classList.toggle("on", s.prawa);
    status(`Szufladka ${i + 1}: ${s.lewa === s.prawa ? 'cała klawiatura' : s.lewa ? 'lewa strona (poniżej c¹)' : 'prawa strona (od c¹ w górę)'}`); };
  bL.onclick = () => { s.lewa = !s.lewa; pokazStrefy(); };
  // transpozycja o oktawę: od −2 do +2
  const oB = el.querySelector(".okt b");
  const pokazOkt = () => { oB.textContent = s.okt > 0 ? '+' + s.okt : s.okt; oB.classList.toggle('zm', s.okt !== 0);
    status(`Szufladka ${i + 1}: ${s.okt === 0 ? 'bez transpozycji' : (s.okt > 0 ? 'o ' + s.okt : 'o ' + (-s.okt)) + (Math.abs(s.okt) === 1 ? ' oktawę ' : ' oktawy ') + (s.okt > 0 ? 'w górę' : 'w dół')}`); };
  el.querySelector(".oG").onclick = () => { s.okt = Math.min(2, s.okt + 1); pokazOkt(); };
  el.querySelector(".oD").onclick = () => { s.okt = Math.max(-2, s.okt - 1); pokazOkt(); };

  s.odswiez = () => {
    if (s.dzwiek) { m.textContent = s.dzwiek.nazwa; m.classList.add("pelna"); x.style.display = "block"; }
    else { m.textContent = "przeciągnij tu dźwięk"; m.classList.remove("pelna"); x.style.display = "none"; }
    wl.classList.toggle("on", !!s.dzwiek && s.wlaczona);

    p.value = Math.round(s.panorama * 50); op.textContent = p.value == 0 ? "Ś" : (p.value < 0 ? "L" + (-p.value) : "P" + p.value);
    bL.classList.toggle("on", s.lewa); bP.classList.toggle("on", s.prawa);
    oB.textContent = s.okt > 0 ? '+' + s.okt : s.okt; oB.classList.toggle('zm', s.okt !== 0);
  };
}

/* =====================================================================
   GRANIE — kto trzyma nutę: mysz, klawiatura komputera, USB (jak w organach)
   ===================================================================== */
const grajace = {};          // nuta → Map(szufladka → stop)
// PODZIAŁ KLAWIATURY: lewa strona to nuty poniżej c¹ (60), prawa — od c¹ w górę
const PODZIAL = 60;
const naStronie = (s, n) => s.lewa === s.prawa || (s.lewa ? n < PODZIAL : n >= PODZIAL);
const zrodla = {};
const trzymane = new Set(); let pedal = false;
function wcisnij(n, z = 'mysz', sila = .8) {
  startAudio(); (zrodla[n] = zrodla[n] || new Set()).add(z);
  if (grajace[n]) return;
  const m = new Map();
  szuflady.forEach(s => { if (!s.inst || !naStronie(s, n)) return;
    const nn = Math.max(0, Math.min(127, n + s.okt * 12));                     // transpozycja szufladki
    m.set(s, s.inst.organy ? s.inst.dzwiek(nn) : s.inst.dzwiek(nn, sila)); });
  grajace[n] = m; trzymane.add(n);
  document.querySelectorAll(`#klaw [data-n="${n}"]`).forEach(k => k.classList.add("wc"));
  $("lampMidi").classList.add("wl");
}
function pusc(n, z = 'mysz', szybko = false) {
  if (zrodla[n]) { zrodla[n].delete(z); if (zrodla[n].size) return; delete zrodla[n]; }
  trzymane.delete(n);
  document.querySelectorAll(`#klaw [data-n="${n}"]`).forEach(k => k.classList.remove("wc"));
  if (!grajace[n]) return;
  if (pedal && !szybko) return;                        // pedał sustain trzyma dźwięk (jak w Piano Pro)
  grajace[n].forEach(st => st(szybko)); delete grajace[n];
  if (!Object.keys(grajace).length) $("lampMidi").classList.remove("wl");
}
function ustawPedal(w) {
  pedal = w;
  if (!pedal) for (const n in grajace) if (!trzymane.has(+n)) { grajace[n].forEach(st => st()); delete grajace[n]; }
  if (!Object.keys(grajace).length) $("lampMidi").classList.remove("wl");
}

/* ===== klawiatura na ekranie: 61 klawiszy (C2–C7), można przeciągać po klawiszach ===== */
const KL = $("klaw"), OD = 36, DO = 96, czarne = [1, 3, 6, 8, 10];
const biale = []; for (let n = OD; n <= DO; n++) if (!czarne.includes(n % 12)) biale.push(n);
const szer = 100 / biale.length;
{ const ileLewych = biale.filter(n => n < PODZIAL).length, pk = document.querySelectorAll('#pasekKl i');
  pk[0].style.flex = ileLewych; pk[1].style.flex = biale.length - ileLewych; }
biale.forEach((n, i) => { const d = document.createElement("div"); d.className = "b"; d.dataset.n = n; d.style.left = (i * szer) + "%"; d.style.width = szer + "%"; KL.appendChild(d); });
for (let n = OD; n <= DO; n++) if (czarne.includes(n % 12)) {
  const i = biale.indexOf(n - 1); const d = document.createElement("div"); d.className = "c"; d.dataset.n = n;
  d.style.left = ((i + 1) * szer - szer * 0.32) + "%"; d.style.width = (szer * 0.64) + "%"; KL.appendChild(d);
}
(() => { let mysz = false;
  KL.addEventListener('pointerdown', e => { const k = e.target.closest('[data-n]'); if (!k) return; mysz = true; e.preventDefault(); KL.setPointerCapture(e.pointerId); wcisnij(+k.dataset.n, 'mysz'); });
  KL.addEventListener('pointermove', e => { if (!mysz) return; const k = document.elementFromPoint(e.clientX, e.clientY)?.closest('#klaw [data-n]'), n = k ? +k.dataset.n : -1;
    for (const g in zrodla) if (+g !== n && zrodla[g].has('mysz')) pusc(+g, 'mysz'); if (n >= 0) wcisnij(n, 'mysz'); });
  const koniec = () => { mysz = false; for (const g in zrodla) if (zrodla[g].has('mysz')) pusc(+g, 'mysz'); };
  KL.addEventListener('pointerup', koniec); KL.addEventListener('pointercancel', koniec);
})();
// klawiatura komputera — jak w organach: dolny rząd od c (48), górny od c¹ (60)
const KOMPUTER = { KeyZ: 48, KeyS: 49, KeyX: 50, KeyD: 51, KeyC: 52, KeyV: 53, KeyG: 54, KeyB: 55, KeyH: 56, KeyN: 57, KeyJ: 58, KeyM: 59, Comma: 60,
                   KeyQ: 60, Digit2: 61, KeyW: 62, Digit3: 63, KeyE: 64, KeyR: 65, Digit5: 66, KeyT: 67, Digit6: 68, KeyY: 69, Digit7: 70, KeyU: 71, KeyI: 72 };
addEventListener('keydown', e => { if (e.target && e.target.id === 'nazwaBarwy') return; if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return; const n = KOMPUTER[e.code]; if (n == null) return; e.preventDefault(); wcisnij(n, 'klaw'); });
addEventListener('keyup', e => { const n = KOMPUTER[e.code]; if (n == null) return; pusc(n, 'klaw'); });
addEventListener('blur', () => { for (const g in zrodla) { pusc(+g, 'klaw'); pusc(+g, 'mysz'); } });

/* ===== klawiatura sterująca USB (MIDI) — jak w Piano Pro: siła uderzenia i pedał sustain ===== */
const status = t => { $("status").innerHTML = t; };
let midi = null;
$("szukajUsb").onclick = async () => {
  startAudio();
  if (!navigator.requestMIDIAccess) { status('Ta przeglądarka nie umie łączyć się z MIDI (np. Safari). Użyj <b>Chrome</b> albo <b>Edge</b>.'); return; }
  status('Szukam urządzeń MIDI… (przeglądarka może zapytać o zgodę)');
  try { midi = await navigator.requestMIDIAccess(); }
  catch (e) { status('Nie dostałam dostępu do MIDI. Zezwól na to w przeglądarce.'); return; }
  podlacz(); midi.onstatechange = podlacz;
};
function podlacz() {
  const wejscia = [...midi.inputs.values()];
  wejscia.forEach(w => w.onmidimessage = wiadomoscMidi);
  $("lampUsb").classList.toggle('wl', wejscia.length > 0);
  status(wejscia.length ? '✔ Wykryto: ' + wejscia.map(w => `<b>${w.name}</b>`).join(', ') + '. Graj!'
                        : 'Nie widzę klawiatury MIDI. <b>Podłącz ją przez USB</b>, a wykryję ją sama.');
}
function wiadomoscMidi(e) {
  const [bajt, nuta, wartosc] = e.data, rodzaj = bajt & 0xf0;
  if (rodzaj === 0x90 && wartosc > 0) wcisnij(nuta, 'midi', wartosc / 127);
  else if (rodzaj === 0x80 || (rodzaj === 0x90 && wartosc === 0)) pusc(nuta, 'midi');
  else if (rodzaj === 0xb0 && nuta === 64) ustawPedal(wartosc >= 64);
  else if (rodzaj === 0xb0 && (nuta === 120 || nuta === 123)) for (const g in grajace) { zrodla[g] = new Set(['midi']); pusc(+g, 'midi', true); }
}

/* =====================================================================
   MOJE BARWY — zapis całego zestawu: 4 szufladki (dźwięk, głośność, panorama, wł., lewa/prawa, oktawa)
   i Aura (wł., pogłos, przestrzeń, echo, szybkość echa). Leżą w pamięci tej przeglądarki.
   ===================================================================== */
const KLUCZ_MOICH = 'alicja3-moje-barwy';
function czytajMoje() { try { return JSON.parse(localStorage.getItem(KLUCZ_MOICH) || '[]'); } catch (e) { return []; } }
function pokazMoje() { KATEGORIE[2].dzwieki = czytajMoje().map(b => ({ nazwa: b.nazwa, typ: 'moja', dane: b })); }
function zapiszBarwe() {
  if (!szuflady.some(s => s.dzwiek)) { status('Najpierw przeciągnij dźwięk do szufladki — pusty zestaw nie ma czego zapisać.'); return; }
  const lista = czytajMoje();
  let nazwa = $('nazwaBarwy').value.trim(); if (!nazwa) { let k = lista.length + 1; while (lista.some(b => b.nazwa === 'Moja barwa ' + k)) k++; nazwa = 'Moja barwa ' + k; }
  const barwa = { nazwa, wersja: 1,
    szuflady: szuflady.map(s => ({ dzwiek: s.dzwiek ? { typ: s.dzwiek.typ, id: s.dzwiek.typ === 'organy' ? s.dzwiek.R.id : s.dzwiek.nazwa, ...(s.dzwiek.typ === 'sample' ? { bank: s.dzwiek.bank.nazwa } : {}) } : null,
      glosnosc: s.glosnosc, panorama: s.panorama, wlaczona: s.wlaczona, lewa: s.lewa, prawa: s.prawa, okt: s.okt })),
    aura: { wl: pogloWl, poglos: pogloWart, przestrzen: PRZ.v, echo: ECH.v, echoMs: ECH.ms } };
  const byla = lista.findIndex(b => b.nazwa === nazwa);
  if (byla >= 0) lista[byla] = barwa; else lista.push(barwa);
  try { localStorage.setItem(KLUCZ_MOICH, JSON.stringify(lista)); }
  catch (e) { status('Nie udało się zapisać — ta przeglądarka nie pozwala tu zapisywać.'); return; }
  pokazMoje(); katNr = 2; dzwNr = KATEGORIE[2].dzwieki.findIndex(d => d.nazwa === nazwa); rysujKategorie(); rysujDzwieki(); pokazNazwe();
  $('nazwaBarwy').value = '';
  status(`✉ Zapisano <b>${nazwa}</b> w „Moje barwy”${byla >= 0 ? ' (podmieniona barwa o tej samej nazwie)' : ''}. Dwuklik na nazwie wczytuje.`);
}
async function wczytajBarwe(b) {
  startAudio(); const brakuje = [];
  // głosy z zapamiętanych banków: najpierw odblokowuję ich pliki
  for (const z of b.szuflady || []) if (z && z.dzwiek && z.dzwiek.typ === 'sample') { const B = BANKI.find(x => x.nazwa === z.dzwiek.bank); if (B && !B.plik) await otworzBank(B); }
  for (const n in grajace) { grajace[n].forEach(st => st(true)); delete grajace[n]; }
  szuflady.forEach((s, i) => {
    oproznij(s); const z = b.szuflady[i] || {};
    s.glosnosc = z.glosnosc ?? 1; s.panorama = z.panorama ?? 0; s.wlaczona = z.wlaczona ?? true; s.lewa = !!z.lewa; s.prawa = !!z.prawa; s.okt = z.okt || 0;
    if (z.dzwiek) s.dzwiek = z.dzwiek.typ === 'organy' ? KATEGORIE[0].dzwieki.find(d => d.R.id === z.dzwiek.id)
      : z.dzwiek.typ === 'sample' ? (KATEGORIE.find(k => k.bank && k.bank.nazwa === z.dzwiek.bank) || { dzwieki: [] }).dzwieki.find(d => d.nazwa === z.dzwiek.id)
      : KATEGORIE[1].dzwieki.find(d => d.nazwa === z.dzwiek.id);
    if (z.dzwiek && !s.dzwiek && z.dzwiek.typ === 'sample') brakuje.push(`${z.dzwiek.id} (bank ${z.dzwiek.bank})`);
    s.dzwiek = s.dzwiek || null; s.odswiez(); zbuduj(s);
  });
  const a = b.aura || {};
  GALKA_POGLOS.ustaw(a.poglos ?? 0); ECH.ustawSuwak(a.echoMs ?? 375);
  EK_PRZ.ustaw(a.przestrzen ?? 0); EK_ECH.ustaw(a.echo ?? 0); PANEL_WL.ustaw(a.wl ?? true);
  status(`Wczytano <b>${b.nazwa}</b>: ${szuflady.filter(s => s.dzwiek).map(s => s.dzwiek.nazwa).join(' + ')}. Graj!` + (brakuje.length ? `<br>⚠ Brakuje głosów: ${brakuje.map(esc).join(', ')} — wczytaj ten bank przyciskiem 📂 BANK.` : ''));
}
$('zapiszBarwe').onclick = zapiszBarwe;
